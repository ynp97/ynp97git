<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>早天原稿</title><link rel="stylesheet" href="/reader.css"><script type="module" src="/reader.js"></script></head>
<body><header><strong>早天原稿</strong><label class="file-button">PDFを選ぶ<input id="pdfFile" type="file" accept="application/pdf,.pdf"></label><span id="filename"></span><span id="status" role="status"></span></header>
<main><nav><button id="prev" title="前のページ">← 前</button><span id="counter">—</span><button id="next" title="次のページ">次 →</button><label title="PDFのページをめくると、このページに指定した聖句がOBSへ出ます。矢印キーでもページを送れます。選び直した対応はこのMacに保存されます。">表示<select id="mapping"></select></label><button id="nextVerse" title="同じ原稿ページ内で次の聖句を出す">聖句を次へ</button></nav>
<div class="sheet"><canvas id="page" aria-label="PDF原稿のページ"></canvas></div>
</main></body></html>
