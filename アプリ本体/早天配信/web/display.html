<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>早天 聖書表示</title><link rel="stylesheet" href="/display.css"><script defer src="/display.js"></script></head><body><div id="stage" hidden><div id="heading"><span id="day"></span><span id="reference"></span></div><section id="panel"><div id="titleView"><p id="titleCaption">本日の聖書箇所</p><h1 id="title"></h1></div><div id="bodyView" hidden><h2 id="verse"></h2><p id="text"></p><span id="page"></span><small>聖書 新改訳2017 ©2017 新日本聖書刊行会</small></div><div id="prayerView" hidden><h2>主の祈り</h2><p id="prayerText">天にまします我らの父よ。
願わくはみ名をあがめさせたまえ。
み国を来たらせたまえ。
みこころの天になるごとく、
地にもなさせたまえ。
我らの日用の糧を今日も与えたまえ。
我らに罪をおかす者を我らがゆるすごとく、
我らの罪をもゆるしたまえ。
我らをこころみにあわせず、
悪より救い出したまえ。
国と力と栄とは限りなく
なんじのものなればなり。
アーメン。</p></div></section></div></body></html>
