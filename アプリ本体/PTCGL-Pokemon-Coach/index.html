<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PTCGL ポケカコーチ</title>
  <style>
    :root{--ink:#17211d;--muted:#68736d;--paper:#f4f1e8;--card:#fffdf7;--green:#245c45;--lime:#d8ef76;--orange:#ff9b54;--red:#b84343;--line:#d9d5ca;--blue:#456b91}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}
    header{background:var(--green);color:white;padding:24px max(20px,calc((100vw - 1180px)/2));display:flex;align-items:center;gap:15px}
    .mark{width:49px;height:49px;border-radius:50%;background:var(--lime);color:var(--green);display:grid;place-items:center;font-size:26px;font-weight:900;border:5px solid white}
    h1{font-size:22px;margin:0}.sub{opacity:.8;font-size:13px;margin-top:3px}main{max-width:1180px;margin:auto;padding:24px 20px 80px}
    .grid{display:grid;grid-template-columns:minmax(330px,.92fr) minmax(420px,1.45fr);gap:20px;align-items:start}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:19px;box-shadow:0 4px 18px #30473a0b}.sticky{position:sticky;top:16px}
    h2{font-size:17px;margin:0 0 13px}textarea{width:100%;min-height:450px;resize:vertical;border:1px solid #bbb8ae;border-radius:12px;padding:14px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;background:#fff}.deckInput{min-height:150px;margin-top:8px}.inputSection{margin-top:18px;padding-top:17px;border-top:1px solid var(--line)}
    button,.fileLabel{border:0;border-radius:11px;padding:11px 15px;font-weight:750;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--green);color:#fff;flex:1}.secondary,.fileLabel{background:#e9e5da;color:var(--ink)}.danger{background:#f4dfda;color:#8d302b}.buttons{display:flex;gap:9px;margin-top:11px}.hint{font-size:12px;color:var(--muted);margin:9px 2px 0;line-height:1.55}.hidden{display:none!important}input[type=text],select{width:100%;border:1px solid #bbb8ae;border-radius:10px;padding:10px 11px;background:#fff;font:13px inherit}.deckControls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.deckButtons{display:flex;gap:7px;margin-top:8px}.deckButtons button{padding:9px 11px;font-size:12px}
    .empty{text-align:center;padding:80px 25px;color:var(--muted)}.empty .ball{font-size:56px;margin-bottom:12px}.score{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:17px}.metric{background:#f0ede4;border-radius:13px;padding:12px}.metric b{font-size:21px;display:block;margin-top:4px}.metric span{font-size:11px;color:var(--muted)}
    .result{padding:16px;border-radius:14px;margin-bottom:15px;background:#e8eee8;border-left:7px solid var(--green)}.result.loss{background:#f5e5df;border-color:var(--orange)}.result h2{margin:0 0 5px;font-size:21px}.result p{margin:0;color:var(--muted);font-size:13px}
    .coach{display:grid;gap:10px;margin:10px 0 18px}.advice{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:38px 1fr;gap:10px}.advice .icon{width:35px;height:35px;border-radius:10px;background:#eee9dc;display:grid;place-items:center;font-size:18px}.advice strong{font-size:14px}.advice p{font-size:13px;color:#4e5953;line-height:1.55;margin:5px 0 0}.advice.risk{border-left:5px solid var(--orange)}.advice.good{border-left:5px solid var(--green)}
    .sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:21px 0 10px}.sectionTitle h2{margin:0}.turn{border:1px solid var(--line);border-radius:13px;margin-bottom:8px;overflow:hidden}.turn summary{padding:12px 14px;cursor:pointer;font-size:13px;font-weight:750;background:#faf8f1;display:flex;justify-content:space-between}.turn.mine summary{background:#edf4d0}.events{padding:8px 14px 13px}.event{font-size:12px;line-height:1.55;border-left:2px solid #ddd;padding:3px 0 3px 10px;color:#455049}.event.attack{border-color:var(--orange);font-weight:700}.event.ko{border-color:var(--red);color:var(--red);font-weight:750}.event.draw{color:#6b746f}
    .players{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.pill{background:#ece8dd;border-radius:100px;padding:5px 10px;font-size:12px}.pill.me{background:var(--lime)}
    .notes{width:100%;min-height:92px;font:14px/1.5 inherit}.saveRow{display:flex;gap:8px;align-items:center}.saved{font-size:12px;color:var(--green)}
    .knowledge{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.kcard{border:1px solid var(--line);border-radius:13px;padding:12px;background:#faf8f1}.kcard h3{font-size:14px;margin:0 0 2px}.enName{font-size:10px;color:var(--muted);margin-bottom:6px}.kcard p{font-size:11px;line-height:1.5;color:#52605a;margin:4px 0}.kcard .status{font-size:10px;color:var(--blue);font-weight:750}.kbody{display:grid;grid-template-columns:88px 1fr;gap:10px;margin-top:8px;align-items:start}.cardThumb{width:88px;border-radius:7px;display:block;box-shadow:0 3px 10px #16291d2b;cursor:zoom-in;background:#e5e2d8}.noImage{width:88px;aspect-ratio:245/342;border-radius:7px;background:#e5e2d8;display:grid;place-items:center;text-align:center;font-size:10px;color:var(--muted)}.loading{padding:15px;border-radius:12px;background:#eeece4;color:var(--muted);font-size:12px}.sourceNote{font-size:11px;color:var(--muted);line-height:1.5;margin:8px 0}.tag{display:inline-block;border-radius:100px;padding:2px 7px;background:#e4e0d6;font-size:10px;margin:2px 2px 2px 0}
    .imageModal{position:fixed;inset:0;background:#0b120ee8;z-index:50;display:none;align-items:center;justify-content:center;padding:24px}.imageModal.open{display:flex}.imageModal img{max-height:88vh;max-width:min(620px,92vw);border-radius:14px;box-shadow:0 20px 70px #000}.imageModal button{position:absolute;top:18px;right:18px;background:white;color:#17211d;font-size:17px}.imageModal .caption{position:absolute;bottom:10px;color:white;background:#0009;border-radius:100px;padding:7px 13px;font-size:12px}
    .debate{grid-column:1/-1;margin-top:9px;border-top:1px dashed var(--line);padding-top:10px}.debate summary{cursor:pointer;font-size:12px;font-weight:800;color:var(--blue)}.debate textarea{min-height:76px;margin-top:9px;font:13px/1.55 inherit}.debateActions{display:flex;gap:8px;margin-top:7px}.coachReply{margin-top:9px;padding:12px;border-radius:11px;background:#eef2e5;border-left:4px solid var(--green)}.coachReply h4{margin:0 0 6px;font-size:12px}.coachReply p{margin:5px 0;font-size:12px;line-height:1.58}.coachReply .criterion{background:#fff;border-radius:8px;padding:8px;margin-top:8px;color:#263c31;font-weight:700}.consultBox{padding:14px;border-radius:13px;background:#e9efe9}.consultBox p{font-size:12px;color:var(--muted);margin:0 0 9px;line-height:1.55}.actionPlan{grid-column:1/-1;margin-top:9px;padding:12px;border-radius:11px;background:#fff7e8;border:1px solid #ead6b5}.actionPlan h4{font-size:12px;margin:0 0 7px;color:#7d4a19}.actionPlan ol{margin:0;padding-left:19px}.actionPlan li{font-size:12px;line-height:1.55;margin:4px 0}.deckBadge{display:inline-block;background:#dce8d8;color:#234e39;border-radius:100px;padding:4px 9px;font-size:11px;font-weight:750}.deckSummary{font-size:12px;color:var(--muted);margin:8px 0}
    .oddsBox{border:1px solid #bfcfca;background:#f2f7f5;border-radius:15px;padding:15px}.oddsInputs{display:grid;grid-template-columns:2fr .7fr 1.2fr;gap:8px;align-items:end}.oddsResult{margin-top:11px;display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center}.oddsNumber{font-size:29px;font-weight:900;color:var(--green);text-align:center}.evidence{font-size:12px;line-height:1.6}.judgement{margin-top:9px;border-radius:10px;padding:10px;background:#fff;font-size:12px;line-height:1.55}.uncertain{color:#8a5b21;font-size:11px;margin-top:7px}
    @media(max-width:800px){.grid{grid-template-columns:1fr}.sticky{position:static}textarea{min-height:280px}.score{grid-template-columns:repeat(2,1fr)}.knowledge{grid-template-columns:1fr}.oddsInputs,.oddsResult{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><div class="mark">●</div><div><h1>PTCGL ポケカコーチ</h1><div class="sub">対戦ログから、次の一戦で直すことを見つける</div></div></header>
<main><div class="grid">
  <section class="card sticky">
    <h2>1. PTCGLの対戦ログを貼る</h2>
    <textarea id="log" placeholder="PTCGLの対戦ログをここに貼り付けてください。"></textarea>
    <div class="inputSection"><h2>2. 使用デッキを選ぶ</h2><select id="deckSelect"><option value="">デッキ未選択</option></select><details id="deckEditor"><summary class="hint">デッキを新規登録・編集</summary><div class="deckControls"><input type="text" id="deckName" placeholder="デッキ名（例: メガルカリオ）"><span></span></div><textarea class="deckInput" id="deck" placeholder="PTCGLでデッキをエクスポートし、ここに貼り付けてください。&#10;&#10;Pokémon: 10&#10;3 Riolu ABC 12&#10;3 Mega Lucario ex ABC 34&#10;Trainer: 15&#10;2 Boss's Orders ABC 123"></textarea><div class="deckButtons"><button class="secondary" id="saveDeck">このデッキを登録/更新</button><button class="danger" id="deleteDeck">削除</button><span class="saved" id="deckSaved"></span></div></details><p class="hint">選択したデッキの採用枚数から、理想の行動ができない場合の次善策まで考察します。</p></div>
    <div class="buttons"><button class="primary" id="analyze">コーチングを開始</button><label class="fileLabel">ファイルを選ぶ<input id="file" type="file" accept=".txt,text/plain" hidden></label><button class="secondary" id="clear">消去</button></div>
    <p class="hint">対戦ログ自体は送信せず、このMac内で解析します。カード効果の取得時は、ログから抽出したカード名だけをPokémon TCG APIへ送ります。<br>※ 相手の手札や山札など、ログから分からないことは断定しません。</p>
  </section>
  <section class="card" id="output"><div class="empty"><div class="ball">◉</div><h2>ログを貼るとコーチが始まります</h2><p>試合の流れ、勝敗の分岐点、次に意識する一手を整理します。</p></div></section>
</div></main>
<div class="imageModal" id="imageModal" aria-hidden="true"><button id="closeImage">閉じる ×</button><img id="largeCard" alt=""><div class="caption" id="imageCaption"></div></div>
<script>
const $=s=>document.querySelector(s); const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const POKEMON_JA={
 'Solrock':'ソルロック','Lunatone':'ルナトーン','Riolu':'リオル','Mega Lucario ex':'メガルカリオex','Meowth ex':'ニャースex','Makuhita':'マクノシタ','Hariyama':'ハリテヤマ','Binacle':'カメテテ','Barbaracle':'ガメノデス','Latias ex':'ラティアスex',
 'Teal Mask Ogerpon ex':'オーガポン みどりのめんex','Wellspring Mask Ogerpon ex':'オーガポン いどのめんex','Cornerstone Mask Ogerpon ex':'オーガポン いしずえのめんex',"Lillie's Clefairy ex":'リーリエのピッピex'
};
function jaPokemonName(name){return POKEMON_JA[name]||name}
function parseLog(raw){
 const lines=raw.split(/\r?\n/).map(s=>s.trim()).filter(Boolean); if(!lines.length)return null;
 const choose=lines.find(l=>l.includes('chose ')&&l.includes('coin flip')); const me=choose?.match(/^(.+?) chose /)?.[1]||lines.find(l=>l.includes("'s Turn"))?.split("'s Turn")[0]||'You';
 const players=[...new Set(lines.flatMap(l=>{const m=l.match(/^(.+?)(?:'s Turn| chose | won the coin| drew | played | attached | ended | took | decided )/);return m?[m[1]]:[]}))].filter(p=>p!==me); const opp=players[0]||'Opponent';
 let turn=null, turns=[], opening=[], winner='', prizes={[me]:0,[opp]:0}, ko={[me]:0,[opp]:0}, attacks=0, draws=0, actions=0;
 for(const line of lines){
   if(line==='Setup')continue; const tm=line.match(/^(.+?)'s Turn$/); if(tm){turn={player:tm[1],events:[]};turns.push(turn);continue}
   const wm=line.match(/^Opponent took all of their Prize cards\. (.+?) wins\./)||line.match(/^(.+?) wins\./); if(wm)winner=wm[1];
   const pm=line.match(/^(.+?) took (?:(\d+)|a) Prize card/);if(pm)prizes[pm[1]]=(prizes[pm[1]]||0)+(pm[2]?Number(pm[2]):1);
   const km=line.match(/^(.+?)'s .+ was Knocked Out!/);if(km)ko[km[1]]=(ko[km[1]]||0)+1;
   if(/ used .+ on .+ for \d+ damage| used .+ for \d+ damage/.test(line))attacks++;
   if(line.startsWith(me+' drew '))draws++;
   if(turn){turn.events.push(line);if(line.startsWith(turn.player+' played ')||line.startsWith(turn.player+' attached ')||line.includes(' used '))actions++}else opening.push(line);
 }
 return {raw,lines,me,opp,turns,opening,winner,prizes,ko,attacks,draws,actions};
}
function parseDeck(raw){
 const cards=[];for(const line of raw.split(/\r?\n/).map(x=>x.trim())){if(!line||/^(Pokémon|Pokemon|Trainer|Energy|Total Cards):/i.test(line))continue;const m=line.match(/^(\d+)\s+(.+?)(?:\s+[A-Z0-9]{2,6}\s+\d+[a-z]?)?$/);if(m)cards.push({count:Number(m[1]),name:m[2].trim()})}
 return {cards,total:cards.reduce((n,c)=>n+c.count,0),count(name){return cards.filter(c=>c.name.toLowerCase()===name.toLowerCase()).reduce((n,c)=>n+c.count,0)},find(re){return cards.filter(c=>re.test(c.name))}};
}
const DECKS_KEY='ptcgl-coach-decks-v1',DECK_SELECTED_KEY='ptcgl-coach-selected-deck-v1';
function loadDecks(){try{return JSON.parse(localStorage.getItem(DECKS_KEY)||'{}')}catch(e){return {}}}
function refreshDeckSelect(selected=localStorage.getItem(DECK_SELECTED_KEY)||''){const decks=loadDecks(),select=$('#deckSelect');select.innerHTML='<option value="">デッキ未選択</option>'+Object.entries(decks).map(([id,d])=>`<option value="${esc(id)}">${esc(d.name)}（${parseDeck(d.raw).total}枚）</option>`).join('');select.value=decks[selected]?selected:'';showSelectedDeck()}
function showSelectedDeck(){const id=$('#deckSelect').value,decks=loadDecks(),d=decks[id];$('#deckName').value=d?.name||'';$('#deck').value=d?.raw||'';localStorage.setItem(DECK_SELECTED_KEY,id)}
function selectedDeck(){const id=$('#deckSelect').value,d=loadDecks()[id];return {id,name:d?.name||'',raw:d?.raw||'',parsed:parseDeck(d?.raw||'')}}
function knownHandTimeline(g){
 const hand=[],snapshots=[];let currentTurn=-1,pending=null,started=false;const add=n=>{n=(n||'').trim();if(n&&!/^\d+ cards?$/.test(n)&&n!=='a card')hand.push(n)},remove=n=>{n=(n||'').trim();const i=hand.indexOf(n);if(i>=0)hand.splice(i,1)},bullet=l=>l.startsWith('• ')?l.slice(2).split(',').map(x=>x.trim()):[];
 for(const l of g.lines){const tm=l.match(/^(.+?)'s Turn$/);if(tm){if(tm[1]===g.me)currentTurn++;pending=null;continue}
   if(l===`${g.me} drew 7 cards for the opening hand.`){started=true;pending='add';continue}
   if(!started)continue;
   if(l.startsWith('• ')){const cards=bullet(l);if(pending==='add')cards.forEach(add);if(pending==='remove')cards.forEach(remove);continue}else if(!/^- \d+ drawn cards?\.$/.test(l))pending=null;
   let m;if((m=l.match(new RegExp('^(?:- )?'+g.me.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+' drew (.+?)\\.$')))){if(/^\d+ cards?$/.test(m[1]))pending='add';else add(m[1])}
   if((m=l.match(new RegExp('^'+g.me.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+' played (.+?)(?: to the (?:Bench|Active Spot))?\\.$'))))remove(m[1]);
   if((m=l.match(new RegExp('^'+g.me.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+' attached (.+?) to '))))remove(m[1]);
   if((m=l.match(new RegExp('^'+g.me.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+' evolved .+? to (.+?)(?: (?:on|in) the .+?)?\\.$'))))remove(m[1]);
   if(l.startsWith('- '+g.me+' discarded ')||l.startsWith('- '+g.me+' shuffled '))pending='remove';
   if((m=l.match(new RegExp('^'+g.me.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+" moved "+g.me.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+"'s (.+?) to their hand\\.$"))))add(m[1]);
   if((m=l.match(/^(.+?) was added to (.+?)'s hand\.$/))&&m[2]===g.me)add(m[1]);
   if(currentTurn>=0)snapshots[currentTurn]=[...hand];
 }
 return {current:[...hand],snapshots};
}
function estimateDeckOddsState(g,target,totalCopies){
 let deckSize=47,copies=totalCopies,opening=false,pending=null;const same=x=>(x||'').trim().toLowerCase()===target.toLowerCase(),bullet=l=>l.startsWith('• ')?l.slice(2).split(',').map(x=>x.trim()):[];
 for(const l of g.lines){if(l===`${g.me} drew 7 cards for the opening hand.`){opening=true;pending='opening';continue}if(!opening)continue;
   if(l.startsWith('• ')){const cards=bullet(l);if(pending==='opening')copies-=cards.filter(same).length;else if(pending==='draw')copies-=cards.filter(same).length;else if(pending==='shuffle')copies+=cards.filter(same).length;continue}
   if(!/^- \d+ drawn cards?\.$/.test(l))pending=null;let m;
   if((m=l.match(new RegExp('^(?:- )?'+g.me.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+' drew (.+?)\\.$')))){if(/^\d+ cards?$/.test(m[1])){deckSize-=Number(m[1].match(/\d+/)[0]);pending='draw'}else{deckSize--;if(same(m[1]))copies--}}
   if((m=l.match(new RegExp('^- '+g.me.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+' shuffled (\d+) cards? into their deck\\.$')))){deckSize+=Number(m[1]);pending='shuffle'}
   if((m=l.match(/^(.+?) was added to (.+?)'s hand\.$/))&&m[2]===g.me&&same(m[1]))copies--;
 }
 return {deckSize:Math.max(0,deckSize),copies:Math.max(0,Math.min(copies,deckSize)),totalCopies};
}
function hitProbability(N,K,n){n=Math.max(0,Math.min(n,N));if(!N||!K||!n)return 0;let miss=1;for(let i=0;i<n;i++)miss*=Math.max(0,N-K-i)/(N-i);return 1-miss}
function openingCopies(g,target){const start=g.lines.findIndex(l=>l===`${g.me} drew 7 cards for the opening hand.`);if(start<0)return 0;for(let i=start+1;i<Math.min(g.lines.length,start+4);i++){if(g.lines[i].startsWith('• '))return g.lines[i].slice(2).split(',').map(x=>x.trim()).filter(x=>x.toLowerCase()===target.toLowerCase()).length}return 0}
function prizeProbability(g,target,totalCopies){const inOpening=openingCopies(g,target),available=Math.max(0,totalCopies-inOpening);return {probability:hitProbability(53,available,6),available,inOpening}}
function oddsJudgement(p,safe){if(safe==='no')return p>=.25?'安全策でも負けが濃いなら、この引きに賭ける価値があります。':'確率は低いですが、他に勝ち筋がないなら賭けるしかありません。アウツを増やすプレイができないか先に確認します。';if(p>=.65)return '安全策と比較して失うサイドが小さいなら、賭けを検討できる確率です。';if(p>=.35)return '五分以下になり得ます。安全策で次ターンも勝ち筋が残るなら、基本は安全策を優先します。';return '引けない方が大幅に多い確率です。安全策が勝ち筋を残すなら、賭けない判断が有力です。'}
function actionPlanFor(a,g,deck){
 const hasDeck=deck.total>0,timeline=knownHandTimeline(g),mine=g.turns.filter(t=>t.player===g.me);let handIndex=timeline.snapshots.length-1;if(a.title.includes('ベンチ'))handIndex=0;else if(a.title.includes('弱点'))handIndex=Math.max(0,timeline.snapshots.length-2);else if(a.title.includes('攻撃できない')){const i=mine.findIndex(t=>!t.events.some(x=>x.includes(' used ')&&x.startsWith(g.me+"'s ")));if(i>=0)handIndex=i}const known=timeline.snapshots[handIndex]||[],handNames=re=>known.filter(n=>re.test(n)).join('、'),steps=[];
 if(a.title.includes('ベンチ')){steps.push('理想: ベンチ攻撃でサイドを複数取られない枚数に抑える。','それが無理なら: 「次ターンに必ず進化/特性使用する」ポケモンだけを置き、役割を終えたシステムポケモンは入れ替え候補にする。','それでも複数置くなら: ベンチ狙撃を受けた次のターンに、必ず主力でサイドを取り返せるエネルギー配置を優先する。');}
 else if(a.title.includes('弱点')){steps.push('理想: 弱点を突かれる主力を、相手が一撃KOできるターンに前へ出さない。','それが無理なら: 主力が倒される前提で、その攻撃で相手のエネルギー供給源または複数サイドポケモンを先に倒す。','一撃で倒せないなら: 1サイドのポケモンをバトル場に置き、もう1ターンエネルギーと手札を整える。');}
 else if(a.title.includes('攻撃できない')){steps.push('理想: 毎ターン攻撃できるエネルギーラインを作る。','それが無理なら: そのターンを「準備ターン」と決め、ドローが何でも次ターン攻撃できる盤面を完成させる。','準備中は: 取られるサイドが少ないポケモンを前にし、主力へエネルギーを集中する。');}

   if(l.startsWith('• ')&&!l.includes(':'))l.slice(2).split(',').forEach(add);
   if((m=l.match(/^[^-].+? drew (.+?)\.$/))&&!/^\d+ cards?$/.test(m[1]))add(m[1]);

$('#deckSelect').onchange=showSelectedDeck;$('#saveDeck').onclick=()=>{const name=$('#deckName').value.trim(),raw=$('#deck').value.trim(),parsed=parseDeck(raw);if(!name||!raw){alert('デッキ名とPTCGLのデッキリストを入力してください。');return}if(!parsed.total){alert('デッキリストを読み取れませんでした。PTCGLからエクスポートしたテキストをそのまま貼ってください。');return}const decks=loadDecks(),current=$('#deckSelect').value,id=current||'deck-'+Date.now();decks[id]={name,raw,updatedAt:new Date().toISOString()};localStorage.setItem(DECKS_KEY,JSON.stringify(decks));localStorage.setItem(DECK_SELECTED_KEY,id);refreshDeckSelect(id);$('#deckSaved').textContent=`${parsed.total}枚を登録しました`;setTimeout(()=>$('#deckSaved').textContent='',1800)};
$('#deleteDeck').onclick=()=>{const id=$('#deckSelect').value;if(!id){alert('削除するデッキを選んでください。');return}const decks=loadDecks(),name=decks[id]?.name||'';if(!confirm(`「${name}」を削除しますか？`))return;delete decks[id];localStorage.setItem(DECKS_KEY,JSON.stringify(decks));localStorage.removeItem(DECK_SELECTED_KEY);refreshDeckSelect('')};
refreshDeckSelect();
$('#closeImage').onclick=closeCardImage;$('#imageModal').onclick=e=>{if(e.target===$('#imageModal'))closeCardImage()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCardImage()});
</script></body></html>
