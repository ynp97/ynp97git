<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>早天サムネ</title>
<style>body{font-family:system-ui,sans-serif;background:#f6f3ee;color:#252525;margin:0}main{max-width:1000px;margin:40px auto;padding:0 24px}h1{font-size:28px;margin-bottom:8px}p{color:#666}section{background:white;border:1px solid #ddd7ce;border-radius:16px;padding:24px;margin:24px 0}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,input{font:inherit;border:1px solid #bdb5a8;border-radius:8px;padding:12px 18px}button{cursor:pointer;background:white}button.primary{background:#273f35;color:white;border:0}button:disabled{opacity:.4;cursor:default}input{background:#faf9f6}#passage{font-size:24px;font-weight:600;margin:22px 0 8px}#status{min-height:1.6em}canvas{display:block;width:100%;height:auto;border-radius:6px}footer{font-size:13px;color:#777;line-height:1.8}.error{color:#a52c20!important}#filename{overflow-wrap:anywhere;font-size:14px}
main{margin:18px auto}h1{margin:0 0 6px}main>p{margin:6px 0 12px}section{padding:16px;margin:12px 0}button,input{padding:9px 14px}#passage{font-size:21px;margin:12px 0 4px}#copyText{margin:8px 0}#preview{display:flex;flex-direction:column;align-items:center;gap:8px}#preview[hidden]{display:none}#preview canvas{width:auto;max-width:100%;height:auto;max-height:30vh;object-fit:contain}#save{align-self:center;order:-2}#filename{margin:0;font-size:12px}footer{font-size:12px;line-height:1.5}
</style>
<main><h1>早天サムネ</h1><p>日付を選ぶと、その日の聖書箇所でサムネイルを作ります。</p>
<section><div class="controls"><button id="today">本日</button><label for="date">対象日</label><input id="date" type="date" required><button id="make" class="primary">サムネを作る</button></div><div id="passage"></div><div id="status" role="status"></div><p id="copyText" style="overflow-wrap:anywhere"></p><div class="controls"><button id="copy">タイトルをコピー</button><button id="studio">動画のアップロード画面を開く</button></div><p style="font-size:14px">YouTubeで現在選択しているチャンネルの投稿画面が開きます。何日分も投稿するときは、日付を変えてタイトルをコピーし、開いているStudioに貼り付けてください。</p></section>
<section id="preview" hidden><canvas id="canvas" width="1280" height="720" aria-label="サムネイルのプレビュー"></canvas><p id="filename"></p><button id="save" class="primary">PNG画像を保存</button></section>
<footer>画像はこのMac内で生成します。AI・Canvaへの通信はありません。<br>聖書箇所：登録済みのリビングライフ月間一覧。未登録の日は生成しません。<br>月間一覧はツラノ公式から取得し、照合状況はVaultの月間表に記録します。</footer></main>
<script src="passages.js"></script><script src="thumbnail.js"></script></html>
