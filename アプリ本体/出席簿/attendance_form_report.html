<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>出席簿・月次レポート</title>
  <style>
    :root {
      --ink: #182230;
      --muted: #667085;
      --line: #d0d5dd;
      --soft: #f2f4f7;
      --paper: #ffffff;
      --blue: #175cd3;
      --blue-soft: #eff8ff;
      --green: #067647;
      --green-soft: #ecfdf3;
      --red: #b42318;
      --red-soft: #fef3f2;
      --amber: #b54708;
      --amber-soft: #fffaeb;
      --shadow: 0 14px 30px rgba(16, 24, 40, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      background: #f8fafc;
      color: var(--ink);
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      border-radius: 8px;
      min-height: 38px;
      padding: 8px 12px;
      cursor: pointer;
    }

    button.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: white;
      font-weight: 700;
    }

    button.danger {
      color: var(--red);
      border-color: #fda29b;
      background: var(--red-soft);
    }

    .shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 22px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0;
    }

    .month-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .month-controls input,
    .month-controls select {
      width: auto;
      min-width: 86px;
    }

    .data-save-status {
      width: 100%;
      min-height: 16px;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      text-align: right;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(320px, 400px) 1fr;
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .panel h2 {
      margin: 0;
      padding: 16px 18px 8px;
      font-size: 18px;
    }

    .form {
      padding: 10px 18px 18px;
    }

    .field {
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #344054;
      font-size: 13px;
      font-weight: 700;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      color: var(--ink);
      padding: 9px 10px;
      min-height: 38px;
    }

    textarea {
      min-height: 86px;
      resize: vertical;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .date-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .date-note {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .subject-list {
      display: grid;
      gap: 8px;
    }

    .subject-row {
      display: grid;
      grid-template-columns: 112px 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .subject-remove {
      width: 38px;
      min-width: 38px;
      padding: 0;
      font-weight: 700;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .save-status {
      min-height: 18px;
      margin-top: 8px;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
    }

    .student-box {
      border-bottom: 1px solid var(--line);
      padding: 10px 18px 14px;
    }

    .student-box .actions {
      margin-top: 8px;
    }

    .student-add {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .roster-panel {
      display: none;
      margin-top: 18px;
    }

    body.roster-mode .grid {
      display: none;
    }

    body.roster-mode .roster-panel {
      display: block;
    }

    .advanced-field {
      display: none;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(100px, 1fr));
      gap: 10px;
      padding: 0 18px 14px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: var(--soft);
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .metric strong {
      display: block;
      margin-top: 4px;
      font-size: 24px;
    }

    .report-actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 0 18px 14px;
      flex-wrap: wrap;
    }

    .print-only-action {
      display: none;
    }

    .table-wrap {
      overflow: auto;
      border-top: 1px solid var(--line);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 780px;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: 10px;
      text-align: left;
      vertical-align: top;
      font-size: 13px;
    }

    th {
      background: #f9fafb;
      color: #344054;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    td.small {
      white-space: nowrap;
      color: var(--muted);
    }

    .badge {
      display: inline-block;
      min-width: 48px;
      text-align: center;
      padding: 4px 8px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 12px;
    }

    .badge.present { background: var(--green-soft); color: var(--green); }
    .badge.absent { background: var(--red-soft); color: var(--red); }
    .badge.late { background: var(--amber-soft); color: var(--amber); }
    .badge.other { background: var(--blue-soft); color: var(--blue); }

    .empty {
      color: var(--muted);
      padding: 28px 18px;
      text-align: center;
      border-top: 1px solid var(--line);
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #101828;
      color: white;
      padding: 10px 14px;
      border-radius: 8px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .18s ease, transform .18s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .greeting-edit {
      padding: 0 18px 8px;
      margin-bottom: 0;
    }

    .greeting-edit textarea {
      min-height: 60px;
    }

    /* ── 出席カレンダー ── */
    .calendar-box {
      padding: 4px 18px 16px;
    }

    .calendar-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .calendar-head .hint {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .calendar-head button {
      min-height: 30px;
      padding: 4px 10px;
      font-size: 12px;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cal-dow {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      padding: 2px 0;
    }

    .cal-dow.sun { color: var(--red); }
    .cal-dow.sat { color: var(--blue); }

    .cal-day {
      position: relative;
      min-height: 46px;
      padding: 4px 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: #98a2b3;
      text-align: left;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 700;
    }

    .cal-day.in {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    .cal-day.holiday:not(.in) { color: #f97066; }
    .cal-day .cal-sub {
      font-size: 10px;
      font-weight: 700;
      line-height: 1.1;
      max-width: 100%;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .cal-day .cal-dot {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
    }

    .cal-day.in .cal-dot { background: #fff; }
    .cal-day.today { box-shadow: 0 0 0 2px var(--amber); }
    .cal-blank { min-height: 46px; }

    .weekday-picks {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .weekday-picks label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin: 0;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .weekday-picks input {
      width: auto;
      min-height: 0;
    }

    tr.no-content td { color: var(--muted); }

    /* ── 印刷用シート（プレビューと印刷で同じものを使う） ── */
    .print-sheet { display: none; }
    .preview-bar { display: none; }

    .print-sheet {
      font-family: "Hiragino Sans", "Meiryo UI", Meiryo, "Yu Gothic", sans-serif;
      color: #000;
      font-size: 10.5pt;
      line-height: 1.55;
    }

    .ps-head {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 4mm;
      padding-bottom: 3mm;
      border-bottom: 1.2pt solid #000;
      margin-bottom: 5mm;
    }

    .ps-org {
      font-size: 10.5pt;
      margin: 0 0 1mm;
    }

    .ps-title {
      font-size: 16pt;
      font-weight: 700;
      margin: 0;
      letter-spacing: 0.02em;
    }

    .ps-student {
      margin: 2mm 0 0;
      font-size: 12pt;
    }

    .ps-student strong { font-size: 13pt; }

    .ps-count {
      text-align: right;
      font-size: 10pt;
      white-space: nowrap;
    }

    .ps-count strong {
      display: block;
      font-size: 22pt;
      line-height: 1.1;
    }

    .ps-greeting {
      margin: 0 0 6mm;
      white-space: pre-wrap;
    }

    .ps-table {
      width: 100%;
      min-width: 0;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .ps-table th,
    .ps-table td {
      border: none;
      color: #000;
      font-size: 10pt;
      line-height: 1.45;
      padding: 1.5mm 3mm 1.5mm 0;
      vertical-align: top;
      text-align: left;
      word-break: break-word;
      background: transparent;
      position: static;
    }

    .ps-table thead th {
      font-size: 9.5pt;
      font-weight: 700;
      border-top: 0.8pt solid #000;
      border-bottom: 0.8pt solid #000;
      padding-top: 1.4mm;
      padding-bottom: 1.4mm;
      white-space: nowrap;
    }

    .ps-table tbody tr:last-child td { border-bottom: 0.8pt solid #000; }
    .ps-table tr { break-inside: avoid; page-break-inside: avoid; }
    .ps-table .c-date { width: 17mm; white-space: nowrap; }
    .ps-table .c-dow { width: 11mm; white-space: nowrap; }
    .ps-table .c-act { width: 34%; }
    .ps-empty { margin-top: 8mm; }

    body.a4-preview { background: #e4e7ec; }
    body.a4-preview .topbar,
    body.a4-preview .grid,
    body.a4-preview .roster-panel { display: none; }

    body.a4-preview .shell { max-width: none; padding: 18px 12px 40px; }

    body.a4-preview .print-sheet {
      display: block;
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      padding: 18mm 18mm 20mm;
      background: #fff;
      box-shadow: 0 18px 44px rgba(16, 24, 40, 0.18);
    }

    body.a4-preview .preview-bar {
      display: flex;
      gap: 8px;
      position: fixed;
      top: 12px;
      right: 18px;
      z-index: 5;
      padding: 8px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    @media (max-width: 880px) {
      .shell { padding: 14px; }
      .topbar { align-items: stretch; flex-direction: column; }
      .grid { grid-template-columns: 1fr; }
      .summary { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
      .row { grid-template-columns: 1fr; }
    }

    @page {
      size: A4 portrait;
      margin: 18mm 18mm 20mm;
      @bottom-center {
        content: counter(page);
        font-size: 9pt;
        color: #000;
      }
    }

    @media print {
      html, body, body.a4-preview { background: #fff !important; }
      body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .shell, body.a4-preview .shell { max-width: none; padding: 0 !important; margin: 0; }
      .topbar, .grid, .roster-panel, .preview-bar, .toast { display: none !important; }
      body.a4-preview .print-sheet,
      .print-sheet {
        display: block;
        width: auto;
        min-height: 0;
        margin: 0;
        padding: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <h1>出席簿・月次レポート</h1>
      <div class="month-controls">
        <input id="yearInput" type="number" min="2000" max="2100" aria-label="年" />
        <select id="monthSelect" aria-label="月"></select>
        <button id="thisMonthBtn" type="button">今月</button>
        <button id="saveAllDataBtn" type="button">全データ保存</button>
        <div id="dataSaveStatus" class="data-save-status" role="status" aria-live="polite"></div>
      </div>
    </header>

    <section class="grid">
      <div class="panel entry-panel">
        <h2>1日ごとの入力</h2>
        <div class="student-box">
          <div class="field">
            <label for="schoolSelect">学習施設</label>
            <select id="schoolSelect"></select>
          </div>
          <div class="field">
            <label for="studentSelect">生徒</label>
            <select id="studentSelect"></select>
          </div>
          <div class="actions">
            <button id="openRosterBtn" type="button">名簿管理</button>
          </div>
        </div>
        <form id="entryForm" class="form">
          <input id="entryId" type="hidden" />

          <div class="field">
            <label for="dateInput">日付</label>
            <div class="date-row">
              <input id="dateInput" type="date" required />
              <button id="todayBtn" type="button">今日</button>
            </div>
            <div id="weekdayPreview" class="date-note"></div>
          </div>

          <div class="row advanced-field">
            <div class="field">
              <label for="startTime">開始</label>
              <select id="startTime"></select>
            </div>
            <div class="field">
              <label for="endTime">終了</label>
              <select id="endTime"></select>
            </div>
          </div>

          <div class="field advanced-field">
            <label for="statusInput">出席</label>
            <select id="statusInput">
              <option value="出席">出席</option>
              <option value="欠席">欠席</option>
              <option value="遅刻">遅刻</option>
              <option value="早退">早退</option>
              <option value="振替">振替</option>
            </select>
          </div>

          <div class="field">
            <label>学習内容</label>
            <div id="subjectRows" class="subject-list"></div>
            <div class="actions">
              <button id="addSubjectBtn" type="button">科目を追加</button>
            </div>
          </div>

          <div class="field">
            <label for="learningMemoInput">学習メモ</label>
            <textarea id="learningMemoInput"></textarea>
          </div>

          <div class="field">
            <label for="activityTypeInput">活動内容</label>
            <select id="activityTypeInput">
              <option value="">選択</option>
              <option value="自由活動">自由活動</option>
              <option value="レクリエーション">レクリエーション</option>
            </select>
          </div>

          <div class="field">
            <label for="activityDetailInput">活動メモ</label>
            <textarea id="activityDetailInput"></textarea>
          </div>

          <div class="field advanced-field">
            <label for="noteInput">備考</label>
            <textarea id="noteInput" placeholder="連絡事項や補足"></textarea>
          </div>

          <div class="actions">
            <button id="saveEntryBtn" class="primary" type="submit">登録</button>
            <button id="clearBtn" type="button">入力をクリア</button>
            <button id="deleteBtn" class="danger" type="button" hidden>削除</button>
          </div>
          <div id="saveStatus" class="save-status" role="status" aria-live="polite"></div>
        </form>
      </div>

      <div class="panel">
        <h2 id="reportTitle">月のレポート</h2>
        <div class="calendar-box">
          <div class="calendar-head">
            <span class="hint">出席しなかった日を押すと一覧から外れます（もう一度押すと戻ります）</span>
            <button id="resetMonthBtn" type="button">曜日どおりに戻す</button>
          </div>
          <div id="calendar" class="calendar"></div>
        </div>
        <div class="summary">
          <div class="metric"><span>出席日数</span><strong id="totalCount">0</strong></div>
          <div class="metric"><span>記入済み</span><strong id="filledCount">0</strong></div>
          <div class="metric"><span>未記入</span><strong id="blankCount">0</strong></div>
        </div>
        <div class="field greeting-edit">
          <label for="greetingInput">挨拶文（レポートの一番上に表示）</label>
          <textarea id="greetingInput" placeholder="例：いつもお世話になっております。今月の学習の様子をお知らせいたします。"></textarea>
        </div>
        <div class="report-actions">
          <div>
            <button id="a4PreviewBtn" type="button">レポート確認・印刷</button>
            <button id="csvBtn" type="button">CSV出力</button>
          </div>
          <button id="newEntryBtn" type="button">新規入力</button>
        </div>
        <div id="emptyState" class="empty">この月の出席日はありません。カレンダーで日付を押すと追加されます。</div>
        <div class="table-wrap" id="tableWrap" hidden>
          <table>
            <thead>
              <tr>
                <th>日にち</th>
                <th>曜日</th>
                <th>学習内容</th>
                <th>活動内容</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="reportBody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="panel roster-panel">
      <h2>名簿管理</h2>
      <div class="form">
        <div class="row">
          <div class="field">
            <label for="rosterSchoolSelect">名簿の学習施設</label>
            <select id="rosterSchoolSelect"></select>
          </div>
          <div class="field">
            <label for="rosterStudentSelect">編集する生徒</label>
            <select id="rosterStudentSelect"></select>
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="newSchoolNameInput">新しい学習施設</label>
            <input id="newSchoolNameInput" type="text" />
          </div>
          <div class="field">
            <label for="newStudentNameInput">新しい生徒</label>
            <input id="newStudentNameInput" type="text" />
          </div>
        </div>
        <div class="actions">
          <button id="addSchoolBtn" type="button">施設を追加</button>
          <button id="addStudentBtn" type="button">生徒を追加</button>
        </div>
        <div class="row">
          <div class="field">
            <label for="schoolNameInput">選択中の施設名</label>
            <input id="schoolNameInput" type="text" />
          </div>
          <div class="field">
            <label for="studentNameInput">選択中の生徒名</label>
            <input id="studentNameInput" type="text" />
          </div>
        </div>
        <div class="field">
          <label>選択中の生徒が通う曜日（まだ開いていない月の初期値）</label>
          <div id="weekdayPicks" class="weekday-picks"></div>
        </div>
        <div class="actions">
          <button id="renameSchoolBtn" type="button">施設名を更新</button>
          <button id="deleteSchoolBtn" class="danger" type="button">施設を削除</button>
          <button id="renameStudentBtn" type="button">生徒名を更新</button>
          <button id="deleteStudentBtn" class="danger" type="button">生徒を削除</button>
        </div>
        <div class="actions">
          <button id="closeRosterBtn" class="primary" type="button">入力に戻る</button>
          <button id="restoreSeenDataBtn" type="button">見えていたデータを復旧</button>
          <button id="backupDataBtn" type="button">バックアップを書き出す（ファイル）</button>
          <button id="importDataBtn" type="button">バックアップ読込</button>
          <input id="importDataInput" type="file" accept="application/json" hidden />
        </div>
      </div>
    </section>

    <div class="preview-bar">
      <button id="closePreviewBtn" type="button">入力に戻る</button>
      <button id="printBtn" class="primary" type="button">印刷</button>
    </div>

    <section id="printSheet" class="print-sheet" aria-label="印刷用レポート"></section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const storageKey = "attendance-form-report:v2";
    const legacyStorageKey = "attendance-form-report:v1";

    // ── 日本の祝日（春分・秋分は近似式。1980〜2099年で有効） ──
    const holidayCache = new Map();
    function nthMonday(year, month, n) {
      const first = new Date(year, month - 1, 1).getDay();
      const offset = (8 - first) % 7;
      return 1 + offset + (n - 1) * 7;
    }
    function holidaysOf(year) {
      if (holidayCache.has(year)) return holidayCache.get(year);
      const map = new Map();
      const add = (m, d, name) => map.set(`${year}-${pad(m)}-${pad(d)}`, name);
      const k = Math.floor((year - 1980) / 4);
      add(1, 1, "元日");
      add(1, nthMonday(year, 1, 2), "成人の日");
      add(2, 11, "建国記念の日");
      add(2, 23, "天皇誕生日");
      add(3, Math.floor(20.8431 + 0.242194 * (year - 1980) - k), "春分の日");
      add(4, 29, "昭和の日");
      add(5, 3, "憲法記念日");
      add(5, 4, "みどりの日");
      add(5, 5, "こどもの日");
      add(7, nthMonday(year, 7, 3), "海の日");
      add(8, 11, "山の日");
      add(9, nthMonday(year, 9, 3), "敬老の日");
      add(9, Math.floor(23.2488 + 0.242194 * (year - 1980) - k), "秋分の日");
      add(10, nthMonday(year, 10, 2), "スポーツの日");
      add(11, 3, "文化の日");
      add(11, 23, "勤労感謝の日");
      const base = [...map.keys()].sort();
      // 国民の休日（祝日に挟まれた平日）
      for (const key of base) {
        const d = new Date(`${key}T00:00:00`);
        const next = new Date(d); next.setDate(d.getDate() + 1);
        const after = new Date(d); after.setDate(d.getDate() + 2);
        const nk = localDateString(next), ak = localDateString(after);
        if (!map.has(nk) && map.has(ak) && next.getDay() !== 0) map.set(nk, "国民の休日");
      }
      // 振替休日（日曜の祝日 → 次の祝日でない日）
      for (const key of [...map.keys()].sort()) {
        const d = new Date(`${key}T00:00:00`);
        if (d.getDay() !== 0) continue;
        const sub = new Date(d);
        do { sub.setDate(sub.getDate() + 1); } while (map.has(localDateString(sub)));
        if (sub.getFullYear() === year) map.set(localDateString(sub), "振替休日");
      }
      holidayCache.set(year, map);
      return map;
    }
    function holidayName(dateValue) {
      return holidaysOf(Number(dateValue.slice(0, 4))).get(dateValue) || "";
    }

    function daysInMonth(year, month) {
      return new Date(year, month, 0).getDate();
    }

    function studentWeekdays(student) {
      return Array.isArray(student?.weekdays) ? student.weekdays : DEFAULT_WEEKDAYS;
    }

    function defaultDays(student, year, month) {
      const days = [];
      const weekdays = studentWeekdays(student);
      for (let d = 1; d <= daysInMonth(year, month); d += 1) {
        const key = `${year}-${pad(month)}-${pad(d)}`;
        const dow = new Date(year, month - 1, d).getDay();
        if (weekdays.includes(dow) && !holidayName(key)) days.push(key);
      }
      return days;
    }

    function studentMonthEntries(student, key) {
      return entries.filter((entry) => entry.studentId === student.id && String(entry.date || "").startsWith(key));
    }

    // その月の出席日リスト。初めて開いた月だけ作る。
    // 旧方式（登録した日＝出席日）の記録がある月は、登録日をそのまま出席日にする。
    // ただし今日以降の日は曜日どおりに入れておく（今月の途中から使い始める場合）。
    function monthAttendance(student, year, month, create = true) {
      const key = monthKey(year, month);
      if (!state.attendance) state.attendance = {};
      const byStudent = state.attendance[student.id] || (state.attendance[student.id] = {});
      if (Array.isArray(byStudent[key])) return byStudent[key];
      if (!create) return null;
      const existing = studentMonthEntries(student, key);
      let days;
      if (existing.length) {
        const today = localDateString();
        const set = new Set(existing.filter((entry) => entry.status !== "欠席").map((entry) => entry.date));
        for (const day of defaultDays(student, year, month)) if (day >= today) set.add(day);
        days = [...set];
      } else {
        days = defaultDays(student, year, month);
      }
      byStudent[key] = days.sort();
      monthAttendance.created = true;
      return byStudent[key];
    }

    function setAttendance(student, dateValue, attending) {
      const [year, month] = dateValue.split("-").map(Number);
      const list = monthAttendance(student, year, month);
      const index = list.indexOf(dateValue);
      if (attending && index < 0) list.push(dateValue);
      if (!attending && index >= 0) list.splice(index, 1);
      list.sort();
    }

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function localDateString(date = new Date()) {
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }

    function weekdayName(dateValue) {
      if (!dateValue) return "";
      const [year, month, day] = dateValue.split("-").map(Number);
      const date = new Date(year, month - 1, day);
      return ["日", "月", "火", "水", "木", "金", "土"][date.getDay()];
    }

    function updateWeekdayPreview() {
      const weekday = weekdayName(dateInput.value);
      weekdayPreview.textContent = weekday ? `${weekday}曜日` : "";
    }

    function monthKey(year, month) {
      return `${year}-${pad(month)}`;
    }

    function save() {
      state.schools = schools;
      state.students = students;
      state.entries = entries;
      state.activeSchoolId = schoolSelect.value || schools[0]?.id || defaultSchool.id;
      state.activeStudentId = studentSelect.value || students.find((student) => student.schoolId === state.activeSchoolId)?.id || defaultStudent.id;
      localStorage.setItem(storageKey, JSON.stringify(state));
      saveToDataFile();
    }

    function normalizeState() {
      if (!state.schools || !state.schools.length) {
        schools.splice(0, schools.length, { ...defaultSchool });
        state.activeSchoolId = defaultSchool.id;
      }
      if (!state.students || !state.students.length) {
        students.splice(0, students.length, { ...defaultStudent, schoolId: schools[0]?.id || defaultSchool.id });
        state.activeStudentId = defaultStudent.id;
      }
      if (!state.entries) state.entries = entries;
      if (schools.length === 1 && schools[0].id === defaultSchool.id && schools[0].name === "学校1") {
        schools[0].name = defaultSchool.name;
      }
      for (const entry of entries) {
        if (!entry.schoolId) entry.schoolId = schools[0]?.id || defaultSchool.id;
        if (!entry.studentId) entry.studentId = students[0]?.id || defaultStudent.id;
      }
      for (const student of students) {
        if (!student.schoolId) student.schoolId = schools[0]?.id || defaultSchool.id;
      }
    }

    function applyStoredState(stored) {
      if (!stored || !Array.isArray(stored.schools) || !Array.isArray(stored.students) || !Array.isArray(stored.entries)) {
        return false;
      }
      schools.splice(0, schools.length, ...stored.schools);
      students.splice(0, students.length, ...stored.students);
      entries.splice(0, entries.length, ...stored.entries);
      state.activeSchoolId = stored.activeSchoolId || schools[0]?.id || defaultSchool.id;
      state.activeStudentId = stored.activeStudentId || students[0]?.id || defaultStudent.id;
      if (typeof stored.reportGreeting === "string") state.reportGreeting = stored.reportGreeting;
      if (stored.attendance && typeof stored.attendance === "object") state.attendance = stored.attendance;
      normalizeState();
      return true;
    }

    async function loadFromDataFile() {
      if (!location.protocol.startsWith("http")) return false;
      try {
        const response = await fetch("api/data", { cache: "no-store" });
        if (!response.ok) return false;
        return applyStoredState(await response.json());
      } catch {
        return false;
      }
    }

    function saveToDataFile() {
      if (!location.protocol.startsWith("http")) return;
      fetch("api/data", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(state),
      }).catch(() => {});
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function fillSelects() {
      for (let m = 1; m <= 12; m += 1) {
        monthSelect.add(new Option(`${m}月`, String(m)));

      const blank = new Option("未設定", "");

    function createSubjectRow(subject = {}) {
      const row = document.createElement("div");
      row.className = "subject-row";

      const select = document.createElement("select");
      select.dataset.subjectSelect = "true";
      select.add(new Option("科目", ""));
      for (const name of subjectNames) {
        select.add(new Option(name, name));
      }
      select.value = subject.name || "";

      const detail = document.createElement("input");
      detail.type = "text";
      detail.dataset.subjectDetail = "true";
      detail.value = subject.detail || "";

      const remove = document.createElement("button");
      remove.className = "subject-remove";
      remove.type = "button";
      remove.dataset.removeSubject = "true";
      remove.textContent = "×";
      remove.setAttribute("aria-label", "科目を削除");

      row.append(select, detail, remove);
      return row;
    }

    function addSubjectRow(subject = {}) {
      subjectRows.appendChild(createSubjectRow(subject));
      updateSubjectRemoveButtons();
    }

    function updateSubjectRemoveButtons() {
      const rows = subjectRows.querySelectorAll(".subject-row");
      for (const button of subjectRows.querySelectorAll("[data-remove-subject]")) {
        button.disabled = rows.length <= 1;
      }
    }

    function renderSubjectInputs() {
      subjectRows.innerHTML = "";
      addSubjectRow();
    }

    function clearSubjectInputs() {
      subjectRows.innerHTML = "";
      addSubjectRow();
    }

    function setSubjectInputs(subjects = []) {
      subjectRows.innerHTML = "";
      const usableSubjects = subjects.filter((subject) => subject.name || subject.detail);
      if (usableSubjects.length) {
        for (const subject of usableSubjects) addSubjectRow(subject);
      } else {
        addSubjectRow();
      }
    }

    function readSubjects() {
      return Array.from(subjectRows.querySelectorAll(".subject-row"))
        .map((row) => ({
          name: row.querySelector("[data-subject-select]").value,
          detail: row.querySelector("[data-subject-detail]").value.trim(),
        }))
        .filter((subject) => subject.name);
    }

    function formatLearning(entry) {
      const subjects = Array.isArray(entry.subjects) ? entry.subjects.filter((subject) => subject.name) : [];
      const subjectText = subjects.map((subject) =>
        subject.detail ? `${subject.name}：${subject.detail}` : subject.name
      );
      const memo = String(entry.learningMemo || "").trim();
      if (subjectText.length && memo) return `${subjectText.join("、")}\n${memo}`;
      if (subjectText.length) return subjectText.join("、");
      return memo || entry.learning || "";
    }

    function formatActivity(entry) {
      const type = String(entry.activityType || "").trim();
      const detail = String(entry.activityDetail || "").trim();
      if (type && detail) return `${type}：${detail}`;
      if (type) return type;
      return detail || entry.activity || "";
    }

    function activeSchool() {
      return schools.find((school) => school.id === schoolSelect.value) || schools[0];
    }

    function renderSchools() {
      const currentId = state.activeSchoolId || schools[0]?.id || defaultSchool.id;
      schoolSelect.innerHTML = "";
      rosterSchoolSelect.innerHTML = "";
      for (const school of schools) {
        schoolSelect.add(new Option(school.name, school.id));
        rosterSchoolSelect.add(new Option(school.name, school.id));
      }
      schoolSelect.value = schools.some((school) => school.id === currentId) ? currentId : schools[0].id;
      rosterSchoolSelect.value = schoolSelect.value;
      schoolNameInput.value = activeSchool()?.name || "";
      document.getElementById("deleteSchoolBtn").disabled = schools.length <= 1;
    }

    function activeStudent() {
      const school = activeSchool();
      return students.find((student) => student.id === studentSelect.value && student.schoolId === school.id)
        || students.find((student) => student.schoolId === school.id);
    }

    function renderStudents() {
      const school = activeSchool();
      let schoolStudents = students.filter((student) => student.schoolId === school.id);
      if (!schoolStudents.length) {
        const student = { id: crypto.randomUUID(), schoolId: school.id, name: "生徒1" };
        students.push(student);
        schoolStudents = [student];
        state.activeStudentId = student.id;
      }
      const currentId = state.activeStudentId || schoolStudents[0]?.id || defaultStudent.id;
      studentSelect.innerHTML = "";
      rosterStudentSelect.innerHTML = "";
      for (const student of schoolStudents) {
        studentSelect.add(new Option(student.name, student.id));
        rosterStudentSelect.add(new Option(student.name, student.id));
      }
      studentSelect.value = schoolStudents.some((student) => student.id === currentId) ? currentId : schoolStudents[0].id;
      rosterStudentSelect.value = studentSelect.value;
      studentNameInput.value = activeStudent()?.name || "";
      document.getElementById("deleteStudentBtn").disabled = schoolStudents.length <= 1;
      renderWeekdayPicks();
    }

    function selectedMonthEntries() {
      const key = monthKey(Number(yearInput.value), Number(monthSelect.value));
      const school = activeSchool();
      const student = activeStudent();
      return entries
        .filter((entry) => entry.schoolId === school.id && entry.studentId === student.id && entry.date.startsWith(key))
        .sort((a, b) => `${a.date}${a.startTime}`.localeCompare(`${b.date}${b.startTime}`));
    }

    function badgeClass(status) {
      if (status === "出席") return "present";
      if (status === "欠席") return "absent";
      if (status === "遅刻" || status === "早退") return "late";
      return "other";
    }

    function shortDate(dateValue) {
      const [, month, day] = dateValue.split("-");
      return `${Number(month)}月${Number(day)}日`;
    }

    function entriesByDate(list) {
      const map = new Map();
      for (const entry of list) {
        if (!map.has(entry.date)) map.set(entry.date, []);
        map.get(entry.date).push(entry);
      }
      return map;
    }

    function hasContent(entry) {
      return Boolean(formatLearning(entry) || formatActivity(entry));
    }

    // 出席日ごとの行（記録が無い日は空行1つ）
    function monthRows() {
      const year = Number(yearInput.value);
      const month = Number(monthSelect.value);
      const student = activeStudent();
      const days = monthAttendance(student, year, month);
      const byDate = entriesByDate(selectedMonthEntries());
      const rows = [];
      for (const date of days) {
        const list = byDate.get(date) || [];
        if (list.length) for (const entry of list) rows.push({ date, entry });
        else rows.push({ date, entry: null });
      }
      return { days, rows, byDate };
    }

    function renderCalendar(days, byDate) {
      const year = Number(yearInput.value);
      const month = Number(monthSelect.value);
      const set = new Set(days);
      const today = localDateString();
      calendarEl.innerHTML = "";
      DOW.forEach((name, i) => {
        const el = document.createElement("div");
        el.className = `cal-dow${i === 0 ? " sun" : i === 6 ? " sat" : ""}`;
        el.textContent = name;
        calendarEl.appendChild(el);
      });
      const firstDow = new Date(year, month - 1, 1).getDay();
      for (let i = 0; i < firstDow; i += 1) {
        const blank = document.createElement("div");
        blank.className = "cal-blank";
        calendarEl.appendChild(blank);
      }
      for (let d = 1; d <= daysInMonth(year, month); d += 1) {
        const key = `${year}-${pad(month)}-${pad(d)}`;
        const holiday = holidayName(key);
        const filled = (byDate.get(key) || []).some(hasContent);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.dataset.day = key;
        btn.className = ["cal-day", set.has(key) ? "in" : "", holiday ? "holiday" : "", key === today ? "today" : ""].filter(Boolean).join(" ");
        btn.title = `${month}月${d}日（${weekdayName(key)}）${holiday ? " " + holiday : ""}${set.has(key) ? "：出席" : "：出席なし"}`;
        btn.innerHTML = `<span>${d}</span><span class="cal-sub">${holiday ? escapeHtml(holiday) : ""}</span>${filled ? '<span class="cal-dot"></span>' : ""}`;
        calendarEl.appendChild(btn);
      }
    }

    function renderPrintSheet(rows, dayCount) {
      const year = Number(yearInput.value);
      const month = Number(monthSelect.value);
      const school = activeSchool();
      const student = activeStudent();
      const greeting = String(state.reportGreeting || "").trim();
      const body = rows.map(({ date, entry }) => `
        <tr>
          <td class="c-date">${Number(date.slice(5, 7))}月${Number(date.slice(8, 10))}日</td>
          <td class="c-dow">${weekdayName(date)}</td>
          <td>${entry ? escapeHtml(formatLearning(entry)) : ""}</td>
          <td class="c-act">${entry ? escapeHtml(formatActivity(entry)) : ""}</td>
        </tr>`).join("");
      printSheet.innerHTML = `
        <header class="ps-head">
          <div>
            <p class="ps-org">${escapeHtml(school.name)}</p>
            <h1 class="ps-title">${year}年${month}月　学習の記録</h1>
            <p class="ps-student"><strong>${escapeHtml(student.name)}</strong> さん</p>
          </div>
          <div class="ps-count">出席日数<strong>${dayCount}日</strong></div>
        </header>
        ${greeting ? `<p class="ps-greeting">${escapeHtml(greeting)}</p>` : ""}
        ${rows.length ? `
        <table class="ps-table">
          <thead><tr><th class="c-date">日付</th><th class="c-dow">曜日</th><th>学習内容</th><th class="c-act">活動内容</th></tr></thead>
          <tbody>${body}</tbody>
        </table>` : `<p class="ps-empty">この月の出席はありません。</p>`}
      `;
    }

    function render() {
      const year = Number(yearInput.value);
      const month = Number(monthSelect.value);
      const school = activeSchool();
      const student = activeStudent();
      monthAttendance.created = false;
      const { days, rows, byDate } = monthRows();
      document.getElementById("reportTitle").textContent = `${school.name} / ${student.name} / ${year}年${month}月`;

      const filledDays = days.filter((date) => (byDate.get(date) || []).some(hasContent)).length;
      document.getElementById("totalCount").textContent = `${days.length}日`;
      document.getElementById("filledCount").textContent = String(filledDays);
      document.getElementById("blankCount").textContent = String(days.length - filledDays);

      renderCalendar(days, byDate);
      renderPrintSheet(rows, days.length);

      emptyState.hidden = rows.length > 0;
      tableWrap.hidden = rows.length === 0;
      reportBody.innerHTML = "";

      for (const { date, entry } of rows) {
        const tr = document.createElement("tr");
        const filled = entry && hasContent(entry);
        if (!filled) tr.className = "no-content";
        tr.innerHTML = `
          <td class="small">${shortDate(date)}</td>
          <td class="small">${weekdayName(date)}</td>
          <td>${entry ? escapeHtml(formatLearning(entry)) : "（未記入）"}</td>
          <td>${entry ? escapeHtml(formatActivity(entry)) : ""}</td>
          <td class="small">${entry
            ? `<button type="button" data-edit="${entry.id}">編集</button>`
            : `<button type="button" data-new-date="${date}">入力</button>`}</td>
        `;
        reportBody.appendChild(tr);
      }
      if (monthAttendance.created) save();
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;")
        .replaceAll("\n", "<br>");
    }

    function resetForm() {
      entryId.value = "";
      dateInput.value = localDateString();
      updateWeekdayPreview();
      startTime.value = "10:00";
      endTime.value = "14:00";
      statusInput.value = "出席";
      clearSubjectInputs();
      learningMemoInput.value = "";
      activityTypeInput.value = "";
      activityDetailInput.value = "";
      noteInput.value = "";
      deleteBtn.hidden = true;
      saveStatus.textContent = "";
    }

    function syncMonthToDate(dateValue) {
      if (!dateValue) return;
      const [year, month] = dateValue.split("-").map(Number);
      yearInput.value = String(year);
      monthSelect.value = String(month);
    }

    function editEntry(id) {
      const item = entries.find((entry) => entry.id === id);
      if (!item) return;
      schoolSelect.value = item.schoolId || schools[0].id;
      schoolNameInput.value = activeSchool()?.name || "";
      renderStudents();
      studentSelect.value = item.studentId || students[0].id;
      studentNameInput.value = activeStudent()?.name || "";
      entryId.value = item.id;
      dateInput.value = item.date;
      startTime.value = item.startTime || "";
      endTime.value = item.endTime || "";
      statusInput.value = item.status;
      setSubjectInputs(item.subjects || []);
      learningMemoInput.value = item.learningMemo || (item.subjects?.length ? "" : item.learning || "");
      activityTypeInput.value = item.activityType || "";
      activityDetailInput.value = item.activityDetail || (item.activityType ? "" : item.activity || "");
      noteInput.value = item.note || "";
      deleteBtn.hidden = false;
      syncMonthToDate(item.date);
      updateWeekdayPreview();
      render();
      showToast("編集できます");
    }

    function toCsvValue(value) {
      return `"${String(value || "").replaceAll('"', '""')}"`;
    }

    function exportCsv() {
      const { rows } = monthRows();
      const school = activeSchool();
      const student = activeStudent();
      const csvRows = [
        ["学習施設", "生徒", "日にち", "曜日", "学習内容", "活動内容"],
        ...rows.map(({ date, entry }) => [school.name, student.name, date, weekdayName(date), entry ? formatLearning(entry) : "", entry ? formatActivity(entry) : ""]),
      ];
      const csv = csvRows.map((row) => row.map(toCsvValue).join(",")).join("\n");
      const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `attendance_${school.name}_${student.name}_${yearInput.value}-${pad(monthSelect.value)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function renderWeekdayPicks() {
      const student = activeStudent();
      const weekdays = studentWeekdays(student);
      weekdayPicks.innerHTML = DOW.map((name, i) =>
        `<label><input type="checkbox" data-dow="${i}" ${weekdays.includes(i) ? "checked" : ""} />${name}</label>`
      ).join("");
    }

    function restoreSeenData() {
      if (!schools.some((school) => school.id === defaultSchool.id)) {
        schools.push({ ...defaultSchool });
      }
      if (!students.some((student) => student.id === defaultStudent.id)) {
        students.push({ ...defaultStudent, schoolId: defaultSchool.id });
      }
      const exists = entries.some((entry) =>
        entry.schoolId === recoveredEntry.schoolId &&
        entry.studentId === recoveredEntry.studentId &&
        entry.date === recoveredEntry.date &&
        entry.learning === recoveredEntry.learning &&
        entry.activity === recoveredEntry.activity
      );
      if (!exists) {
        entries.push({ ...recoveredEntry });
      }
      state.activeSchoolId = defaultSchool.id;
      state.activeStudentId = defaultStudent.id;
      renderSchools();
      renderStudents();
      save();
      render();
      showToast(exists ? "復旧済みのデータがあります" : "データを復旧しました");
    }

    function saveAllInternal() {
      save();
      showDataSavedStatus();
      showToast("保存しました");
    }

    function exportBackup() {
      save();
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `attendance_backup_${localDateString()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showDataSavedStatus();
      showToast("全データを保存しました");
    }

    function importBackupFile(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const imported = JSON.parse(String(reader.result || ""));
          if (!Array.isArray(imported.schools) || !Array.isArray(imported.students) || !Array.isArray(imported.entries)) {
            throw new Error("invalid backup");
          }
          applyStoredState(imported);
          save();
          showToast("バックアップを読み込みました");
          setTimeout(() => location.reload(), 400);
        } catch {
          showToast("バックアップを読み込めませんでした");
        }
      };
      reader.readAsText(file);
    }

    async function boot() {
      renderSubjectInputs();
      fillSelects();
      const now = new Date();
      yearInput.value = String(now.getFullYear());
      monthSelect.value = String(now.getMonth() + 1);
      await loadFromDataFile();
      greetingInput.value = state.reportGreeting || "";
      renderSchools();
      renderStudents();
      save();
      resetForm();
      render();
    }

    boot();

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") save();
    });
    window.addEventListener("pagehide", save);
    window.addEventListener("beforeunload", save);

    document.getElementById("todayBtn").addEventListener("click", () => {
      dateInput.value = localDateString();
      syncMonthToDate(dateInput.value);
      updateWeekdayPreview();
      render();
    });

    document.getElementById("thisMonthBtn").addEventListener("click", () => {
      const today = new Date();
      yearInput.value = String(today.getFullYear());
      monthSelect.value = String(today.getMonth() + 1);
      render();
    });

    document.getElementById("saveAllDataBtn").addEventListener("click", saveAllInternal);
    document.getElementById("clearBtn").addEventListener("click", resetForm);
    document.getElementById("newEntryBtn").addEventListener("click", resetForm);
    document.getElementById("openRosterBtn").addEventListener("click", () => {
      rosterSchoolSelect.value = schoolSelect.value;
      rosterStudentSelect.value = studentSelect.value;
      newSchoolNameInput.value = "";
      newStudentNameInput.value = "";
      schoolNameInput.value = activeSchool()?.name || "";
      studentNameInput.value = activeStudent()?.name || "";
      renderWeekdayPicks();
      document.body.classList.add("roster-mode");
    });
    document.getElementById("closeRosterBtn").addEventListener("click", () => {
      document.body.classList.remove("roster-mode");
      renderSchools();
      renderStudents();
      save();
      render();
    });
    document.getElementById("restoreSeenDataBtn").addEventListener("click", restoreSeenData);
    document.getElementById("backupDataBtn").addEventListener("click", exportBackup);
    document.getElementById("importDataBtn").addEventListener("click", () => {
      document.getElementById("importDataInput").click();
    });
    document.getElementById("importDataInput").addEventListener("change", (event) => {
      const file = event.target.files?.[0];
      if (file) importBackupFile(file);
      event.target.value = "";
    });
    schoolSelect.addEventListener("change", () => {
      schoolNameInput.value = activeSchool()?.name || "";
      state.activeSchoolId = schoolSelect.value;
      state.activeStudentId = students.find((student) => student.schoolId === schoolSelect.value)?.id || "";
      renderStudents();
      resetForm();
      save();
      render();
    });
    rosterSchoolSelect.addEventListener("change", () => {
      schoolSelect.value = rosterSchoolSelect.value;
      schoolNameInput.value = activeSchool()?.name || "";
      state.activeSchoolId = schoolSelect.value;
      state.activeStudentId = students.find((student) => student.schoolId === schoolSelect.value)?.id || "";
      renderStudents();
      resetForm();
      save();
      render();
    });
    studentSelect.addEventListener("change", () => {
      studentNameInput.value = activeStudent()?.name || "";
      resetForm();
      save();
      render();
    });
    rosterStudentSelect.addEventListener("change", () => {
      studentSelect.value = rosterStudentSelect.value;
      studentNameInput.value = activeStudent()?.name || "";
      renderWeekdayPicks();
      resetForm();
      save();
      render();
    });
    document.getElementById("addSchoolBtn").addEventListener("click", () => {
      const name = newSchoolNameInput.value.trim();
      if (!name) {
        showToast("学習施設名を入力してください");
        return;
      }
      const school = { id: crypto.randomUUID(), name };
      const student = { id: crypto.randomUUID(), schoolId: school.id, name: "生徒1" };
      schools.push(school);
      students.push(student);
      state.activeSchoolId = school.id;
      state.activeStudentId = student.id;
      renderSchools();
      renderStudents();
      resetForm();
      newSchoolNameInput.value = "";
      newStudentNameInput.value = "";
      save();
      render();
      showToast("学習施設を追加しました");
    });
    document.getElementById("renameSchoolBtn").addEventListener("click", () => {
      const school = activeSchool();
      const name = schoolNameInput.value.trim();
      if (!school || !name) {
        showToast("学習施設名を入力してください");
        return;
      }
      school.name = name;
      state.activeSchoolId = school.id;
      renderSchools();
      save();
      render();
      showToast("施設名を更新しました");
    });
    document.getElementById("deleteSchoolBtn").addEventListener("click", () => {
      const school = activeSchool();
      if (!school || schools.length <= 1) return;
      const ok = window.confirm(`${school.name} と、その施設の生徒・出席記録を削除します。よろしいですか？`);
      if (!ok) return;
      for (let i = entries.length - 1; i >= 0; i -= 1) {
        if (entries[i].schoolId === school.id) entries.splice(i, 1);
      }
      for (let i = students.length - 1; i >= 0; i -= 1) {
        if (students[i].schoolId === school.id) students.splice(i, 1);
      }
      const index = schools.findIndex((item) => item.id === school.id);
      if (index >= 0) schools.splice(index, 1);
      state.activeSchoolId = schools[0].id;
      state.activeStudentId = students.find((student) => student.schoolId === schools[0].id)?.id || "";
      renderSchools();
      renderStudents();
      resetForm();
      save();
      render();
      showToast("学習施設を削除しました");
    });
    document.getElementById("addStudentBtn").addEventListener("click", () => {
      const name = newStudentNameInput.value.trim();
      if (!name) {
        showToast("生徒名を入力してください");
        return;
      }
      const student = { id: crypto.randomUUID(), schoolId: activeSchool().id, name };
      students.push(student);
      state.activeStudentId = student.id;
      renderStudents();
      resetForm();
      newStudentNameInput.value = "";
      save();
      render();
      showToast("生徒を追加しました");
    });
    document.getElementById("renameStudentBtn").addEventListener("click", () => {
      const student = activeStudent();
      const name = studentNameInput.value.trim();
      if (!student || !name) {
        showToast("生徒名を入力してください");
        return;
      }
      student.name = name;
      state.activeStudentId = student.id;
      renderStudents();
      save();
      render();
      showToast("名前を更新しました");
    });
    document.getElementById("deleteStudentBtn").addEventListener("click", () => {
      const student = activeStudent();
      if (!student || students.length <= 1) return;
      const schoolStudents = students.filter((item) => item.schoolId === activeSchool().id);
      if (schoolStudents.length <= 1) return;
      const ok = window.confirm(`${student.name} と、その生徒の出席記録を削除します。よろしいですか？`);
      if (!ok) return;
      for (let i = entries.length - 1; i >= 0; i -= 1) {
        if (entries[i].studentId === student.id) entries.splice(i, 1);
      }
      const index = students.findIndex((item) => item.id === student.id);
      if (index >= 0) students.splice(index, 1);
      state.activeStudentId = students.find((item) => item.schoolId === activeSchool().id)?.id || "";
      renderStudents();
      resetForm();
      save();
      render();
      showToast("生徒を削除しました");
    });
    document.getElementById("a4PreviewBtn").addEventListener("click", () => {
      render();
      document.body.classList.add("a4-preview");
      window.scrollTo(0, 0);
    });
    document.getElementById("closePreviewBtn").addEventListener("click", () => {
      document.body.classList.remove("a4-preview");
    });
    window.addEventListener("beforeprint", render);
    calendarEl.addEventListener("click", (event) => {
      const btn = event.target.closest("[data-day]");
      if (!btn) return;
      const student = activeStudent();
      const date = btn.dataset.day;
      const year = Number(yearInput.value);
      const month = Number(monthSelect.value);
      const attending = monthAttendance(student, year, month).includes(date);
      setAttendance(student, date, !attending);
      save();
      render();
      showToast(`${shortDate(date)}を${attending ? "外しました" : "出席に戻しました"}`);
    });
    document.getElementById("resetMonthBtn").addEventListener("click", () => {
      const student = activeStudent();
      const year = Number(yearInput.value);
      const month = Number(monthSelect.value);
      const ok = window.confirm(`${year}年${month}月の出席日を、曜日どおり（祝日を除く）に作り直します。入力済みの学習内容は消えません。`);
      if (!ok) return;
      state.attendance[student.id][monthKey(year, month)] = defaultDays(student, year, month);
      save();
      render();
    });
    weekdayPicks.addEventListener("change", () => {
      const student = activeStudent();
      student.weekdays = [...weekdayPicks.querySelectorAll("[data-dow]")]
        .filter((box) => box.checked).map((box) => Number(box.dataset.dow));
      save();
      showToast("通う曜日を保存しました（まだ開いていない月から使われます）");
    });
    document.getElementById("printBtn").addEventListener("click", () => {
      render();
      window.print();
    });
    document.getElementById("csvBtn").addEventListener("click", exportCsv);
    greetingInput.addEventListener("input", () => {
      state.reportGreeting = greetingInput.value;
      save();
      render();
    });
    document.getElementById("addSubjectBtn").addEventListener("click", () => {
      addSubjectRow();
      const rows = subjectRows.querySelectorAll(".subject-row");
      rows[rows.length - 1].querySelector("[data-subject-select]").focus();
    });
    subjectRows.addEventListener("click", (event) => {
      const button = event.target.closest("[data-remove-subject]");
      if (!button) return;
      button.closest(".subject-row").remove();
      updateSubjectRemoveButtons();
    });

    yearInput.addEventListener("change", render);
    monthSelect.addEventListener("change", render);
    dateInput.addEventListener("change", () => {
      syncMonthToDate(dateInput.value);
      updateWeekdayPreview();
      render();
    });

    entryForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const id = entryId.value || crypto.randomUUID();
      const existingIndex = entries.findIndex((entry) => entry.id === id);
      const subjects = readSubjects();
      const learningMemo = learningMemoInput.value.trim();
      const activityType = activityTypeInput.value;
      const activityDetail = activityDetailInput.value.trim();
      const entry = {
        id,
        schoolId: activeSchool().id,
        studentId: activeStudent().id,
        date: dateInput.value,
        startTime: startTime.value,
        endTime: endTime.value,
        status: statusInput.value,
        subjects,
        learningMemo,
        learning: formatLearning({ subjects, learningMemo }),
        activityType,
        activityDetail,
        activity: formatActivity({ activityType, activityDetail }),
        note: noteInput.value.trim(),
      };

      if (existingIndex >= 0) {
        entries[existingIndex] = entry;
      } else {
        entries.push(entry);
      }

      setAttendance(activeStudent(), entry.date, true);
      save();
      syncMonthToDate(entry.date);
      resetForm();
      render();
      showEntryRegisteredStatus();
      showToast("登録しました");
    });

    deleteBtn.addEventListener("click", () => {
      const id = entryId.value;
      const index = entries.findIndex((entry) => entry.id === id);
      if (index >= 0) {
        entries.splice(index, 1);
        save();
        resetForm();
        render();
        showToast("削除しました");
      }
    });

    reportBody.addEventListener("click", (event) => {
      const button = event.target.closest("[data-edit]");
      if (button) {
        editEntry(button.dataset.edit);
        return;
      }
      const newBtn = event.target.closest("[data-new-date]");
      if (newBtn) {
        resetForm();
        dateInput.value = newBtn.dataset.newDate;
        updateWeekdayPreview();
        dateInput.scrollIntoView({ behavior: "smooth", block: "center" });
        showToast(`${shortDate(newBtn.dataset.newDate)}の内容を入力できます`);
      }
    });
  </script>
</body>
</html>
