<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>タコ VS イカ - 貝殻シューティング</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a1628;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro JP", "Hiragino Sans", sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  .game-wrap {
    position: relative;
  }
  canvas {
    display: block;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(0,100,200,0.2);
    cursor: none;
    max-width: 100vw;
    max-height: 100vh;
  }
  #ui-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    opacity: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border-radius: 12px;
    transition: opacity 0.25s ease;
  }
  #ui-overlay.active {
    pointer-events: auto;
    opacity: 1;
  }
  .overlay-box {
    background: rgba(10,22,40,0.88);
    backdrop-filter: blur(6px);
    border-radius: 24px;
    padding: 2.5rem 2rem;
    text-align: center;
    color: white;
    max-width: 320px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .overlay-box h2 { font-size: 1.8rem; margin-bottom: 0.3rem; }
  .overlay-box .sub { color: rgba(255,255,255,0.5); font-size: 0.85rem; margin-bottom: 1.2rem; }
  .overlay-box .emoji-big { font-size: 3rem; display: block; margin-bottom: 0.5rem; }
  .overlay-box button {
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: 600;
    padding: 0.7rem 2rem;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #f59e4c, #e07c3c);
    color: white;
    cursor: pointer;
    transition: transform 0.1s;
    pointer-events: auto;
  }
  .overlay-box button:active { transform: scale(0.96); }
  .overlay-box .info-line { margin: 0.4rem 0; font-size: 0.9rem; color: rgba(255,255,255,0.6); }
  .controls-hint {
    margin-top: 1rem;
    font-size: 0.75rem;
    color: rgba(255,255,255,0.3);
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="game-wrap">
  <canvas id="gameCanvas"></canvas>
  <div id="ui-overlay" class="active">
    <div class="overlay-box" id="overlay-content">
      <span class="emoji-big">🐙</span>
      <h2>タコ VS イカ</h2>
      <div class="sub">貝殻シューティング</div>
      <div class="info-line">🦑 イカを撃て！</div>
      <div class="info-line">🐟 魚に注意！</div>
      <div class="info-line">🐢 ボス：巨大海亀</div>
      <button id="startBtn">🎮 ゲームスタート</button>
      <div class="controls-hint">← → 移動 / Z か Space で発射 / タップでも操作可</div>
    </div>
  </div>
</div>
<script>
// ============================================================
//  TAKO SHOOTER 🐙  —  Octopus vs Squid: Seashell Shooter
// ============================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('ui-overlay');
const overlayContent = document.getElementById('overlay-content');

// --- Sizing ---
const W = 480, H = 720;
canvas.width = W; canvas.height = H;

function scaleCanvas() {
  const maxW = window.innerWidth - 16;
  const maxH = window.innerHeight - 16;
  const scale = Math.min(maxW / W, maxH / H, 1.2);
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
scaleCanvas();
window.addEventListener('resize', scaleCanvas);

// ============================================================
//  SPRITE DRAWING
// ============================================================
const Sprites = {
  octopus(ctx, x, y, w, h) {
    const cx = x + w/2, by = y + h;
    // Body
    ctx.fillStyle = '#8b5cf6';
    ctx.beginPath();
    ctx.ellipse(cx, y + h*0.4, w*0.35, h*0.3, 0, 0, Math.PI*2);
    ctx.fill();

    // Head dome
    ctx.fillStyle = '#7c3aed';
    ctx.beginPath();
    ctx.ellipse(cx, y + h*0.25, w*0.3, h*0.2, 0, Math.PI, 0);
    ctx.fill();

    // Eyes
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.ellipse(cx-7, y+h*0.22, 5, 6, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx+7, y+h*0.22, 5, 6, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath();
    ctx.ellipse(cx-7, y+h*0.23, 2.5, 3.5, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx+7, y+h*0.23, 2.5, 3.5, 0, 0, Math.PI*2);
    ctx.fill();

    // Tentacles
    ctx.strokeStyle = '#7c3aed';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    for (let i = -3; i <= 3; i++) {
      const tx = cx + i * (w*0.08);
      ctx.beginPath();
      ctx.moveTo(tx, y + h*0.55);
      const sway = Math.sin(Date.now()/300 + i) * 3;
      ctx.quadraticCurveTo(tx + sway, y + h*0.7, tx + sway*2, y + h*0.85);
      ctx.stroke();
    }
  },

  squid(ctx, x, y, w, h) {
    const cx = x + w/2;
    // Body
    ctx.fillStyle = '#f59e4c';
    ctx.beginPath();
    ctx.moveTo(cx - w*0.2, y + h);
    ctx.quadraticCurveTo(cx - w*0.35, y + h*0.4, cx, y);
    ctx.quadraticCurveTo(cx + w*0.35, y + h*0.4, cx + w*0.2, y + h);
    ctx.closePath();
    ctx.fill();

    // Fins
    ctx.fillStyle = '#e88d30';
    ctx.beginPath();
    ctx.moveTo(cx - w*0.1, y + h*0.35);
    ctx.lineTo(cx - w*0.35, y + h*0.2);
    ctx.lineTo(cx - w*0.15, y + h*0.4);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + w*0.1, y + h*0.35);
    ctx.lineTo(cx + w*0.35, y + h*0.2);
    ctx.lineTo(cx + w*0.15, y + h*0.4);
    ctx.fill();

    // Eyes
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.ellipse(cx-5, y+h*0.3, 4, 5, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx+5, y+h*0.3, 4, 5, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath();
    ctx.ellipse(cx-5, y+h*0.31, 2, 3, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx+5, y+h*0.31, 2, 3, 0, 0, Math.PI*2);
    ctx.fill();
  },

  seashell(ctx, x, y, r) {
    // Shell spiral
    ctx.fillStyle = '#f8d5b0';
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const rad = r * (1 - i/16);
      ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad * 0.6);
    }
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#d4a373';
    ctx.lineWidth = 1;
    ctx.stroke();
    // Spiral line
    ctx.beginPath();
    for (let i = 0; i <= 12; i++) {
      const t = i / 12;
      const a = t * Math.PI * 4;
      const rad = r * t * 0.6;
      ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad * 0.5);
    }
    ctx.strokeStyle = '#c4956a';
    ctx.lineWidth = 0.5;
    ctx.stroke();
  },

  fish(ctx, x, y, w, h) {
    const cx = x + w/2;
    // Body
    ctx.fillStyle = '#60a5fa';
    ctx.beginPath();
    ctx.ellipse(cx, y + h/2, w*0.35, h*0.25, 0, 0, Math.PI*2);
    ctx.fill();
    // Tail
    ctx.fillStyle = '#3b82f6';
    ctx.beginPath();
    ctx.moveTo(x + w*0.75, y + h/2);
    ctx.lineTo(x + w, y + h*0.15);
    ctx.lineTo(x + w, y + h*0.85);
    ctx.closePath();
    ctx.fill();
    // Eye
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(x + w*0.25, y + h*0.4, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath();
    ctx.arc(x + w*0.25, y + h*0.4, 1.5, 0, Math.PI*2);
    ctx.fill();
  },

  seaTurtle(ctx, x, y, w, h) {
    const cx = x + w/2, cy = y + h/2;
    // Shell
    ctx.fillStyle = '#2d6a4f';
    ctx.beginPath();
    ctx.ellipse(cx, cy, w*0.4, h*0.3, 0, 0, Math.PI*2);
    ctx.fill();
    // Shell pattern
    ctx.strokeStyle = '#1b4332';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy - h*0.25);
    ctx.lineTo(cx, cy + h*0.25);
    ctx.moveTo(cx - w*0.3, cy);
    ctx.lineTo(cx + w*0.3, cy);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(cx, cy, w*0.2, h*0.15, 0, 0, Math.PI*2);
    ctx.stroke();

    // Head
    ctx.fillStyle = '#40916c';
    ctx.beginPath();
    ctx.ellipse(cx, y, w*0.15, h*0.12, 0, 0, Math.PI*2);
    ctx.fill();
    // Eyes
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(cx-4, y-2, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx+4, y-2, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath();
    ctx.arc(cx-4, y-2, 1.5, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx+4, y-2, 1.5, 0, Math.PI*2);
    ctx.fill();

    // Flippers
    ctx.fillStyle = '#52b788';
    const t = Date.now() / 600;
    // Left flipper
    ctx.beginPath();
    ctx.ellipse(x, cy + Math.sin(t)*8, w*0.12, h*0.08, -0.3 + Math.sin(t)*0.1, 0, Math.PI*2);
    ctx.fill();
    // Right flipper
    ctx.beginPath();
    ctx.ellipse(x + w, cy + Math.sin(t+2)*8, w*0.12, h*0.08, 0.3 + Math.sin(t+2)*0.1, 0, Math.PI*2);
    ctx.fill();
  },

  bubble(ctx, x, y, r) {
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
};

// ============================================================
//  GAME
// ============================================================
const Game = {
  // State
  running: false,
  paused: false,
  score: 0,
  wave: 1,
  lives: 3,
  combo: 0,
  screenShake: 0,
  bossActive: false,
  bossDefeated: false,
  gameOver: false,
  won: false,

  // Entities
  player: null,
  squids: [],
  shells: [],
  fish: [],
  boss: null,
  bossBullets: [],
  particles: [],
  bubbles: [],

  // Timing
  lastSquidSpawn: 0,
  lastFishSpawn: 0,
  squidSpawnInterval: 1500,
  fishSpawnInterval: 4000,
  waveTransition: false,

  init() {
    this.player = {
      x: W/2 - 25, y: H - 80,
      w: 50, h: 50,
      speed: 5,
      lastShot: 0,
      shootCooldown: 250,
      invincible: 0
    };
    this.squids = [];
    this.shells = [];
    this.fish = [];
    this.boss = null;
    this.bossBullets = [];
    this.particles = [];
    this.bubbles = [];
    this.score = 0;
    this.wave = 1;
    this.lives = 3;
    this.combo = 0;
    this.bossActive = false;
    this.bossDefeated = false;
    this.gameOver = false;
    this.won = false;
    this.screenShake = 0;
    this.lastSquidSpawn = 0;
    this.lastFishSpawn = 0;
    this.squidSpawnInterval = 1500;
    this.fishSpawnInterval = 4000;
    this.waveTransition = false;
  },

  start() {
    this.init();
    this.running = true;
    overlay.classList.remove('active');
    this.spawnWaveMessage();
  },

  spawnWaveMessage() {
    this.bubbles.push({
      text: `WAVE ${this.wave}`,
      alpha: 1,
      life: 80
    });
  },

  // ---- Spawning ----
  spawnSquid() {
    const w = 36, h = 40;
    const x = 20 + Math.random() * (W - w - 40);
    const hp = this.wave <= 2 ? 1 : Math.min(2, Math.floor(this.wave / 2));
    this.squids.push({
      x, y: -h, w, h,
      hp,
      speedY: 1 + Math.random() * 0.6 + this.wave * 0.08,
      speedX: (Math.random() - 0.5) * 1.2,
      shootTimer: 100 + Math.random() * 120,
      points: 100
    });
  },

  spawnFish() {
    const w = 40, h = 20;
    const y = 40 + Math.random() * (H * 0.5);
    const dir = Math.random() > 0.5 ? 1 : -1;
    this.fish.push({
      x: dir > 0 ? -w : W + w, y, w, h,
      speedX: (2 + Math.random() * 1.5 + this.wave * 0.1) * dir,
      points: 50
    });
  },

  spawnBoss() {
    const bw = 120, bh = 80;
    this.boss = {
      x: W/2 - bw/2, y: -bh,
      w: bw, h: bh,
      hp: 20 + this.wave * 5,
      maxHp: 20 + this.wave * 5,
      speedX: 1.5,
      targetY: 60 + Math.random() * 40,
      phase: 'enter', // enter | fight | retreat
      shootTimer: 60,
      direction: 1,
      type: 'turtle'
    };
    this.bossActive = true;
  },

  // ---- Player ----
  shoot() {
    const now = Date.now();
    if (now - this.player.lastShot < this.player.shootCooldown) return;
    this.player.lastShot = now;
    this.shells.push({
      x: this.player.x + this.player.w/2,
      y: this.player.y,
      speedY: -7,
      r: 6,
      damage: 1
    });
  },

  // ---- Update ----
  update() {
    if (!this.running || this.paused) return;

    // Player invincibility
    if (this.player.invincible > 0) this.player.invincible--;

    // Screen shake decay
    if (this.screenShake > 0) this.screenShake *= 0.9;
    if (this.screenShake < 0.5) this.screenShake = 0;

    // --- Spawning ---
    if (!this.bossActive) {
      const frame = performance.now();
      // Squid spawning - increases per wave
      const interval = Math.max(400, this.squidSpawnInterval - this.wave * 80);
      if (frame - this.lastSquidSpawn > interval) {
        const count = Math.min(1 + Math.floor(this.wave / 2), 3);
        for (let i = 0; i < count; i++) {
          setTimeout(() => { if (this.running) this.spawnSquid(); }, i * 200);
        }
        this.lastSquidSpawn = frame;
      }
      // Fish spawning
      if (frame - this.lastFishSpawn > this.fishSpawnInterval) {
        this.spawnFish();
        this.lastFishSpawn = frame;
      }

      // Wave progression - boss every 5 waves
      const squidCount = this.squids.length;
      if (this.wave % 5 === 0 && squidCount === 0 && !this.bossActive && !this.bossDefeated) {
        this.spawnBoss();
      }
    }

    // --- Update squids ---
    for (let i = this.squids.length - 1; i >= 0; i--) {
      const s = this.squids[i];
      s.y += s.speedY;
      s.x += s.speedX;
      // Boundary bounce
      if (s.x < 0 || s.x + s.w > W) s.speedX *= -1;
      // Shoot at player
      s.shootTimer--;
      if (s.shootTimer <= 0) {
        s.shootTimer = 120 - this.wave * 5 + Math.random() * 60;
        if (s.shootTimer < 30) s.shootTimer = 30;
        // Small bubble projectile
        this.bossBullets.push({
          x: s.x + s.w/2, y: s.y + s.h,
          speedY: 2 + this.wave * 0.1,
          speedX: (Math.random() - 0.5) * 0.5,
          r: 4,
          damage: 1
        });
      }
      // Remove if off screen
      if (s.y > H + 20) {
        this.squids.splice(i, 1);
        this.combo = 0;
      }
    }

    // --- Update fish ---
    for (let i = this.fish.length - 1; i >= 0; i--) {
      const f = this.fish[i];
      f.x += f.speedX;
      if (f.x < -60 || f.x > W + 60) {
        this.fish.splice(i, 1);
      }
    }

    // --- Update boss bullets (ink/bubbles from squids) ---
    for (let i = this.bossBullets.length - 1; i >= 0; i--) {
      const b = this.bossBullets[i];
      b.x += b.speedX;
      b.y += b.speedY;
      if (b.y > H + 20 || b.x < -20 || b.x > W + 20) {
        this.bossBullets.splice(i, 1);
      }
    }

    // --- Update shells ---
    for (let i = this.shells.length - 1; i >= 0; i--) {
      const sh = this.shells[i];
      sh.y += sh.speedY;
      if (sh.y < -20) { this.shells.splice(i, 1); continue; }

      // Hit squids
      let hit = false;
      for (let j = this.squids.length - 1; j >= 0; j--) {
        const sq = this.squids[j];
        if (sh.x > sq.x && sh.x < sq.x + sq.w && sh.y > sq.y && sh.y < sq.y + sq.h) {
          sq.hp -= sh.damage;
          hit = true;
          this.spawnParticles(sh.x, sh.y, '#f59e4c', 5);
          if (sq.hp <= 0) {
            this.score += sq.points * (1 + Math.floor(this.combo / 5) * 0.5);
            this.combo++;
            this.spawnParticles(sq.x + sq.w/2, sq.y + sq.h/2, '#f59e4c', 12);
            this.squids.splice(j, 1);
          }
          break;
        }
      }
      if (hit) { this.shells.splice(i, 1); continue; }

      // Hit fish
      for (let j = this.fish.length - 1; j >= 0; j--) {
        const f = this.fish[j];
        if (sh.x > f.x && sh.x < f.x + f.w && sh.y > f.y && sh.y < f.y + f.h) {
          this.score += f.points;
          this.combo++;
          this.spawnParticles(sh.x, sh.y, '#60a5fa', 8);
          this.fish.splice(j, 1);
          this.shells.splice(i, 1);
          break;
        }
      }

      // Hit boss
      if (this.boss && !hit) {
        const b = this.boss;
        if (sh.x > b.x && sh.x < b.x + b.w && sh.y > b.y && sh.y < b.y + b.h) {
          b.hp -= sh.damage;
          this.shells.splice(i, 1);
          this.spawnParticles(sh.x, sh.y, '#2d6a4f', 8);
          if (b.hp <= 0) {
            this.bossDefeated = true;
            this.bossActive = false;
            this.score += 1000 * this.wave;
            this.spawnParticles(b.x + b.w/2, b.y + b.h/2, '#2d6a4f', 40);
            this.screenShake = 15;
            this.boss = null;
            this.wave++;
            this.spawnWaveMessage();
            // Clear remaining enemies
            this.squids = [];
            this.fish = [];
            this.bossBullets = [];
            // Win check
            if (this.wave > 15) {
              this.win();
            }
          }
        }
      }
    }

    // --- Update boss ---
    if (this.boss) {
      const b = this.boss;
      if (b.phase === 'enter') {
        b.y += 1.5;
        if (b.y >= b.targetY) {
          b.phase = 'fight';
        }
      } else if (b.phase === 'fight') {
        // Move side to side
        b.x += b.speedX * b.direction;
        if (b.x < 20 || b.x + b.w > W - 20) b.direction *= -1;

        // Shoot
        b.shootTimer--;
        if (b.shootTimer <= 0) {
          b.shootTimer = Math.max(20, 60 - this.wave * 3);
          // Spread shot
          for (let ang = -0.3; ang <= 0.3; ang += 0.15) {
            this.bossBullets.push({
              x: b.x + b.w/2, y: b.y + b.h,
              speedY: 2 + Math.sin(ang) * 0.5,
              speedX: Math.sin(ang) * 2,
              r: 6,
              damage: 1,
              type: 'boss'
            });
          }
        }
      }
    }

    // --- Update particles ---
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.05;
      p.life--;
      if (p.life <= 0) this.particles.splice(i, 1);
    }

    // --- Update bubbles (UI effects) ---
    for (let i = this.bubbles.length - 1; i >= 0; i--) {
      const b = this.bubbles[i];
      b.life--;
      b.alpha = Math.min(1, b.life / 30);
      if (b.life <= 0) this.bubbles.splice(i, 1);
    }

    // --- Collision detection: player vs enemies ---
    const p = this.player;
    if (p.invincible <= 0) {
      // Squids
      for (let i = this.squids.length - 1; i >= 0; i--) {
        const s = this.squids[i];
        if (this.rectOverlap(p.x, p.y, p.w, p.h, s.x, s.y, s.w, s.h)) {
          this.playerHit();
          break;
        }
      }
      // Fish
      if (p.invincible > 0) {} else {
        for (let i = this.fish.length - 1; i >= 0; i--) {
          const f = this.fish[i];
          if (this.rectOverlap(p.x, p.y, p.w, p.h, f.x, f.y, f.w, f.h)) {
            this.playerHit();
            break;
          }
        }
      }
      // Boss bullets
      for (let i = this.bossBullets.length - 1; i >= 0; i--) {
        const b = this.bossBullets[i];
        const dx = p.x + p.w/2 - b.x;
        const dy = p.y + p.h/2 - b.y;
        if (Math.sqrt(dx*dx + dy*dy) < b.r + 18) {
          this.bossBullets.splice(i, 1);
          this.playerHit();
          break;
        }
      }
      // Boss body
      if (this.boss) {
        const b = this.boss;
        if (this.rectOverlap(p.x, p.y, p.w, p.h, b.x, b.y, b.w, b.h)) {
          this.playerHit();
        }
      }
    }

    // Ambient bubbles
    if (Math.random() < 0.02) {
      this.bubbles.push({
        text: '',
        x: Math.random() * W, y: H + 10,
        life: 120,
        alpha: 0.3,
        isAmbient: true,
        vy: -0.3 - Math.random() * 0.5
      });
    }
    for (let i = this.bubbles.length - 1; i >= 0; i--) {
      const b = this.bubbles[i];
      if (b.isAmbient) {
        b.y += b.vy || -0.3;
        b.x += Math.sin(Date.now()/1000 + b.x) * 0.1;
        if (b.y < -10) { this.bubbles.splice(i, 1); }
      }
    }
  },

  rectOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  },

  playerHit() {
    if (this.player.invincible > 0) return;
    this.lives--;
    this.combo = 0;
    this.player.invincible = 90; // ~1.5 sec
    this.screenShake = 10;
    this.spawnParticles(this.player.x + this.player.w/2, this.player.y + this.player.h/2, '#8b5cf6', 15);
    if (this.lives <= 0) {
      this.endGame(true);
    }
  },

  win() {
    this.won = true;
    this.running = false;
    this.showOverlay('victory');
  },

  endGame(lost) {
    this.running = false;
    this.gameOver = true;
    this.showOverlay(lost ? 'gameover' : 'victory');
  },

  showOverlay(type) {
    overlay.classList.add('active');
    if (type === 'gameover') {
      overlayContent.innerHTML = `
        <span class="emoji-big">💀</span>
        <h2>GAME OVER</h2>
        <div class="sub">タコは倒れた…</div>
        <div class="info-line">スコア: ${Math.floor(this.score)}</div>
        <div class="info-line">到達 Wave: ${this.wave}</div>
        <button onclick="Game.start()">🔄 もう一度</button>
      `;
    } else if (type === 'victory') {
      overlayContent.innerHTML = `
        <span class="emoji-big">🏆</span>
        <h2>VICTORY!</h2>
        <div class="sub">全てのイカを制圧した！</div>
        <div class="info-line">スコア: ${Math.floor(this.score)}</div>
        <div class="info-line">到達 Wave: ${this.wave}</div>
        <button onclick="Game.start()">🔄 もう一度</button>
      `;
    }
  },

  spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 3;
      this.particles.push({
        x, y,
        vx: Math.cos(ang) * speed,
        vy: Math.sin(ang) * speed,
        color,
        life: 20 + Math.random() * 20,
        r: 2 + Math.random() * 3
      });
    }
  },

  // ---- Draw ----
  draw() {
    ctx.save();

    // Screen shake
    if (this.screenShake > 0.5) {
      const sx = (Math.random() - 0.5) * this.screenShake;
      const sy = (Math.random() - 0.5) * this.screenShake;
      ctx.translate(sx, sy);
    }

    // Ocean gradient
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a3d6b');
    grad.addColorStop(0.3, '#0c5a8a');
    grad.addColorStop(0.6, '#0a4a7a');
    grad.addColorStop(1, '#061a30');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Ocean floor decoration
    ctx.fillStyle = 'rgba(255,255,255,0.02)';
    ctx.fillRect(0, H-15, W, 15);

    // Seaweed
    ctx.strokeStyle = 'rgba(46, 139, 87, 0.15)';
    ctx.lineWidth = 5;
    for (let i = 0; i < 8; i++) {
      const sx = 30 + i * 60;
      const sy = H;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      const t = Date.now() / 1500;
      ctx.quadraticCurveTo(sx + Math.sin(t + i) * 8, sy-30, sx + Math.sin(t*0.7 + i*0.5) * 10, sy-60);
      ctx.stroke();
    }

    // Ambient bubbles
    for (const b of this.bubbles) {
      if (b.isAmbient) {
        Sprites.bubble(ctx, b.x, b.y, 3 + b.life/40);
      }
    }

    // Draw enemies
    for (const s of this.squids) {
      Sprites.squid(ctx, s.x, s.y, s.w, s.h);
    }

    for (const f of this.fish) {
      const dir = f.speedX > 0 ? 1 : -1;
      ctx.save();
      if (dir < 0) { ctx.translate(f.x + f.w/2, 0); ctx.scale(-1, 1); ctx.translate(-(f.x + f.w/2), 0); }
      Sprites.fish(ctx, f.x, f.y, f.w, f.h);
      ctx.restore();
    }

    // Draw boss
    if (this.boss) {
      Sprites.seaTurtle(ctx, this.boss.x, this.boss.y, this.boss.w, this.boss.h);
      // HP bar
      const barW = this.boss.w + 20;
      const barH = 6;
      const barX = this.boss.x + this.boss.w/2 - barW/2;
      const barY = this.boss.y - 12;
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.roundRect(barX, barY, barW, barH, 3);
      ctx.fill();
      const ratio = Math.max(0, this.boss.hp / this.boss.maxHp);
      ctx.fillStyle = ratio > 0.5 ? '#52b788' : ratio > 0.25 ? '#f59e4c' : '#e74c3c';
      ctx.roundRect(barX, barY, barW * ratio, barH, 3);
      ctx.fill();
    }

    // Draw boss bullets
    for (const b of this.bossBullets) {
      ctx.fillStyle = 'rgba(200,230,255,0.5)';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.beginPath();
      ctx.arc(b.x-1, b.y-1, b.r*0.5, 0, Math.PI*2);
      ctx.fill();
    }

    // Draw shells
    for (const sh of this.shells) {
      Sprites.seashell(ctx, sh.x, sh.y, sh.r);
    }

    // Draw particles
    for (const p of this.particles) {
      ctx.globalAlpha = p.life / 30;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (p.life / 30), 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Draw player
    if (this.running || this.paused) {
      const p = this.player;
      if (p.invincible > 0 && Math.floor(p.invincible / 6) % 2 === 0) {
        // Blinking when invincible
      } else {
        Sprites.octopus(ctx, p.x, p.y, p.w, p.h);
      }
    }

    // Draw UI
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = 'bold 18px -apple-system, "SF Pro JP", "Hiragino Sans", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`🦑 ${Math.floor(this.score)}`, 14, 32);
    ctx.fillText(`❤️ ×${this.lives}`, 14, 58);

    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '15px -apple-system, "SF Pro JP", "Hiragino Sans", sans-serif';
    ctx.fillText(`WAVE ${this.wave}`, W - 14, 32);

    if (this.combo > 0) {
      ctx.textAlign = 'center';
      ctx.fillStyle = this.combo >= 10 ? '#f59e4c' : 'rgba(255,255,255,0.5)';
      ctx.font = this.combo >= 10 ? 'bold 20px sans-serif' : '14px sans-serif';
      ctx.fillText(this.combo >= 10 ? `🔥 ${this.combo} COMBO!` : `${this.combo} combo`, W/2, 58);
    }

    // Wave announcement
    for (const b of this.bubbles) {
      if (b.text) {
        ctx.globalAlpha = b.alpha;
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.font = 'bold 36px -apple-system, "SF Pro JP", "Hiragino Sans", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(b.text, W/2, H/2 - 20);
        ctx.globalAlpha = 1;
      }
    }

    // Boss HP indicator
    if (this.boss) {
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('🐢 巨大海亀', W/2, 16);
    }

    ctx.restore();
  }
};

// --- Polyfill roundRect ---
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (r > w/2) r = w/2;
    if (r > h/2) r = h/2;
    this.moveTo(x + r, y);
    this.lineTo(x + w - r, y);
    this.quadraticCurveTo(x + w, y, x + w, y + r);
    this.lineTo(x + w, y + h - r);
    this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    this.lineTo(x + r, y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - r);
    this.lineTo(x, y + r);
    this.quadraticCurveTo(x, y, x + r, y);
    return this;
  };
}

// ============================================================
//  INPUT
// ============================================================
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  // Z / Space / 変換キー / e.code で発射（IME環境でも動くように）
  if (e.key === 'z' || e.key === 'Z' || e.key === ' ' || e.key === 'Space' || e.code === 'KeyZ') {
    if (Game.running) { e.preventDefault(); Game.shoot(); }
  }
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

// Touch controls
let touchX = null;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  touchX = e.touches[0].clientX - rect.left;
  if (Game.running) Game.shoot();
  const scaleX = W / rect.width;
  const gameX = (e.touches[0].clientX - rect.left) * scaleX;
  Game.player.x = Math.max(0, Math.min(W - Game.player.w, gameX - Game.player.w/2));
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!Game.running) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const gameX = (e.touches[0].clientX - rect.left) * scaleX;
  Game.player.x = Math.max(0, Math.min(W - Game.player.w, gameX - Game.player.w/2));
});
canvas.addEventListener('touchend', e => { touchX = null; });

// Mouse control
canvas.addEventListener('mousemove', e => {
  if (!Game.running) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const gameX = (e.clientX - rect.left) * scaleX;
  Game.player.x = Math.max(0, Math.min(W - Game.player.w, gameX - Game.player.w/2));
});
canvas.addEventListener('click', e => {
  if (Game.running) Game.shoot();
});

// ============================================================
//  GAME LOOP
// ============================================================
function gameLoop() {
  // Handle continuous input
  if (Game.running) {
    if (keys['ArrowLeft'] || keys['a']) Game.player.x -= Game.player.speed;
    if (keys['ArrowRight'] || keys['d']) Game.player.x += Game.player.speed;
    Game.player.x = Math.max(0, Math.min(W - Game.player.w, Game.player.x));
  }

  Game.update();
  Game.draw();
  requestAnimationFrame(gameLoop);
}

// Start button
document.getElementById('startBtn').addEventListener('click', () => {
  Game.start();
});

// Render initial background
Game.draw();
gameLoop();
</script>
