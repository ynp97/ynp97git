<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 810" width="900" height="810" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Meiryo, sans-serif">
  <rect width="900" height="810" fill="#FFFFFF"/>
  <text x="36" y="42" font-size="22" font-weight="bold" fill="#212529">速結端子の中で起きていること（断面）</text>
  <text x="36" y="68" font-size="13.5" fill="#666666">電線の穴と解除穴は、となり合って同じ面から入っている。ドライバーは電線と平行に差し込む。</text>

  <!-- Panel 1 -->
  <text x="36" y="104" font-size="15" font-weight="bold" fill="#212529">① 差さっている状態 ── 引っ張るほど締まる</text>
  <rect x="150" y="112" width="600" height="110" rx="4" fill="#F1F3F5" stroke="#495057" stroke-width="2.5"/>
  <rect x="30" y="174" width="130" height="16" fill="#495057"/>
  <rect x="158" y="176" width="270" height="12" fill="#C77B30"/>
  <rect x="330" y="194" width="330" height="12" fill="#868E96"/>
  <text x="495" y="220" font-size="11.5" text-anchor="middle" fill="#495057">金属の受け板</text>
  <path d="M560 140 L400 172" fill="none" stroke="#343A40" stroke-width="8" stroke-linecap="round"/>
  <path d="M400 164 l14 -4 l0 14 Z" fill="#343A40"/>
  <text x="586" y="140" font-size="12.5" font-weight="bold" fill="#343A40">バネの爪</text>
  <text x="60" y="212" font-size="12" fill="#495057">電線</text>
  <text x="180" y="146" font-size="12.5" fill="#C92A2A">爪が斜めに食い込んでいるので、引くほど深く刺さる</text>

  <!-- Panel 2 -->
  <text x="36" y="314" font-size="15" font-weight="bold" fill="#212529">② 解除穴にドライバーを入れる ── 爪が持ち上がる</text>
  <rect x="150" y="322" width="600" height="110" rx="4" fill="#F1F3F5" stroke="#495057" stroke-width="2.5"/>
  <rect x="30" y="384" width="130" height="16" fill="#495057"/>
  <rect x="158" y="386" width="270" height="12" fill="#C77B30"/>
  <rect x="330" y="404" width="330" height="12" fill="#868E96"/>
  <path d="M20 340 H370 L392 348 L370 356 H20 Z" fill="#ADB5BD" stroke="#495057" stroke-width="2"/>
  <text x="90" y="334" font-size="12.5" font-weight="bold" fill="#212529">マイナスドライバー（幅2mm）</text>
  <path d="M560 350 L410 370" fill="none" stroke="#343A40" stroke-width="8" stroke-linecap="round"/>
  <path d="M425 400 V378" fill="none" stroke="#2B8A3E" stroke-width="4"/>
  <path d="M425 370 l-7 12 h14 Z" fill="#2B8A3E"/>
  <text x="440" y="396" font-size="12.5" font-weight="bold" fill="#2B8A3E">爪が電線から離れる</text>
  <text x="180" y="358" font-size="12" fill="#868E96">奥で「コツッ」と当たるところまで</text>

  <!-- Panel 3 -->
  <text x="36" y="524" font-size="15" font-weight="bold" fill="#212529">③ 押したまま、電線を引く</text>
  <rect x="150" y="532" width="600" height="110" rx="4" fill="#F1F3F5" stroke="#495057" stroke-width="2.5"/>
  <rect x="60" y="594" width="130" height="16" fill="#495057"/>
  <rect x="188" y="596" width="240" height="12" fill="#C77B30"/>
  <rect x="330" y="614" width="330" height="12" fill="#868E96"/>
  <path d="M20 550 H370 L392 558 L370 566 H20 Z" fill="#ADB5BD" stroke="#495057" stroke-width="2"/>
  <path d="M560 560 L410 580" fill="none" stroke="#343A40" stroke-width="8" stroke-linecap="round"/>
  <path d="M120 640 H40" fill="none" stroke="#E03131" stroke-width="5"/>
  <path d="M32 640 l14 -8 v16 Z" fill="#E03131"/>
  <text x="132" y="645" font-size="13" font-weight="bold" fill="#E03131">軽くひねりながら引く</text>

  <!-- notes -->
  <rect x="36" y="668" width="828" height="124" rx="6" fill="#FFF5F5" stroke="#E03131" stroke-width="2"/>
  <text x="58" y="696" font-size="15" font-weight="bold" fill="#C92A2A">抜けないときの原因は、たいていこの4つ</text>
  <g font-size="13.5" fill="#C92A2A">
    <text x="58" y="722">1.　ドライバーが太い ── 普通のマイナスでは入らない。時計用など先端幅2mmの精密ドライバーが要る。</text>
    <text x="58" y="744">2.　差し込みが浅い ── 手前で止めず、奥で当たるまで押し込む。</text>
    <text x="58" y="766">3.　押す前に引いている ── 押さずに引くと、爪がさらに食い込んで永久に抜けない。</text>
    <text x="58" y="788">4.　その穴が解除穴ではない ── 電線の穴に入れようとしている可能性がある。</text>
  </g>
</svg>
