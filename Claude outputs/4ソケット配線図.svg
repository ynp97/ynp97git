<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1050" width="1000" height="1050" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Meiryo, sans-serif">
  <rect width="1000" height="1050" fill="#FFFFFF"/>

  <text x="40" y="44" font-size="24" font-weight="bold" fill="#212529">どの穴から、どの穴へ</text>
  <text x="40" y="72" font-size="14" fill="#666666">2灯用・ソケット4個。穴の番号は左から ①②③④。使うのは①と②だけ。</text>

  <text x="167" y="126" font-size="15" font-weight="bold" text-anchor="middle" fill="#C92A2A">左端（L側）</text>
  <text x="832" y="126" font-size="15" font-weight="bold" text-anchor="middle" fill="#1864AB">右端（N側）</text>

  <!-- lamps -->
  <rect x="245" y="175" width="510" height="30" fill="#F1F8FF" stroke="#A5D8FF" stroke-width="2"/>
  <text x="500" y="196" font-size="13" text-anchor="middle" fill="#4C8EBB">ランプ1</text>
  <rect x="245" y="365" width="510" height="30" fill="#F1F8FF" stroke="#A5D8FF" stroke-width="2"/>
  <text x="500" y="386" font-size="13" text-anchor="middle" fill="#4C8EBB">ランプ2</text>

  <!-- A1 -->
  <g>
    <rect x="90" y="140" width="155" height="110" rx="4" fill="#F8F9FA" stroke="#212529" stroke-width="2.5"/>
    <text x="167" y="168" font-size="17" font-weight="bold" text-anchor="middle" fill="#C92A2A">A1</text>
    <text x="128" y="190" font-size="11" text-anchor="middle" fill="#868E96">端子A</text>
    <text x="211" y="190" font-size="11" text-anchor="middle" fill="#868E96">端子B</text>
    <line x1="102" y1="196" x2="154" y2="196" stroke="#ADB5BD" stroke-width="1.5"/>
    <line x1="185" y1="196" x2="237" y2="196" stroke="#ADB5BD" stroke-width="1.5"/>
    <rect x="102" y="204" width="24" height="36" rx="2" fill="#E03131"/>
    <rect x="130" y="204" width="24" height="36" rx="2" fill="#E03131"/>
    <rect x="185" y="204" width="24" height="36" rx="2" fill="#CED4DA"/>
    <rect x="213" y="204" width="24" height="36" rx="2" fill="#CED4DA"/>
    <g font-size="14" font-weight="bold" text-anchor="middle"><text x="114" y="228" fill="#FFFFFF">1</text><text x="142" y="228" fill="#FFFFFF">2</text><text x="197" y="228" fill="#868E96">3</text><text x="225" y="228" fill="#868E96">4</text></g>
  </g>
  <!-- A2 -->
  <g>
    <rect x="90" y="330" width="155" height="110" rx="4" fill="#F8F9FA" stroke="#212529" stroke-width="2.5"/>
    <text x="167" y="358" font-size="17" font-weight="bold" text-anchor="middle" fill="#C92A2A">A2</text>
    <text x="128" y="380" font-size="11" text-anchor="middle" fill="#868E96">端子A</text>
    <text x="211" y="380" font-size="11" text-anchor="middle" fill="#868E96">端子B</text>
    <line x1="102" y1="386" x2="154" y2="386" stroke="#ADB5BD" stroke-width="1.5"/>
    <line x1="185" y1="386" x2="237" y2="386" stroke="#ADB5BD" stroke-width="1.5"/>
    <rect x="102" y="394" width="24" height="36" rx="2" fill="#E03131"/>
    <rect x="130" y="394" width="24" height="36" rx="2" fill="#CED4DA"/>
    <rect x="185" y="394" width="24" height="36" rx="2" fill="#CED4DA"/>
    <rect x="213" y="394" width="24" height="36" rx="2" fill="#CED4DA"/>
    <g font-size="14" font-weight="bold" text-anchor="middle"><text x="114" y="418" fill="#FFFFFF">1</text><text x="142" y="418" fill="#868E96">2</text><text x="197" y="418" fill="#868E96">3</text><text x="225" y="418" fill="#868E96">4</text></g>
  </g>
  <!-- B1 -->
  <g>
    <rect x="755" y="140" width="155" height="110" rx="4" fill="#F8F9FA" stroke="#212529" stroke-width="2.5"/>
    <text x="832" y="168" font-size="17" font-weight="bold" text-anchor="middle" fill="#1864AB">B1</text>
    <text x="793" y="190" font-size="11" text-anchor="middle" fill="#868E96">端子A</text>
    <text x="876" y="190" font-size="11" text-anchor="middle" fill="#868E96">端子B</text>
    <line x1="767" y1="196" x2="819" y2="196" stroke="#ADB5BD" stroke-width="1.5"/>
    <line x1="850" y1="196" x2="902" y2="196" stroke="#ADB5BD" stroke-width="1.5"/>
    <rect x="767" y="204" width="24" height="36" rx="2" fill="#1971C2"/>
    <rect x="795" y="204" width="24" height="36" rx="2" fill="#1971C2"/>
    <rect x="850" y="204" width="24" height="36" rx="2" fill="#CED4DA"/>
    <rect x="878" y="204" width="24" height="36" rx="2" fill="#CED4DA"/>
    <g font-size="14" font-weight="bold" text-anchor="middle"><text x="779" y="228" fill="#FFFFFF">1</text><text x="807" y="228" fill="#FFFFFF">2</text><text x="862" y="228" fill="#868E96">3</text><text x="890" y="228" fill="#868E96">4</text></g>
  </g>
  <!-- B2 -->
  <g>
    <rect x="755" y="330" width="155" height="110" rx="4" fill="#F8F9FA" stroke="#212529" stroke-width="2.5"/>
    <text x="832" y="358" font-size="17" font-weight="bold" text-anchor="middle" fill="#1864AB">B2</text>
    <text x="793" y="380" font-size="11" text-anchor="middle" fill="#868E96">端子A</text>
    <text x="876" y="380" font-size="11" text-anchor="middle" fill="#868E96">端子B</text>
    <line x1="767" y1="386" x2="819" y2="386" stroke="#ADB5BD" stroke-width="1.5"/>
    <line x1="850" y1="386" x2="902" y2="386" stroke="#ADB5BD" stroke-width="1.5"/>
    <rect x="767" y="394" width="24" height="36" rx="2" fill="#1971C2"/>
    <rect x="795" y="394" width="24" height="36" rx="2" fill="#CED4DA"/>
    <rect x="850" y="394" width="24" height="36" rx="2" fill="#CED4DA"/>
    <rect x="878" y="394" width="24" height="36" rx="2" fill="#CED4DA"/>
    <g font-size="14" font-weight="bold" text-anchor="middle"><text x="779" y="418" fill="#FFFFFF">1</text><text x="807" y="418" fill="#868E96">2</text><text x="862" y="418" fill="#868E96">3</text><text x="890" y="418" fill="#868E96">4</text></g>
  </g>

  <!-- terminal block -->
  <text x="500" y="548" font-size="16" font-weight="bold" text-anchor="middle" fill="#212529">端子台</text>
  <rect x="400" y="560" width="200" height="110" rx="4" fill="#FFFFFF" stroke="#212529" stroke-width="2.5"/>
  <text x="455" y="602" font-size="14" font-weight="bold" text-anchor="middle" fill="#E03131">L極</text>
  <text x="557" y="602" font-size="14" font-weight="bold" text-anchor="middle" fill="#1971C2">N極</text>
  <rect x="428" y="616" width="24" height="40" rx="2" fill="#E03131"/>
  <rect x="458" y="616" width="24" height="40" rx="2" fill="#868E96"/>
  <rect x="530" y="616" width="24" height="40" rx="2" fill="#868E96"/>
  <rect x="560" y="616" width="24" height="40" rx="2" fill="#1971C2"/>

  <!-- incoming from ceiling -->
  <path d="M470 670 V760" fill="none" stroke="#212529" stroke-width="5"/>
  <path d="M542 670 V760" fill="none" stroke="#ADB5BD" stroke-width="5"/>
  <text x="506" y="786" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#212529">天井からの電源（黒＝L ／ 白＝N）</text>

  <!-- L wiring -->
  <path d="M440 670 V700 H40 V280 H114 V252" fill="none" stroke="#E03131" stroke-width="5" stroke-linejoin="round"/>
  <path d="M114 244 l-8 14 h16 Z" fill="#E03131"/>
  <path d="M142 250 V300 H60 V470 H114 V442" fill="none" stroke="#E03131" stroke-width="5" stroke-linejoin="round"/>
  <path d="M114 434 l-8 14 h16 Z" fill="#E03131"/>
  <text x="150" y="320" font-size="13" font-weight="bold" fill="#E03131">端子台 L極 → A1 の ①</text>
  <text x="60" y="496" font-size="13" font-weight="bold" fill="#E03131">A1 の ② → A2 の ①</text>

  <!-- N wiring -->
  <path d="M572 670 V700 H960 V280 H779 V252" fill="none" stroke="#1971C2" stroke-width="5" stroke-linejoin="round"/>
  <path d="M779 244 l-8 14 h16 Z" fill="#1971C2"/>
  <path d="M807 250 V300 H940 V470 H779 V442" fill="none" stroke="#1971C2" stroke-width="5" stroke-linejoin="round"/>
  <path d="M779 434 l-8 14 h16 Z" fill="#1971C2"/>
  <text x="850" y="320" font-size="13" font-weight="bold" text-anchor="end" fill="#1971C2">端子台 N極 → B1 の ①</text>
  <text x="940" y="496" font-size="13" font-weight="bold" text-anchor="end" fill="#1971C2">B1 の ② → B2 の ①</text>

  <!-- notes -->
  <rect x="40" y="820" width="920" height="200" rx="6" fill="#F8F9FA" stroke="#CED4DA" stroke-width="2"/>
  <text x="62" y="852" font-size="16" font-weight="bold" fill="#212529">差す穴のまとめ（電線は全部で4本）</text>
  <g font-size="14" fill="#212529">
    <text x="62" y="884">1.　端子台 L極 の空いている穴　→　A1 の ①</text>
    <text x="62" y="910">2.　A1 の ②　→　A2 の ①</text>
    <text x="62" y="936">3.　端子台 N極 の空いている穴　→　B1 の ①</text>
    <text x="62" y="962">4.　B1 の ②　→　B2 の ①</text>
  </g>
  <text x="62" y="992" font-size="13" fill="#C92A2A">※ ①②は同じ端子（端子A）。渡り線は必ず①と同じ端子の②から取る。③④は使わない。</text>
  <text x="62" y="1012" font-size="13" fill="#C92A2A">※ 実物でどの2穴が同じ端子かは、テスターの導通レンジでスリット同士を当てて確認する（導通する2つが同じ端子）。</text>
</svg>
