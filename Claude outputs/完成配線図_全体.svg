<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1150" width="1060" height="1150" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Meiryo, sans-serif">
  <rect width="1060" height="1150" fill="#FFFFFF"/>
  <text x="40" y="46" font-size="25" font-weight="bold" fill="#212529">完成時の配線（全体）</text>
  <text x="40" y="72" font-size="14" fill="#666666">天井 → 端子台 → 4つのソケット。電線は新しく差すのが4本だけ。</text>

  <!-- ceiling -->
  <rect x="60" y="92" width="940" height="14" fill="#E9ECEF"/>
  <text x="70" y="128" font-size="13" fill="#868E96">天井</text>
  <path d="M430 106 V195" fill="none" stroke="#868E96" stroke-width="13"/>
  <path d="M730 106 V170" fill="none" stroke="#868E96" stroke-width="13"/>
  <text x="430" y="150" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">①</text>
  <text x="730" y="140" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">②</text>
  <text x="360" y="188" font-size="13" text-anchor="end" fill="#212529">天井ケーブル①</text>
  <text x="800" y="163" font-size="13" fill="#212529">天井ケーブル②</text>

  <!-- ceiling conductors: white first (outline+core), then black -->
  <path d="M430 195 V200 H595 V362" fill="none" stroke="#868E96" stroke-width="9"/>
  <path d="M430 195 V200 H595 V362" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <path d="M730 170 V230 H645 V422" fill="none" stroke="#868E96" stroke-width="9"/>
  <path d="M730 170 V230 H645 V422" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <path d="M430 195 V215 H505 V362" fill="none" stroke="#212529" stroke-width="5"/>
  <path d="M730 170 V185 H555 V422" fill="none" stroke="#212529" stroke-width="5"/>
  <path d="M505 362 H516" fill="none" stroke="#212529" stroke-width="5"/>
  <path d="M555 422 H546" fill="none" stroke="#212529" stroke-width="5"/>
  <path d="M595 362 H606" fill="none" stroke="#868E96" stroke-width="9"/>
  <path d="M595 362 H606" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <path d="M645 422 H636" fill="none" stroke="#868E96" stroke-width="9"/>
  <path d="M645 422 H636" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <text x="478" y="210" font-size="12" font-weight="bold" text-anchor="end" fill="#212529">黒①</text>
  <text x="672" y="196" font-size="12" font-weight="bold" fill="#212529">黒②</text>
  <text x="470" y="196" font-size="12" font-weight="bold" text-anchor="end" fill="#495057">白①</text>
  <text x="700" y="244" font-size="12" font-weight="bold" fill="#495057">白②</text>

  <!-- terminal block -->
  <text x="535" y="316" font-size="16" font-weight="bold" text-anchor="middle" fill="#212529">端子台 41-11443ANL</text>
  <rect x="390" y="322" width="290" height="170" rx="5" fill="#F8F9FA" stroke="#212529" stroke-width="3"/>
  <rect x="402" y="334" width="76" height="146" rx="3" fill="#EBFBEE" stroke="#2B8A3E" stroke-width="2"/>
  <rect x="490" y="334" width="178" height="146" rx="3" fill="#FFFFFF" stroke="#495057" stroke-width="2"/>
  <text x="440" y="356" font-size="12" font-weight="bold" text-anchor="middle" fill="#2B8A3E">アース</text>
  <circle cx="440" cy="392" r="13" fill="#FFFFFF" stroke="#2B8A3E" stroke-width="2.5"/>
  <circle cx="440" cy="440" r="13" fill="#FFFFFF" stroke="#2B8A3E" stroke-width="2.5"/>
  <text x="440" y="472" font-size="11" text-anchor="middle" fill="#2B8A3E">空き</text>
  <text x="579" y="356" font-size="13" font-weight="bold" text-anchor="middle" fill="#212529">電 源</text>
  <circle cx="530" cy="362" r="16" fill="#212529"/>
  <circle cx="530" cy="422" r="16" fill="#212529"/>
  <circle cx="620" cy="362" r="16" fill="#E9ECEF" stroke="#495057" stroke-width="2.5"/>
  <circle cx="620" cy="422" r="16" fill="#E9ECEF" stroke="#495057" stroke-width="2.5"/>
  <text x="530" y="466" font-size="12" font-weight="bold" text-anchor="middle" fill="#212529">L極</text>
  <text x="620" y="466" font-size="12" font-weight="bold" text-anchor="middle" fill="#495057">N極（W）</text>

  <!-- out to fixture -->
  <path d="M530 492 V530 H60 V720 H114 V694" fill="none" stroke="#212529" stroke-width="5" stroke-linejoin="round"/>
  <path d="M114 686 l-8 14 h16 Z" fill="#212529"/>
  <path d="M620 492 V560 H1000 V720 H834 V694" fill="none" stroke="#868E96" stroke-width="9" stroke-linejoin="round"/>
  <path d="M620 492 V560 H1000 V720 H834 V694" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
  <path d="M834 686 l-8 14 h16 Z" fill="#868E96"/>
  <text x="240" y="522" font-size="13" font-weight="bold" fill="#212529">黒 ── 端子台 L極 → A1 の ①</text>
  <text x="820" y="552" font-size="13" font-weight="bold" text-anchor="end" fill="#495057">白 ── 端子台 N極 → B1 の ①</text>

  <!-- lamps -->
  <rect x="240" y="615" width="570" height="30" fill="#F1F8FF" stroke="#A5D8FF" stroke-width="2"/>
  <text x="525" y="636" font-size="13" text-anchor="middle" fill="#4C8EBB">ランプ1（BTL16）</text>
  <rect x="240" y="795" width="570" height="30" fill="#F1F8FF" stroke="#A5D8FF" stroke-width="2"/>
  <text x="525" y="816" font-size="13" text-anchor="middle" fill="#4C8EBB">ランプ2（BTL16）</text>

  <!-- A1 -->
  <rect x="90" y="580" width="150" height="110" rx="4" fill="#F8F9FA" stroke="#212529" stroke-width="2.5"/>
  <text x="165" y="606" font-size="16" font-weight="bold" text-anchor="middle" fill="#212529">A1</text>
  <text x="128" y="628" font-size="10.5" text-anchor="middle" fill="#868E96">端子A</text>
  <text x="211" y="628" font-size="10.5" text-anchor="middle" fill="#868E96">端子B</text>
  <line x1="102" y1="636" x2="154" y2="636" stroke="#ADB5BD" stroke-width="1.5"/>
  <line x1="185" y1="636" x2="237" y2="636" stroke="#ADB5BD" stroke-width="1.5"/>
  <rect x="102" y="644" width="24" height="36" rx="2" fill="#212529"/>
  <rect x="130" y="644" width="24" height="36" rx="2" fill="#212529"/>
  <rect x="185" y="644" width="24" height="36" rx="2" fill="#CED4DA"/>
  <rect x="213" y="644" width="24" height="36" rx="2" fill="#CED4DA"/>
  <g font-size="13" font-weight="bold" text-anchor="middle"><text x="114" y="668" fill="#FFFFFF">1</text><text x="142" y="668" fill="#FFFFFF">2</text><text x="197" y="668" fill="#868E96">3</text><text x="225" y="668" fill="#868E96">4</text></g>
  <!-- A2 -->
  <rect x="90" y="760" width="150" height="110" rx="4" fill="#F8F9FA" stroke="#212529" stroke-width="2.5"/>
  <text x="165" y="786" font-size="16" font-weight="bold" text-anchor="middle" fill="#212529">A2</text>
  <text x="128" y="808" font-size="10.5" text-anchor="middle" fill="#868E96">端子A</text>
  <text x="211" y="808" font-size="10.5" text-anchor="middle" fill="#868E96">端子B</text>
  <line x1="102" y1="816" x2="154" y2="816" stroke="#ADB5BD" stroke-width="1.5"/>
  <line x1="185" y1="816" x2="237" y2="816" stroke="#ADB5BD" stroke-width="1.5"/>
  <rect x="102" y="824" width="24" height="36" rx="2" fill="#212529"/>
  <rect x="130" y="824" width="24" height="36" rx="2" fill="#CED4DA"/>
  <rect x="185" y="824" width="24" height="36" rx="2" fill="#CED4DA"/>
  <rect x="213" y="824" width="24" height="36" rx="2" fill="#CED4DA"/>
  <g font-size="13" font-weight="bold" text-anchor="middle"><text x="114" y="848" fill="#FFFFFF">1</text><text x="142" y="848" fill="#868E96">2</text><text x="197" y="848" fill="#868E96">3</text><text x="225" y="848" fill="#868E96">4</text></g>
  <!-- B1 -->
  <rect x="810" y="580" width="150" height="110" rx="4" fill="#F8F9FA" stroke="#212529" stroke-width="2.5"/>
  <text x="885" y="606" font-size="16" font-weight="bold" text-anchor="middle" fill="#212529">B1</text>
  <text x="848" y="628" font-size="10.5" text-anchor="middle" fill="#868E96">端子A</text>
  <text x="931" y="628" font-size="10.5" text-anchor="middle" fill="#868E96">端子B</text>
  <line x1="822" y1="636" x2="874" y2="636" stroke="#ADB5BD" stroke-width="1.5"/>
  <line x1="905" y1="636" x2="957" y2="636" stroke="#ADB5BD" stroke-width="1.5"/>
  <rect x="822" y="644" width="24" height="36" rx="2" fill="#868E96"/>
  <rect x="850" y="644" width="24" height="36" rx="2" fill="#868E96"/>
  <rect x="905" y="644" width="24" height="36" rx="2" fill="#CED4DA"/>
  <rect x="933" y="644" width="24" height="36" rx="2" fill="#CED4DA"/>
  <g font-size="13" font-weight="bold" text-anchor="middle"><text x="834" y="668" fill="#FFFFFF">1</text><text x="862" y="668" fill="#FFFFFF">2</text><text x="917" y="668" fill="#868E96">3</text><text x="945" y="668" fill="#868E96">4</text></g>
  <!-- B2 -->
  <rect x="810" y="760" width="150" height="110" rx="4" fill="#F8F9FA" stroke="#212529" stroke-width="2.5"/>
  <text x="885" y="786" font-size="16" font-weight="bold" text-anchor="middle" fill="#212529">B2</text>
  <text x="848" y="808" font-size="10.5" text-anchor="middle" fill="#868E96">端子A</text>
  <text x="931" y="808" font-size="10.5" text-anchor="middle" fill="#868E96">端子B</text>
  <line x1="822" y1="816" x2="874" y2="816" stroke="#ADB5BD" stroke-width="1.5"/>
  <line x1="905" y1="816" x2="957" y2="816" stroke="#ADB5BD" stroke-width="1.5"/>
  <rect x="822" y="824" width="24" height="36" rx="2" fill="#868E96"/>
  <rect x="850" y="824" width="24" height="36" rx="2" fill="#CED4DA"/>
  <rect x="905" y="824" width="24" height="36" rx="2" fill="#CED4DA"/>
  <rect x="933" y="824" width="24" height="36" rx="2" fill="#CED4DA"/>
  <g font-size="13" font-weight="bold" text-anchor="middle"><text x="834" y="848" fill="#FFFFFF">1</text><text x="862" y="848" fill="#868E96">2</text><text x="917" y="848" fill="#868E96">3</text><text x="945" y="848" fill="#868E96">4</text></g>

  <!-- 渡り -->
  <path d="M142 690 V740 H70 V900 H114 V874" fill="none" stroke="#212529" stroke-width="5" stroke-linejoin="round"/>
  <path d="M114 866 l-8 14 h16 Z" fill="#212529"/>
  <text x="160" y="912" font-size="13" font-weight="bold" fill="#212529">黒 ── A1 の ② → A2 の ①</text>
  <path d="M862 690 V740 H990 V900 H834 V874" fill="none" stroke="#868E96" stroke-width="9" stroke-linejoin="round"/>
  <path d="M862 690 V740 H990 V900 H834 V874" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
  <path d="M834 866 l-8 14 h16 Z" fill="#868E96"/>
  <text x="790" y="912" font-size="13" font-weight="bold" text-anchor="end" fill="#495057">白 ── B1 の ② → B2 の ①</text>

  <text x="165" y="562" font-size="13" font-weight="bold" text-anchor="middle" fill="#212529">左端（L側・黒）</text>
  <text x="885" y="562" font-size="13" font-weight="bold" text-anchor="middle" fill="#495057">右端（N側・白）</text>

  <!-- notes -->
  <rect x="40" y="940" width="980" height="190" rx="6" fill="#F8F9FA" stroke="#CED4DA" stroke-width="2"/>
  <text x="62" y="972" font-size="16" font-weight="bold" fill="#212529">新しく差す電線は4本だけ</text>
  <g font-size="14" fill="#212529">
    <text x="62" y="1002">1.　端子台 L極 の空き穴 　→　A1 の ①　　（黒）</text>
    <text x="62" y="1028">2.　A1 の ②　→　A2 の ①　　　　　　　　（黒）</text>
    <text x="62" y="1054">3.　端子台 N極 の空き穴 　→　B1 の ①　　（白）</text>
    <text x="62" y="1080">4.　B1 の ②　→　B2 の ①　　　　　　　　（白）</text>
  </g>
  <text x="560" y="1002" font-size="13" fill="#C92A2A">※ 元のリード線2本は抜いて、この黒・白に差し替える。</text>
  <text x="560" y="1026" font-size="13" fill="#C92A2A">※ 安定器・グロー球は撤去。天井の4本は白同士・黒同士でまとめる。</text>
  <text x="560" y="1050" font-size="13" fill="#C92A2A">※ ソケットの③④は最後まで使わない。</text>
  <text x="560" y="1074" font-size="13" fill="#C92A2A">※ ①②が同じ端子かは、テスターの導通レンジで確認する。</text>
  <text x="560" y="1098" font-size="13" fill="#C92A2A">※ アース部は空きのまま。電源線を入れない。</text>
  <text x="62" y="1108" font-size="13" fill="#868E96">黒＝非接地側（L） ／ 白＝接地側（N・端子台のW刻印側）</text>
</svg>
