<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三本立て毎日TODO（6/26〜8/20）</title>
<style>
  :root{
    --bg:#f5f3ee; --card:#fffdf8; --ink:#2b2b2b; --muted:#7c766c;
    --line:#e6e1d6; --shadow:0 6px 22px rgba(60,50,30,.10);
    --si:#3b82f6; --eb:#ef4444; --gk:#22c55e; --ot:#8b5cf6;
    --accent:#c2410c;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1c1b18; --card:#26241f; --ink:#ece7da; --muted:#a59f92; --line:#3a372f; --shadow:0 6px 22px rgba(0,0,0,.35); --accent:#fb923c; --ot:#a78bfa;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 16px 80px;}
  #mainView{display:grid;grid-template-columns:minmax(0,760px) minmax(280px,360px);gap:16px;align-items:start;}
  .todoCore{min-width:0;}
  h1{font-size:18px;margin:0 0 2px;letter-spacing:.02em;}
  .sub{color:var(--muted);font-size:12.5px;margin:0 0 14px;}

  /* progress header */
  .dash{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:14px;}
  .dashTop{display:flex;align-items:center;gap:16px;}
  .ring{flex:none;}
  .ringLabel{font-size:20px;font-weight:700;}
  .ringSub{font-size:10.5px;fill:var(--muted);}
  .bars{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;}
  .bar{display:flex;align-items:center;gap:8px;font-size:12.5px;}
  .bar .nm{width:84px;flex:none;color:var(--muted);}
  .track{flex:1;height:9px;background:var(--line);border-radius:6px;overflow:hidden;}
  .fill{height:100%;width:0;border-radius:6px;transition:width .4s ease;}
  .bar .pct{width:62px;flex:none;text-align:right;font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--muted);}

  /* tabs */
  .tabs{display:flex;gap:6px;margin-bottom:14px;}
  .tab{flex:1;padding:9px;border:1px solid var(--line);background:var(--card);color:var(--muted);
    border-radius:11px;font-size:13.5px;font-weight:600;cursor:pointer;text-align:center;}
  .tab.on{background:var(--accent);color:#fff;border-color:var(--accent);}

  /* himekuri */
  .himeNav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .navBtn{padding:8px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:10px;font-size:13px;cursor:pointer;}
  .navBtn:active{transform:translateY(1px);}
  .today{font-weight:700;color:var(--accent);}
  .page{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
    overflow:hidden;animation:flip .35s ease;}
  @keyframes flip{from{opacity:0;transform:translateY(-8px) rotateX(8deg)}to{opacity:1;transform:none}}
  .pgHead{padding:16px 18px 12px;border-bottom:1px dashed var(--line);position:relative;}
  .pgHead::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);
    width:46px;height:5px;background:var(--line);border-radius:4px;}
  .dnum{font-size:30px;font-weight:800;line-height:1;letter-spacing:.01em;}
  .dnum small{font-size:15px;font-weight:600;color:var(--muted);margin-left:6px;}
  .wgoal{font-size:12px;color:var(--muted);margin-top:6px;}
  .wtag{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);
    border:1px solid var(--accent);border-radius:6px;padding:0 6px;margin-right:6px;}
  .dayCount{float:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .pgBody{padding:8px 14px 16px;}
  .review{padding:14px 16px;color:var(--muted);font-size:13.5px;font-style:italic;}

  /* task row */
  .task{display:flex;gap:11px;padding:11px 8px;border-radius:12px;align-items:flex-start;}
  .task + .task{border-top:1px solid var(--line);}
  .cb{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);
    background:transparent;cursor:pointer;margin-top:1px;display:flex;align-items:center;justify-content:center;
    transition:all .15s;}
  .cb svg{width:14px;height:14px;opacity:0;transform:scale(.6);transition:all .15s;}
  .task.done .cb svg{opacity:1;transform:scale(1);}
  .tbody{flex:1;min-width:0;}
  .meta{display:flex;align-items:center;gap:7px;margin-bottom:1px;flex-wrap:wrap;}
  .chip{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:20px;color:#fff;}
  .w-main{font-size:11px;font-weight:700;color:var(--accent);}
  .w-light{font-size:11px;color:var(--muted);}
  .ttext{font-size:13.5px;}
  .task.done .ttext{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line);}
  .taskCopy{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:8px;padding:2px 7px;font-size:10.5px;cursor:pointer;}
  .taskCopy.copied{border-color:var(--gk);color:var(--gk);font-weight:700;}
  .taskEdit{color:var(--ot);}
  .taskDelete{color:var(--eb);border-color:rgba(239,68,68,.45);}
  .taskDefer{color:var(--accent);border-color:rgba(194,65,12,.45);font-weight:700;}

  /* list view */
  details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow);}
  summary{padding:12px 15px;cursor:pointer;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;list-style:none;}
  summary::-webkit-details-marker{display:none}
  summary .wk{flex:1;}
  summary .wkpct{font-size:11.5px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;}
  summary .tri{transition:transform .2s;color:var(--muted);}
  details[open] summary .tri{transform:rotate(90deg);}
  .day{padding:8px 14px;border-top:1px solid var(--line);}
  .day h4{margin:4px 0 2px;font-size:13px;}
  .day h4 .dc{float:right;font-size:11px;color:var(--muted);font-weight:500;}

  .foot{margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .footActions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
  .reset{font-size:12px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer;}
  .legend{font-size:11.5px;color:var(--muted);}
  .hide{display:none;}
  .done-all{text-align:center;color:var(--gk);font-weight:700;font-size:13px;padding:6px;}

  .cuHd{font-size:11px;font-weight:700;color:var(--ot);margin:8px 8px 0;padding-top:8px;border-top:1px dashed var(--line);}
  .timeTag{font-size:10.5px;font-weight:800;color:var(--accent);border:1px solid var(--accent);border-radius:7px;padding:0 6px;background:rgba(194,65,12,.08);}
  .qaWrap{margin:12px 6px 2px;padding-top:10px;border-top:1px dashed var(--line);}
  .qaLabel{font-size:11.5px;font-weight:800;color:var(--muted);display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;}
  .qaLabel span{font-weight:500;}
  .qa{display:flex;gap:6px;margin:10px 6px 2px;align-items:center;}
  .qa select{flex:none;border:1px solid var(--line);border-radius:8px;padding:7px 4px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:12px;}
  .qa input[type=time]{flex:none;width:88px;border:1px solid var(--line);border-radius:8px;padding:8px 5px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:12.5px;}
  .qa input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:9px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:13.5px;}
  .qa button{flex:none;border:none;background:var(--accent);color:#fff;border-radius:8px;padding:9px 13px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .qa button.secondary{background:var(--ot);}
  /* add panel */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);}
  .panel h3{margin:0 0 4px;font-size:14px;}
  .panel .hint{font-size:11.5px;color:var(--muted);margin:0 0 10px;}
  .panel textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:10px;
    font-family:inherit;font-size:13.5px;background:var(--bg);color:var(--ink);resize:vertical;}
  .fld{margin-top:12px;}
  .fld>label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:6px;}
  .seg{display:flex;gap:6px;flex-wrap:wrap;}
  .seg button{padding:7px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;font-size:12.5px;cursor:pointer;}
  .seg button.on{background:var(--ot);color:#fff;border-color:var(--ot);}
  .dow7{display:flex;gap:5px;}
  .dow7 button{flex:1;padding:8px 0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;font-size:13px;cursor:pointer;}
  .dow7 button.on{background:var(--ot);color:#fff;border-color:var(--ot);}
  .addBtn{margin-top:14px;width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;}
  .mlist{margin-top:18px;}
  .mlist h3{font-size:13px;margin:0 0 4px;}
  .mrow{display:flex;align-items:center;gap:10px;padding:9px 4px;border-top:1px solid var(--line);font-size:13px;}
  .mrow .mt{flex:1;min-width:0;}
  .mrow .mr{font-size:11px;color:var(--ot);font-weight:700;flex:none;white-space:nowrap;}
  .mrow .edit,.mrow .del{flex:none;border:none;background:none;cursor:pointer;font-size:12px;}
  .mrow .edit{color:var(--ot);}
  .mrow .del{color:var(--eb);}
  .doneTag{font-size:10px;font-weight:800;color:#fff;background:var(--gk);border-radius:20px;padding:1px 7px;white-space:nowrap;}
  .endedTag{font-size:10px;font-weight:800;color:#fff;background:var(--muted);border-radius:20px;padding:1px 7px;white-space:nowrap;}
  .empty{color:var(--muted);font-size:12.5px;padding:8px 0;}
  input[type=date],input[type=time]{border:1px solid var(--line);border-radius:9px;padding:8px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:13px;}

  /* missed / carry-over / skip */
  .carryNote{font-size:11.5px;color:var(--eb);margin-top:10px;font-weight:600;}
  .coBox{border:1px solid var(--eb);background:var(--card);border-radius:14px;margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow);}
  .coBox summary{color:var(--eb);padding:11px 14px;cursor:pointer;font-weight:700;font-size:13px;list-style:none;}
  .coBox summary::-webkit-details-marker{display:none}
  .coHint{font-size:11px;color:var(--muted);margin:0 14px 6px;}
  .coRow{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);font-size:12.5px;flex-wrap:wrap;}
  .coDate{color:var(--muted);font-size:11px;flex:none;font-variant-numeric:tabular-nums;}
  .coText{flex:1;min-width:130px;}
  .coDo,.coSkip{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 11px;font-size:11.5px;cursor:pointer;}
  .coDo{color:var(--gk);border-color:var(--gk);} .coSkip{color:var(--muted);}
  .coFoot{padding:11px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;}
  .coRestart{width:100%;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;}
  .coRestartSub{width:100%;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:8px;font-size:11.5px;cursor:pointer;}
  .linkBtn{border:none;background:none;color:var(--accent);font-size:11.5px;cursor:pointer;font-weight:600;}
  .task.skip{opacity:.5;}
  .task.skip .ttext{text-decoration:line-through;text-decoration-color:var(--line);}
  .skipTag{font-size:10px;font-weight:700;color:#fff;background:var(--muted);border-radius:20px;padding:1px 7px;}
  .blkTag{font-size:10px;font-weight:700;color:#fff;background:var(--accent);border-radius:20px;padding:1px 7px;}
  .coBlkNote{font-size:12px;color:var(--accent);font-weight:700;margin:0 14px 6px;background:rgba(194,65,12,.10);padding:7px 9px;border-radius:8px;line-height:1.5;}
  .rebox{margin:8px 12px 4px;border:1px solid var(--accent);border-radius:11px;padding:10px 12px;}
  .rebt{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:5px;}
  .rerow{font-size:12.5px;margin-bottom:7px;}
  .refit{font-size:12px;line-height:1.55;border-radius:8px;padding:7px 9px;}
  .refit.ok{background:rgba(34,197,94,.12);color:var(--gk);}
  .refit.ng{background:rgba(239,68,68,.10);color:var(--eb);font-weight:600;}

  /* 作業マップ */
  .mapProj{margin-bottom:10px;}
  .mapProj>summary .mpPct{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;}
  .mapPhase{border-top:1px solid var(--line);padding:10px 14px;}
  .mpHd{font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .mpHdc{margin-left:auto;font-size:11px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;}
  .mpMeter{height:6px;background:var(--line);border-radius:5px;overflow:hidden;margin:6px 0 2px;}
  .mpFill{height:100%;border-radius:5px;transition:width .4s;}
  .mapRow{display:flex;gap:6px;align-items:flex-start;}
  .mapRow .task{flex:1;min-width:0;}
  .mpDate{flex:none;font-size:10.5px;color:var(--muted);width:38px;padding-top:15px;text-align:right;font-variant-numeric:tabular-nums;}

  /* 今日だけの窓 */
  #todayWin{display:none;}
  .tmode #mainView{display:none;}
  .tmode #todayWin{display:block;}
  #goalsWin{display:none;}
  .gmode #mainView,.gmode #todayWin{display:none;}
  .gmode #goalsWin{display:block;}
  .gmode .wrap{max-width:1040px;padding:22px 18px 40px;}
  .tmode .wrap{max-width:600px;padding:18px 18px 28px;}
  .tBar{display:flex;align-items:center;justify-content:space-between;}
  .tDate{font-size:40px;font-weight:800;line-height:1.05;}
  .tDate small{font-size:18px;color:var(--muted);font-weight:600;margin-left:6px;}
  .tFull{font-size:13px;color:var(--accent);text-decoration:none;font-weight:700;flex:none;}
  .tNote{font-size:12px;color:var(--muted);margin-top:4px;}
  .tGoal{font-size:13px;color:var(--muted);margin:6px 0 12px;}
  .tCarry{font-size:13px;color:var(--eb);font-weight:700;margin-bottom:12px;}
  .tMeter{height:13px;background:var(--line);border-radius:7px;overflow:hidden;}
  .tFill{height:100%;background:var(--accent);border-radius:7px;transition:width .4s;}
  .tCount{font-size:14px;font-weight:700;margin:7px 0 14px;text-align:right;font-variant-numeric:tabular-nums;}
  .tTasks{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:6px 14px;}
  #todayWin .task{padding:15px 6px;}
  #todayWin .cb{width:30px;height:30px;border-radius:9px;}
  #todayWin .cb svg{width:18px;height:18px;}
  #todayWin .ttext{font-size:16px;line-height:1.55;}
  #todayWin .chip{font-size:12px;padding:2px 9px;}
  #todayWin .meta{margin-bottom:3px;}
  #todayWin .cuHd{font-size:13px;}
  .tReview{font-size:15px;color:var(--muted);font-style:italic;padding:10px 4px;line-height:1.75;}
  .calBlock{margin:13px 6px 5px;border:2px solid #8b5cf6;border-radius:13px;overflow:hidden;background:#faf7ff;box-shadow:0 3px 10px rgba(124,58,237,.10);}
  .calHd{display:flex;align-items:center;justify-content:space-between;gap:7px;flex-wrap:wrap;font-size:13px;font-weight:950;color:#fff;padding:8px 11px;background:#7c3aed;letter-spacing:.02em;}
  .calHd small{font-size:11px;font-weight:850;color:#ede9fe;background:rgba(255,255,255,.16);border-radius:999px;padding:2px 8px;}
  .calNote{font-size:10.8px;color:var(--muted);padding:0 7px 5px;}
  .calRow{display:grid;grid-template-columns:62px 22px minmax(0,1fr);gap:8px;align-items:center;padding:11px 10px;border-top:1px solid #ddd6fe;background:#fff;}
  .calRow:first-of-type{border-top:0;}
  .calTime{display:inline-flex;justify-content:center;font-size:11.5px;font-weight:950;color:#6d28d9;background:#ede9fe;border-radius:7px;padding:4px 5px;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .calIcon{font-size:15px;line-height:1;text-align:center;}
  .calText{font-size:15px;font-weight:800;line-height:1.45;color:#35245a;overflow-wrap:anywhere;}
  .calSync{border:1px solid #ddd6fe;background:#faf5ff;border-radius:12px;padding:13px;margin:14px 0;}
  .calSyncRow{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
  .calSyncRow input{flex:1;min-width:240px;}
  .calSyncStatus{font-size:11.5px;color:#6d28d9;font-weight:800;margin:8px 0 0;}
  .mileBox{margin:10px 8px 12px;border:2px solid #f59e0b;background:#fffbeb;border-radius:13px;padding:11px 13px;}
  .mileTitle{font-size:12px;font-weight:900;color:#b45309;margin-bottom:7px;}
  .mileGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
  .mileItem{background:#fff;border:1px solid #fde68a;border-radius:9px;padding:8px;font-size:12px;line-height:1.45;}
  .mileItem b{display:block;margin-bottom:2px;}
  @media(max-width:620px){.mileGrid{grid-template-columns:1fr;}}

  /* ゴール確認の別窓 */
  .gTop{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px;}
  .gTop h1{font-size:22px;margin:0 0 3px;}
  .gLead{font-size:13px;color:var(--muted);margin:0;}
  .gProjects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-bottom:18px;}
  .gProject{background:var(--card);border:1px solid var(--line);border-top:7px solid var(--pc);border-radius:16px;padding:15px;box-shadow:var(--shadow);}
  .gProject h2{font-size:17px;margin:0 0 8px;}
  .gFinal{font-size:14px;font-weight:800;line-height:1.55;background:var(--bg);border-radius:10px;padding:9px 10px;margin-bottom:11px;}
  .gProject h3{font-size:11px;color:var(--muted);margin:0 0 5px;letter-spacing:.05em;}
  .gSteps{margin:0;padding-left:20px;font-size:13px;line-height:1.55;}
  .gSteps li+li{margin-top:5px;}
  .gWeeksTitle{font-size:17px;margin:4px 0 10px;}
  .gWeeks{display:grid;gap:9px;}
  .gWeek{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 13px;box-shadow:var(--shadow);}
  .gWeek.now{border:2px solid var(--accent);}
  .gWeekHead{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;margin-bottom:7px;}
  .gWeekHead b{font-size:14px;}
  .gWeekHead span{font-size:12px;color:var(--muted);}
  .gWeekGoals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
  .gWeekItem{font-size:12.5px;line-height:1.45;background:var(--bg);border-radius:9px;padding:8px 9px;border-left:5px solid var(--pc);}
  .gWeekItem b{display:block;font-size:11px;margin-bottom:2px;}
  @media(max-width:760px){.gProjects,.gWeekGoals{grid-template-columns:1fr;}}

  /* AI paste export */
  .exportTop{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;}
  .exportBtns{display:flex;gap:6px;flex-wrap:wrap;}
  .exportBtns button{padding:7px 10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;font-size:12px;cursor:pointer;}
  .exportBtns button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .copyBtn{border:none;background:var(--accent);color:#fff;border-radius:10px;padding:9px 13px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .copyState{font-size:11.5px;color:var(--muted);margin-left:8px;}
  .exportText{width:100%;min-height:420px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);color:var(--ink);
    font:12.5px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical;white-space:pre;}

  /* 右サイドドック */
  .sideDock{position:sticky;top:14px;display:grid;gap:14px;min-width:0;}

function copyText(text,done){
  const ok=()=>{if(done)done();};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(ok).catch(()=>{const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();ok();});}
  else{const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();ok();}
}
function copyTaskFromButton(e){
  e.stopPropagation();

  copyText(txt,()=>{const old=b.textContent;b.textContent="済";b.classList.add("copied");setTimeout(()=>{b.textContent=old;b.classList.remove("copied");},1100);});
}
function wdOf(iso){const p=iso.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]).getDay();}
function addDaysIso(baseIso,days){const p=baseIso.split("-").map(Number);const d=new Date(p[0],p[1]-1,p[2]+days);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function tomorrowIso(){return addDaysIso(todayIso(),1);}
function nowMinutes(){const d=new Date();return d.getHours()*60+d.getMinutes();}
function timeMinutes(t){if(!t)return null;const m=t.match(/^(\d{2}):([0-5]\d)$/);return m?Number(m[1])*60+Number(m[2]):null;}
function isOnceEnded(def){
  if(!def||!def.rec||def.rec.type!=="once")return false;
  const ti=todayIso();
  if(def.rec.date<ti)return true;
  if(def.rec.date>ti)return false;
  const tm=timeMinutes(def.time||"");
  return tm!==null&&nowMinutes()>=tm;
}
function customSort(a,b){
  const at=a.time||"",bt=b.time||"";
  if(at&&bt&&at!==bt)return at<bt?-1:1;
  if(at&&!bt)return -1;
  if(!at&&bt)return 1;
  return 0; // 時刻なし同士は登録順（新しいものほど下）を保つ
}
function customForDay(iso){const wd=wdOf(iso);return customDefs.filter(def=>{const r=def.rec;
  if(r.type==="daily")return true; if(r.type==="weekly")return r.days.includes(wd); return r.date===iso&&!isOnceEnded(def);}).sort(customSort);}
function recLabel(r){if(r.type==="daily")return "毎日";
  if(r.type==="weekly")return "毎週 "+r.days.map(d=>DOW[d]).join("・");
  return "📌 "+r.date.slice(5).replace("-","/");}
function timeTag(def){return def.time?'<span class="timeTag">'+esc(def.time)+'</span>':'';}
function taskTextWithTime(def){return (def.time?def.time+" ":"")+def.text;}
function cid(def,iso){return "c|"+def.id+"|"+iso;}
function customCount(iso){const cs=customForDay(iso);let d=0,t=0;cs.forEach(def=>{const id=cid(def,iso);if(isSkip(id))return;t++;if(isDone(id))d++;});return [d,t];}
function customRow(def,iso){const id=cid(def,iso),done=isDone(id),skip=isSkip(id);const g=normalizeGenre(def.g||"その他"),c=gcol(g);
  return '<div class="task'+(done?" done":"")+(skip?" skip":"")+'" onclick="toggle(\''+id+'\')">'+
   '<div class="cb" style="'+(done?"background:"+c+";border-color:"+c:"")+'">'+CHK+'</div>'+
   '<div class="tbody"><div class="meta"><span class="chip" style="background:'+c+'">'+g+'</span>'+
   timeTag(def)+'<span class="w-light">'+recLabel(def.rec)+'</span>'+(skip?' <span class="skipTag">見送り</span>':'')+
   copyBtn('['+g+'] '+recLabel(def.rec)+' '+taskTextWithTime(def))+deferBtn(def)+editDeleteBtns(def.id)+'</div>'+
   '<div class="ttext">'+esc(def.text)+'</div></div></div>';}
function customBlock(iso){const cs=customForDay(iso);if(!cs.length)return "";
  return '<div class="cuHd">＋ 追加した予定・TODO</div>'+cs.map(def=>customRow(def,iso)).join("");}

    .then(r=>r.ok?r.json():r.json().then(x=>Promise.reject(new Error(x.error||"同期エラー"))))
    .then(data=>{calendarSyncing=false;if(!data||!Array.isArray(data.events))throw new Error("応答形式を確認できません");calendarData=data.events;localStorage.setItem(CAL_DATA_KEY,JSON.stringify(calendarData));render();})
    .catch(err=>{calendarSyncing=false;alert("同期できませんでした。\n"+err.message+"\nDockからアプリを開き直し、非公開iCal URLを確認してください。");renderAddPanel();});
}

function todayIso(){const t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");}
function carryOver(){
  const ti=todayIso(), out=[];
  PLAN.forEach((wk,wi)=>wk.days.forEach((day,di)=>{
    if(!day.tasks||day.iso>=ti)return;
    day.tasks.forEach((tk,k)=>{const id=tid(wi,di,k);if(state[id])return;
      out.push({id,iso:day.iso,date:day.d,col:PROJ[tk.p].varc,tag:PROJ[tk.p].name,text:tk.t,blk:isBlk(tk.p,tk.w)});});
  }));
  return out;
}
function weekStartIso(){const t=new Date();const off=(t.getDay()+6)%7;const m=new Date(t.getFullYear(),t.getMonth(),t.getDate()-off);
  return m.getFullYear()+"-"+String(m.getMonth()+1).padStart(2,"0")+"-"+String(m.getDate()).padStart(2,"0");}
function weeklyReset(){
  const ws=weekStartIso(),old=carryOver().filter(o=>o.iso<ws&&!o.blk);if(!old.length)return;
  if(!confirm("先週までの飛ばせるやり残し "+old.length+"件をまとめて見送ります。\n🔒の前提タスク（◎主役の順送り作業）は残します。"))return;
  old.forEach(o=>state[o.id]="s");save();render();
}
function resolveCarry(id){state[id]=1;save();render();}
function skipCarry(id){state[id]="s";save();render();}
function restartFresh(){
  const co=carryOver().filter(o=>!o.blk);if(!co.length)return;
  if(!confirm("今日より前の飛ばせるやり残し "+co.length+"件をまとめて見送ります。\n🔒の前提タスク（◎主役の順送り作業）は残します。\nあとで「見送り中」一覧から戻せます。"))return;
  co.forEach(o=>{state[o.id]="s";});save();render();
}
function skippedList(){
  const out=[];
  PLAN.forEach((wk,wi)=>wk.days.forEach((day,di)=>{if(!day.tasks)return;
    day.tasks.forEach((tk,k)=>{const id=tid(wi,di,k);if(isSkip(id))out.push({id,date:day.d,col:PROJ[tk.p].varc,tag:PROJ[tk.p].name,text:tk.t});});}));
  customDefs.forEach(def=>{Object.keys(state).forEach(kk=>{
    if(state[kk]==="s"&&kk.indexOf("c|"+def.id+"|")===0){const iso=kk.split("|")[2],g=normalizeGenre(def.g||"その他");
      out.push({id:kk,date:iso.slice(5).replace("-","/"),col:gcol(g),tag:g,text:taskTextWithTime(def)});}});});
  return out;
}
function customDefById(id){return customDefs.find(d=>d.id===id);}
function endedCustomList(){
  const out=[],seen=new Set();
  Object.keys(state).forEach(k=>{
    if(state[k]!==1||k.indexOf("c|")!==0)return;
    const parts=k.split("|");
    const def=customDefById(parts[1]);if(!def)return;
    const iso=parts[2]||todayIso(),g=normalizeGenre(def.g||"その他");
    seen.add(k);
    out.push({id:k,defId:def.id,iso,date:iso.slice(5).replace("-","/"),col:gcol(g),tag:g,text:taskTextWithTime(def),status:"完了",done:true});
  });
  customDefs.forEach(def=>{
    if(!def.rec||def.rec.type!=="once"||!isOnceEnded(def))return;
    const id=cid(def,def.rec.date);
    if(state[id]===1||state[id]==="s"||seen.has(id))return;
    const g=normalizeGenre(def.g||"その他");
    out.push({id,defId:def.id,iso:def.rec.date,date:def.rec.date.slice(5).replace("-","/"),col:gcol(g),tag:g,text:taskTextWithTime(def),status:"終了",done:false});
  });
  return out.sort((a,b)=>{
    const ak=a.iso+" "+(customDefById(a.defId)?.time||"99:99");
    const bk=b.iso+" "+(customDefById(b.defId)?.time||"99:99");

  });

function daysLeft(){const a=new Date(todayIso()),b=new Date("2026-08-20");return Math.max(0,Math.round((b-a)/86400000));}
function blockerProjection(blk){

function normalizeTimeInput(value){
  const v=(value||"").trim();
  if(!v)return "";
  const m=v.match(/^(\d{1,2}):([0-5]\d)$/);
  if(!m)return null;
  const h=Number(m[1]);
  if(h<0||h>23)return null;
  if(Number(m[2])%30!==0)return null;
  return String(h).padStart(2,"0")+":"+m[2];
}
function isIsoDate(value){
  return /^\d{4}-\d{2}-\d{2}$/.test(value||"");
}
function parseGenreInput(value,current){
  const v=normalizeGenre((value||"").trim());
  if(!v)return current;
  const keys=Object.keys(GENRES);
  const n=Number(v);
  if(Number.isInteger(n)&&n>=1&&n<=keys.length)return keys[n-1];
  return GENRES[v]?v:null;
}
function recEditKind(r){
  if(!r)return "日付指定";
  if(r.type==="daily")return "毎日";
  if(r.type==="weekly")return "曜日指定";
  if(r.type==="once"){
    if(r.date===effectiveTodayIso())return "今日だけ";
    if(r.date===tomorrowIso())return "明日だけ";
    return "日付指定";
  }
  return "日付指定";
}
function parseRecKind(value,current){
  const v=(value||"").trim().toLowerCase();
  if(!v)return current;
  if(["1","今日","今日だけ","today"].includes(v))return "今日だけ";
  if(["2","明日","明日だけ","tomorrow"].includes(v))return "明日だけ";
  if(["3","日付","日付指定","date","once"].includes(v))return "日付指定";
  if(["4","毎日","daily"].includes(v))return "毎日";
  if(["5","曜日","曜日指定","weekly","week"].includes(v))return "曜日指定";
  return null;
}
function weekdayLabel(days){
  return (days&&days.length?days:[]).map(d=>DOW[d]).join("");
}
function parseWeekdays(value,currentDays){
  const v=(value||"").trim();
  if(!v)return currentDays&&currentDays.length?[...currentDays]:[];
  const found=[];
  for(const ch of v){
    const idx=DOW.indexOf(ch);
    if(idx>=0&&!found.includes(idx))found.push(idx);
  }
  if(!found.length){
    v.split(/[,\s、，]+/).forEach(part=>{
      if(part==="")return;
      const n=Number(part);
      if(Number.isInteger(n)&&n>=0&&n<=6&&!found.includes(n))found.push(n);
    });
  }
  return found.sort((a,b)=>a-b);
}
function editDef(arg,idMaybe){
  const id=idMaybe||arg;
  if(arg&&arg.stopPropagation)arg.stopPropagation();
  const def=customDefs.find(d=>d.id===id);
  if(!def)return;
  const text=prompt("内容を修正",def.text||"");
  if(text===null)return;
  const clean=text.trim();
  if(!clean){alert("内容を空にはできません。");return;}
  const currentGenre=normalizeGenre(def.g||"その他");
  const genre=prompt("ジャンルを修正\n1 今日やる / 2 日常業務 / 3 私用 / 4 その他",currentGenre);
  if(genre===null)return;
  const cleanGenre=parseGenreInput(genre,currentGenre);
  if(!cleanGenre){alert("ジャンルは 今日やる / 日常業務 / 私用 / その他 から選んでください。番号も使えます。");return;}
  const time=prompt("時刻を修正（例 09:30。空欄なら時刻なし。30分刻み）",def.time||"");
  if(time===null)return;
  const cleanTime=normalizeTimeInput(time);
  if(cleanTime===null){alert("時刻は 09:00 / 09:30 の形で入力してください。空欄も使えます。");return;}
  const currentKind=recEditKind(def.rec);
  const kindText=prompt("出し方を修正\n1 今日だけ / 2 明日だけ / 3 日付指定 / 4 毎日 / 5 曜日指定",currentKind);
  if(kindText===null)return;
  const nextKind=parseRecKind(kindText,currentKind);
  if(!nextKind){alert("出し方は 今日だけ / 明日だけ / 日付指定 / 毎日 / 曜日指定 から選んでください。番号も使えます。");return;}
  let nextRec;
  if(nextKind==="今日だけ")nextRec={type:"once",date:effectiveTodayIso()};
  else if(nextKind==="明日だけ")nextRec={type:"once",date:tomorrowIso()};
  else if(nextKind==="毎日")nextRec={type:"daily"};
  else if(nextKind==="日付指定"){
    const defaultDate=(def.rec&&def.rec.type==="once")?def.rec.date:effectiveTodayIso();
    const date=prompt("日付を修正（YYYY-MM-DD）",defaultDate);
    if(date===null)return;
    if(!isIsoDate(date)){alert("日付は 2026-06-26 の形で入力してください。");return;}
    nextRec={type:"once",date};
  }else{
    const currentDays=(def.rec&&def.rec.type==="weekly")?def.rec.days:[wdOf(effectiveTodayIso())];
    const daysText=prompt("曜日を修正（日月火水木金土の組み合わせ。例: 月水金）",weekdayLabel(currentDays));
    if(daysText===null)return;
    const days=parseWeekdays(daysText,currentDays);
    if(!days.length){alert("曜日を1つ以上指定してください。例: 月水金");return;}
    nextRec={type:"weekly",days};
  }
  def.text=clean;
  def.g=cleanGenre;
  def.time=cleanTime;
  def.rec=nextRec;
  saveCustom();
  render();
}
function deferDef(arg,idMaybe){
  const id=idMaybe||arg;
  if(arg&&arg.stopPropagation)arg.stopPropagation();
  const def=customDefs.find(d=>d.id===id);
  if(!def||!def.rec||def.rec.type!=="once")return;
  const oldDate=def.rec.date;
  const base=oldDate<todayIso()?todayIso():oldDate; // 過去日のものは今日基準で明日へ
  const next=addDaysIso(base,1);
  delete state[cid(def,oldDate)]; // 元の日のチェック状態は持ち越さない
  def.rec.date=next;
  saveCustom();save();render();
}

}

function backupPayload(){

function backupFilename(){

let _backupFileHandle=null;
async function downloadBackup(){
  const json=JSON.stringify(backupPayload(),null,2);
  const st=document.getElementById("saveStatus");
  // 同じファイルに上書き保存（ダウンロードに溜まらない）。対応ブラウザ(Chrome/Edge等)のみ。
  if(window.showSaveFilePicker){
    try{
      if(!_backupFileHandle){
        _backupFileHandle=await window.showSaveFilePicker({
          suggestedName:"三本立てTODOバックアップ.json",
          types:[{description:"JSON",accept:{"application/json":[".json"]}}]
        });
      }
      const w=await _backupFileHandle.createWritable();
      await w.write(json); await w.close();
      if(st)st.textContent="バックアップを上書き保存しました";
      return;
    }catch(e){
      if(e&&e.name==="AbortError")return; // ユーザーがキャンセル
      _backupFileHandle=null; // 失敗時は下のフォールバックへ
    }
  }
  // フォールバック(Safari等)：固定ファイル名で書き出し
  const blob=new Blob([json],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="三本立てTODOバックアップ.json";
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},0);
}
function chooseBackupFile(){
  const input=document.getElementById("backupFile");
  if(input){input.value="";input.click();}
}
function importBackup(event){
  const input=event.target,file=input.files&&input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!data||typeof data!=="object"||typeof data.state!=="object"||!Array.isArray(data.customDefs)){
        throw new Error("バックアップ形式が違います");
      }
      if(!confirm("このバックアップを復元します。現在のチェック状態と追加TODOは置き換わります。よろしいですか？"))return;
      state=data.state||{};
      customDefs=data.customDefs||[];
      if(data.musicState||data.music){
        musicState=musicNormalize(data.musicState||data.music);
        musicSave(true);
      }
      if(data.taskRouletteState){
        taskRouletteState=taskRouletteNormalize(data.taskRouletteState);
        taskRouletteSave(true);
      }
      save();
      saveCustom();
      render();
      alert("復元しました。");
    }catch(e){
      alert("復元できませんでした: "+e.message);
    }
  };
  reader.readAsText(file);
}

// ---- progress ----
function counts(){
  let tot=0,done=0; const byP={"シ":[0,0],"eBay":[0,0],"学校":[0,0]};
  PLAN.forEach((wk,wi)=>wk.days.forEach((day,di)=>{
    if(!day.tasks) return;
    day.tasks.forEach((tk,ti)=>{
      const id=tid(wi,di,ti); if(isSkip(id)) return;
      tot++; byP[tk.p][0]++;
      if(isDone(id)){done++; byP[tk.p][1]++;}
    });
  }));
  return {tot,done,byP};
}
function weekCount(wi){
  let t=0,d=0;
  PLAN[wi].days.forEach((day,di)=>{ if(!day.tasks)return;
    day.tasks.forEach((tk,ti)=>{const id=tid(wi,di,ti);if(isSkip(id))return;t++; if(isDone(id))d++;});});
  return [d,t];
}
function dayCount(wi,di){
  const day=PLAN[wi].days[di]; if(!day.tasks)return[0,0];
  let d=0,t=0; day.tasks.forEach((tk,ti)=>{const id=tid(wi,di,ti);if(isSkip(id))return;t++;if(isDone(id))d++;});
  return [d,t];
}

function todayIndex(){
  const t=new Date(); const iso=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
  let idx=flat.findIndex(f=>f.ref.iso===iso);

function musicCreateDefaultState(){

function musicMigrateUnit(unit){
  if(!unit)return unit;
  if(unit.trackId==="vocalSong")return {...unit,trackId:MUSIC_DAILY_TRACK_ID,trackName:"賛美",source:unit.source||"daily"};
  return unit;
}
function musicNormalize(input){
  const base=musicCreateDefaultState(), src=input&&typeof input==="object"?input:{};

    migrated.praise=migrated.vocalSong;
    migrated.praise.projectName=migrated.praise.projectName||MUSIC_DEFAULT_PROJECTS.praise;
  }
  const next={...base,...src,options:{...base.options,...(src.options||{})},setup:{...base.setup,...(src.setup||{})},progress:{...base.progress,...migrated},todayPlan:src.todayPlan||base.todayPlan,history:Array.isArray(src.history)?src.history.map(musicMigrateUnit):[]};
  MUSIC_TRACKS.forEach(track=>{next.progress[track.id]={...base.progress[track.id],...(next.progress[track.id]||{})};});
  if(Array.isArray(next.todayPlan?.units))next.todayPlan.units=next.todayPlan.units.map(musicMigrateUnit);
  if(!next.todayPlan||next.todayPlan.date!==todayIso())next.todayPlan={date:todayIso(),units:[]};

}
function musicLoadState(){return musicNormalize(readJson(MUSIC_KEY,musicCreateDefaultState()));}

function musicTrack(id){return MUSIC_TRACKS.find(t=>t.id===id);}
function musicEnsureTodayPlan(){

  return musicState.todayPlan;
}
function musicCloneProgress(){return JSON.parse(JSON.stringify(musicState.progress||{}));}
function musicNextStepFor(track,progress){
  const item=progress[track.id]||{piece:1,step:1,projectName:MUSIC_DEFAULT_PROJECTS[track.id]||track.name};
  const stepIndex=track.randomizeSteps?Math.floor(Math.random()*track.steps.length):Math.max(0,Math.min(track.steps.length-1,item.step-1));
  return {trackId:track.id,trackName:track.name,projectName:item.projectName||`${track.name} ${item.piece}${track.pieceLabel||"作目"}`,piece:item.piece,step:stepIndex+1,totalSteps:track.steps.length,title:track.steps[stepIndex],minutes:musicState.options?.minutesPerUnit||30};
}
function musicAdvanceProgressFor(track,progress){
  const item=progress[track.id];if(!item)return;
  if(track.randomizeSteps){item.step=Math.floor(Math.random()*track.steps.length)+1;return;}
  if(item.step>=track.steps.length){
    item.step=1;item.piece+=1;item.completedPieces+=1;
    if(!item.projectName||item.projectName===MUSIC_DEFAULT_PROJECTS[track.id])item.projectName=`${track.name} ${item.piece}${track.pieceLabel||"作目"}`;
  }else item.step+=1;
}
function musicAdvanceActualByUnit(unit){
  const track=musicTrack(unit.trackId);if(!track)return;
  const item=musicState.progress[track.id];if(!item)return;
  if(unit.piece>item.piece){item.piece=unit.piece;item.step=unit.step;}
  if(unit.piece===item.piece&&unit.step>=item.step)item.step=unit.step;
  musicAdvanceProgressFor(track,musicState.progress);
}
function musicUnitId(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():"mu-"+Date.now()+"-"+Math.random().toString(36).slice(2);}
function musicCreateUnitFromNext(next,source){
  return {id:musicUnitId(),kind:"track",source,date:todayIso(),trackId:next.trackId,trackName:next.trackName,projectName:next.projectName,piece:next.piece,step:next.step,totalSteps:next.totalSteps,title:next.title,minutes:next.minutes,status:"planned",note:"",createdAt:new Date().toISOString(),completedAt:null};
}
function musicRecentTrackCounts(days){
  const threshold=Date.now()-days*24*60*60*1000;
  return (musicState.history||[]).reduce((counts,item)=>{const time=new Date(item.completedAt||item.createdAt).getTime();if(time>=threshold&&item.trackId)counts[item.trackId]=(counts[item.trackId]||0)+1;return counts;},{});
}
function musicDrawTrack(){
  const roulette=MUSIC_TRACKS.filter(track=>!track.daily), enabled=roulette.filter(track=>musicState.progress[track.id]?.enabled), candidates=enabled.length?enabled:roulette;
  const recent=musicRecentTrackCounts(14), weighted=candidates.map(track=>{
    const done=recent[track.id]||0, progress=musicState.progress[track.id]||{}, penalty=progress.completedPieces>=track.targetPieces?0.45:1;
    return {track,weight:Math.max(0.2,penalty/(1+done*0.34))};
  });
  const total=weighted.reduce((sum,item)=>sum+item.weight,0);let point=Math.random()*total;
  for(const item of weighted){point-=item.weight;if(point<=0)return item.track;}
  return weighted[weighted.length-1].track;
}
function musicBuildVirtualProgress(units){
  const virtual=musicCloneProgress();
  (units||[]).filter(unit=>unit.kind==="track"&&unit.status!=="done"&&unit.status!=="skipped").forEach(unit=>{
    const track=musicTrack(unit.trackId);if(!track)return;
    const item=virtual[track.id];if(!item)return;
    if(unit.piece>item.piece||(unit.piece===item.piece&&unit.step>=item.step)){item.piece=unit.piece;item.step=unit.step;musicAdvanceProgressFor(track,virtual);}
  });
  return virtual;
}
function musicIsDailyUnit(unit){return unit.trackId===MUSIC_DAILY_TRACK_ID||unit.source==="daily";}
function musicIsRouletteUnit(unit){return unit.kind==="track"&&!musicIsDailyUnit(unit);}
function musicCreateNextUnit(track,virtual,source){
  const next=musicNextStepFor(track,virtual), unit=musicCreateUnitFromNext(next,source);
  musicAdvanceProgressFor(track,virtual);
  return unit;
}
function musicSortUnits(units){
  return (units||[]).slice().sort((a,b)=>{
    const ao=musicIsDailyUnit(a)?0:1, bo=musicIsDailyUnit(b)?0:1;
    if(ao!==bo)return ao-bo;
    return new Date(a.createdAt||0).getTime()-new Date(b.createdAt||0).getTime();
  });
}
function musicRollTodayUnits(rouletteCount=MUSIC_ROULETTE_UNITS){
  const today=musicEnsureTodayPlan(), preserved=today.units.filter(unit=>unit.status==="done");
  const virtual=musicBuildVirtualProgress(preserved), units=[...preserved];
  if(!units.some(musicIsDailyUnit)){
    const daily=musicTrack(MUSIC_DAILY_TRACK_ID);if(daily)units.push(musicCreateNextUnit(daily,virtual,"daily"));
  }
  const need=Math.max(0,rouletteCount-units.filter(musicIsRouletteUnit).length);
  for(let i=0;i<need;i++)units.push(musicCreateNextUnit(musicDrawTrack(),virtual,"roulette"));
  musicState.todayPlan={date:todayIso(),units:musicSortUnits(units)};
  musicSave();
}
function musicRerollOpen(){
  const plan=musicEnsureTodayPlan(), open=Math.max(1,plan.units.filter(unit=>unit.status!=="done"&&musicIsRouletteUnit(unit)).length);
  musicRollTodayUnits(open);
}
function musicAddRouletteUnits(count){
  const plan=musicEnsureTodayPlan(), virtual=musicBuildVirtualProgress(plan.units), units=plan.units.slice();
  for(let i=0;i<count;i++)units.push(musicCreateNextUnit(musicDrawTrack(),virtual,"roulette"));
  musicState.todayPlan={date:todayIso(),units:musicSortUnits(units)};
  musicSave();
}
function musicToggleUnit(event,id){
  if(event)event.stopPropagation();
  const unit=musicEnsureTodayPlan().units.find(x=>x.id===id);if(!unit)return;
  if(unit.status==="done"){
    unit.status="planned";unit.completedAt=null;
    musicState.history=(musicState.history||[]).filter(item=>item.id!==id);
  }else{
    unit.status="done";unit.completedAt=new Date().toISOString();
    musicAdvanceActualByUnit(unit);
    musicState.history=[{...unit},...(musicState.history||[])];
  }
  musicSave();
}
function musicToggleTrack(event,id,enabled){
  if(event)event.stopPropagation();
  if(musicState.progress[id])musicState.progress[id].enabled=enabled;
  musicSave();
}
function musicStepTrack(event,id,delta){
  if(event)event.stopPropagation();
  const track=musicTrack(id), progress=musicState.progress[id];if(!track||!progress)return;
  progress.step+=delta;
  if(progress.step<1){if(progress.piece>1){progress.piece-=1;progress.step=track.steps.length;progress.completedPieces=Math.max(0,progress.completedPieces-1);}else progress.step=1;}
  if(progress.step>track.steps.length){progress.step=1;progress.piece+=1;progress.completedPieces+=1;}
  musicSave();
}
function musicUnitCard(unit,index){

function musicDetailRows(){

    const progress=musicState.progress[track.id]||{}, stepIndex=Math.max(0,Math.min(track.steps.length-1,(progress.step||1)-1));

    const control=track.daily?'<span class="musicScore">固定</span>':'<label class="musicToggle"><input type="checkbox" '+(progress.enabled?'checked':'')+' onchange="musicToggleTrack(event,\''+track.id+'\',this.checked)">抽選</label>';

function musicMarkdownLines(){

const TASK_ROULETTE_KEY="task_roulette_v1";
function taskRouletteDefaultState(){
  return {version:1,tasks:[],history:[],selectedTaskId:null,savedAt:null};
}
function taskRouletteNormalize(input){
  const base=taskRouletteDefaultState(), src=input&&typeof input==="object"?input:{};
  const tasks=Array.isArray(src.tasks)?src.tasks.map(item=>{
    if(typeof item==="string")return {id:taskRouletteId(),text:item,source:"legacy",createdAt:new Date().toISOString()};
    return {id:item.id||taskRouletteId(),text:String(item.text||"").trim(),source:item.source||"unknown",createdAt:item.createdAt||new Date().toISOString()};
  }).filter(item=>item.text):[];
  const history=Array.isArray(src.history)?src.history.map(item=>{
    if(typeof item==="string")return {id:taskRouletteId(),text:item,at:new Date().toISOString()};
    return {id:item.id||taskRouletteId(),text:String(item.text||"").trim(),at:item.at||new Date().toISOString()};
  }).filter(item=>item.text).slice(0,40):[];
  return {...base,...src,tasks,history,selectedTaskId:src.selectedTaskId||null,savedAt:src.savedAt||null};
}
function taskRouletteLoadState(){return taskRouletteNormalize(readJson(TASK_ROULETTE_KEY,taskRouletteDefaultState()));}
let taskRouletteState=taskRouletteLoadState();
function taskRouletteId(){
  return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():"tr-"+Date.now()+"-"+Math.random().toString(36).slice(2);
}
function taskRouletteSave(skipRender){
  taskRouletteState.savedAt=new Date().toISOString();
  localStorage.setItem(TASK_ROULETTE_KEY,JSON.stringify(taskRouletteState));
  markSaved();
  if(!skipRender)renderTaskRouletteDock();
}
function taskRouletteNormalizeLine(line){
  return String(line||"").trim()
    .replace(/^\[[ xX]\]\s*/,"")
    .replace(/^[-*・]\s*/,"")
    .replace(/^[0-9０-９]+[.)．、]\s*/,"")
    .trim();
}
function taskRouletteParse(text){
  return String(text||"").split(/\r?\n/).map(taskRouletteNormalizeLine).filter(Boolean);
}
function taskRouletteAddTasks(lines,source){
  const dedupe=document.getElementById("taskRouletteDedupe")?.checked!==false;
  const existing=new Set(taskRouletteState.tasks.map(task=>task.text));
  let added=0,skipped=0;
  lines.forEach(line=>{
    const text=taskRouletteNormalizeLine(line);if(!text)return;
    if(dedupe&&existing.has(text)){skipped++;return;}
    taskRouletteState.tasks.push({id:taskRouletteId(),text,source:source||"manual",createdAt:new Date().toISOString()});
    existing.add(text);added++;
  });
  if(added){taskRouletteSave();taskRouletteSetMessage(added+"件追加しました"+(skipped?"（重複"+skipped+"件除外）":"")+"。","ok");}
  else taskRouletteSetMessage(skipped?"重複のため追加しませんでした。":"追加できるタスクがありません。","ng");
}
function taskRouletteAddFromInput(){
  const input=document.getElementById("taskRouletteInput");if(!input)return;
  const lines=taskRouletteParse(input.value);
  taskRouletteAddTasks(lines,"manual");
  if(lines.length)input.value="";
}
function taskRouletteChooseFile(){
  const input=document.getElementById("taskRouletteFile");if(input){input.value="";input.click();}
}
function taskRouletteDecode(buffer){
  let text=new TextDecoder("utf-8").decode(buffer);
  if((text.match(/\uFFFD/g)||[]).length){
    try{text=new TextDecoder("shift_jis").decode(buffer);}catch(e){}
  }
  return text;
}
function taskRouletteImportFile(event){
  const input=event.target,file=input.files&&input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    const text=taskRouletteDecode(reader.result);
    taskRouletteAddTasks(taskRouletteParse(text),file.name);
    input.value="";
  };
  reader.onerror=()=>taskRouletteSetMessage("ファイルを読み込めませんでした。","ng");
  reader.readAsArrayBuffer(file);
}
function taskRouletteSelected(){
  return taskRouletteState.tasks.find(task=>task.id===taskRouletteState.selectedTaskId)||null;
}
function taskRouletteDraw(){

  const task=taskRouletteState.tasks[Math.floor(Math.random()*taskRouletteState.tasks.length)];
  taskRouletteState.selectedTaskId=task.id;
  taskRouletteState.history=[{id:taskRouletteId(),text:task.text,at:new Date().toISOString()},...(taskRouletteState.history||[])].slice(0,40);

function taskRouletteKey(event){

function taskRouletteMarkdownLines(){

    lines.push("- 候補一覧:");
    current.tasks.slice(0,30).forEach(task=>lines.push("  - "+task.text));
    if(current.tasks.length>30)lines.push("  - ...ほか "+(current.tasks.length-30)+"件");
  }else lines.push("- 候補なし");
  return lines.join("\n");
}
function renderTaskRouletteDock(){
  const dock=document.getElementById("taskRouletteDock");if(!dock)return;
  taskRouletteState=taskRouletteLoadState();
  const selected=taskRouletteSelected();
  const count=document.getElementById("taskRouletteCount");
  const result=document.getElementById("taskRouletteResultText");
  const btns=document.getElementById("taskRouletteResultBtns");
  const list=document.getElementById("taskRouletteList");
  if(count)count.textContent=taskRouletteState.tasks.length+"件";
  if(result)result.textContent=selected?selected.text:"回す";
  if(btns)btns.classList.toggle("on",!!selected);
  if(!list)return;
  list.innerHTML="";
  if(!taskRouletteState.tasks.length){
    list.innerHTML='<div class="empty">候補がありません</div>';
    return;
  }
  taskRouletteState.tasks.forEach(task=>{
    const row=document.createElement("div");
    row.className="taskRouletteItem"+(task.id===taskRouletteState.selectedTaskId?" selected":"");
    const text=document.createElement("span");
    text.textContent=task.text;
    const del=document.createElement("button");
    del.type="button";del.textContent="削除";
    del.addEventListener("click",()=>taskRouletteDelete(task.id));
    row.append(text,del);
    list.appendChild(row);
  });
}

function taskRow(wi,di,ti,tk){
  const id=tid(wi,di,ti), done=isDone(id), skip=isSkip(id), blk=isBlk(tk.p,tk.w);
  const day=PLAN[wi].days[di], cp='['+day.d+'('+day.dow+')] ['+PROJ[tk.p].name+'] '+(tk.w==="main"?"◎ 主役":"○ 軽め")+(blk?' 🔒':'')+' '+tk.t;
  return '<div class="task'+(done?' done':'')+(skip?' skip':'')+'" onclick="toggle(\''+id+'\')">'+
    '<div class="cb" style="'+(done?'background:'+PROJ[tk.p].varc+';border-color:'+PROJ[tk.p].varc:'')+'">'+CHK+'</div>'+
    '<div class="tbody"><div class="meta">'+chip(tk.p)+wlabel(tk.w)+(blk?' <span class="blkTag">🔒 飛ばせない</span>':'')+(skip?' <span class="skipTag">見送り</span>':'')+copyBtn(cp)+'</div>'+
    '<div class="ttext">'+tk.t+'</div></div></div>';

    const [tt,dd]=byP[p]; const pc=tt?Math.round(dd/tt*100):0;

const PHASEMAP={
 "シ":{0:"① 起動・準備",1:"② 認識精度の立て直し",2:"② 認識精度の立て直し",3:"③ MVP化・外装準備",4:"④ 外装（BUILD14）",5:"⑤ 提出",6:"⑥ 審査・公開・記録",7:"⑥ 審査・公開・記録"},
 "eBay":{0:"① 旧eBay計画の記録",1:"② 旧eBay候補選定",2:"③ 旧計画からヤフオクへ切替",3:"④ 第2セットまで（200枚）",4:"⑤ 第3・4セット（400枚）",5:"⑥ 第5・6セット（600枚）",6:"⑦ 第7・8セット（800枚）",7:"⑧ 第9・10セット（1000枚）"},
 "学校":{0:"① 現状把握",1:"② KGサイトの文面",2:"③ 紹介者の材料＋検索整備",3:"③ 紹介者の材料＋検索整備",4:"④ 信用棚（Instagram）・サイト差し替え",5:"⑤ 仕上げ・確定",6:"⑥ 送付・受け・記録",7:"⑥ 送付・受け・記録"}
};
function phaseOf(p,wi){return PHASEMAP[p][wi];}
function renderMap(){
  let html="";
  ["シ","学校","eBay"].forEach(p=>{
    const order=[],buckets={};
    PLAN.forEach((wk,wi)=>wk.days.forEach((day,di)=>{ if(!day.tasks)return;
      day.tasks.forEach((tk,ti)=>{ if(tk.p!==p)return; const ph=phaseOf(p,wi);
        if(!buckets[ph]){buckets[ph]={tasks:[],done:0,tot:0};order.push(ph);}
        const id=tid(wi,di,ti);
        buckets[ph].tasks.push({wi,di,ti,tk,d:day.d});
        if(!isSkip(id)){buckets[ph].tot++; if(isDone(id))buckets[ph].done++;}
      });
    }));
    let pd=0,pt=0;order.forEach(ph=>{pd+=buckets[ph].done;pt+=buckets[ph].tot;});
    const ppct=pt?Math.round(pd/pt*100):0;
    html+='<details class="mapProj" open><summary><span class="chip" style="background:'+PROJ[p].varc+'">'+PROJ[p].name+'</span><span class="mpPct">'+pd+'/'+pt+'・'+ppct+'%</span></summary>';
    order.forEach(ph=>{const o=buckets[ph];const pc=o.tot?Math.round(o.done/o.tot*100):0;
      html+='<div class="mapPhase"><div class="mpHd">'+ph+'<span class="mpHdc">'+o.done+'/'+o.tot+'</span></div>'+
        '<div class="mpMeter"><div class="mpFill" style="width:'+pc+'%;background:'+PROJ[p].varc+'"></div></div>'+
        o.tasks.map(x=>'<div class="mapRow"><span class="mpDate">'+x.d+'</span>'+taskRow(x.wi,x.di,x.ti,x.tk)+'</div>').join("")+
      '</div>';});
    html+='</details>';
  });
  document.getElementById("view-map").innerHTML=html;
}

// ---- AIへ貼る用コピー ----
let exportMode="carry";
function setExportMode(m){exportMode=m;renderExportPanel();}
function planItemsForDay(wi,di){
  const day=PLAN[wi].days[di]; if(!day.tasks)return [];
  return day.tasks.map((tk,ti)=>{const id=tid(wi,di,ti);
    return {id,iso:day.iso,date:day.d,dow:day.dow,project:PROJ[tk.p].name,weight:tk.w==="main"?"◎ 主役":"○ 軽め",blk:isBlk(tk.p,tk.w),text:tk.t,done:isDone(id),skip:isSkip(id),kind:"計画"};
  });
}
function customItemsForIso(iso){
  const f=flat.find(x=>x.ref.iso===iso),date=f?f.ref.d:iso.slice(5).replace("-","/"),dow=f?f.ref.dow:"";
  return customForDay(iso).map(def=>{const id=cid(def,iso),g=normalizeGenre(def.g||"その他");
    return {id,iso,date,dow,project:g,weight:recLabel(def.rec),blk:false,time:def.time||"",text:def.text,done:isDone(id),skip:isSkip(id),kind:"追加"};
  });
}
function taskMark(o){return o.skip?"[~]":(o.done?"[x]":"[ ]");}
function taskLine(o,withDate){
  const lock=o.blk?" 🔒":"";
  const d=withDate?o.date+"("+o.dow+") ":"";
  const tm=o.time?o.time+" ":"";
  return "- "+taskMark(o)+" "+d+"["+o.project+"] "+o.weight+lock+" "+tm+o.text;
}
function todayFlatIndex(){return todayIndex();}
function weekItems(wi){
  let out=[];
  PLAN[wi].days.forEach((day,di)=>{out=out.concat(planItemsForDay(wi,di),customItemsForIso(day.iso));});
  return out;
}
function allPlanItems(){
  let out=[];
  PLAN.forEach((wk,wi)=>wk.days.forEach((day,di)=>{out=out.concat(planItemsForDay(wi,di));}));
  return out;
}
function customDefsMd(){
  if(!customDefs.length)return "";
  return "\n## 自分の追加TODO（定義）\n"+customDefs.map(def=>"- ["+normalizeGenre(def.g||"その他")+"] "+taskTextWithTime(def)+"（"+recLabel(def.rec)+"）").join("\n");
}
function exportMarkdown(){
  const idx=todayFlatIndex(),f=flat[idx],wk=PLAN[f.wi],day=f.ref;
  const {tot,done,byP}=counts(),coArr=carryOver(),blkN=coArr.filter(o=>o.blk).length;
  let title="",items=[],withDate=false,note="";
  if(exportMode==="today"){
    title="今日のタスク";
    items=planItemsForDay(f.wi,f.di).concat(customItemsForIso(day.iso));
  }else if(exportMode==="carry"){
    title="繰り越し＋今日のタスク";
    items=coArr.map(o=>({id:o.id,iso:o.iso,date:o.date,dow:"",project:o.tag,weight:o.blk?"◎ 主役":"繰り越し",blk:o.blk,text:o.text,done:false,skip:false,kind:"繰り越し"}))
      .concat(planItemsForDay(f.wi,f.di),customItemsForIso(day.iso));
    withDate=true;
  }else if(exportMode==="week"){
    title="表示中の週のタスク";
    items=weekItems(flat[cur].wi);
    withDate=true;
    note="表示中の週: "+PLAN[flat[cur].wi].w+" "+PLAN[flat[cur].wi].range+" / "+PLAN[flat[cur].wi].goal;
  }else if(exportMode==="undone"){
    title="全未完タスク";
    items=allPlanItems().filter(o=>!o.done&&!o.skip);
    withDate=true;
    note="追加TODOは下の定義欄を参照。毎日・曜日指定は全日展開せず定義だけ載せています。";
  }else{
    title="全計画タスク";
    items=allPlanItems();
    withDate=true;
    note="追加TODOは下の定義欄を参照。";
  }
  const undone=items.filter(o=>!o.done&&!o.skip).length,doneN=items.filter(o=>o.done).length,skipN=items.filter(o=>o.skip).length;
  const lines=[
    "# 三本立て毎日TODO - "+title,
    "",
    "- 生成日: "+todayIso(),
    "- 今日表示: "+day.d+"("+day.dow+") / "+wk.w+" "+wk.range,
    "- 全体進捗: "+done+"/"+tot+"（シ "+byP["シ"][1]+"/"+byP["シ"][0]+" / 学校 "+byP["学校"][1]+"/"+byP["学校"][0]+" / ヤフオク "+byP["eBay"][1]+"/"+byP["eBay"][0]+"）",
    "- 繰り越し: "+coArr.length+"件（🔒前提 "+blkN+"件）",
    "- この出力内: 未完 "+undone+" / 完了 "+doneN+" / 見送り "+skipN,
    "",
    "## 使い方メモ",
    "- [ ] 未完 / [x] 完了 / [~] 見送り",
    "- 🔒 は飛ばせない前提タスク",
    note?("- "+note):"",
    "",
    "## タスク",
    items.length?items.map(o=>taskLine(o,withDate)).join("\n"):"- （対象タスクなし）"
  ].filter(x=>x!==null&&x!==undefined&&x!=="");
  lines.push(musicMarkdownLines());
  lines.push(taskRouletteMarkdownLines());
  if(exportMode==="undone"||exportMode==="plan")lines.push(customDefsMd());
  return lines.join("\n");
}
function renderExportPanel(){
  const btn=(m,l)=>'<button class="'+(exportMode===m?'on':'')+'" onclick="setExportMode(\''+m+'\')">'+l+'</button>';
  document.getElementById("view-export").innerHTML=
    '<div class="panel"><h3>AIに貼る用</h3>'+
    '<p class="hint">下のMarkdownをコピーして、そのままAIに貼れます。チェック状況・繰り越し・🔒前提タスクも含めます。</p>'+
    '<div class="exportTop"><div class="exportBtns">'+
      btn("today","今日")+btn("carry","繰り越し＋今日")+btn("week","表示中の週")+btn("undone","全未完")+btn("plan","全計画")+
    '</div><div><button class="copyBtn" onclick="copyExport()">コピー</button><span id="copyState" class="copyState"></span></div></div>'+
    '<textarea id="exportText" class="exportText" readonly>'+esc(exportMarkdown())+'</textarea></div>';
}
function copyExport(){
  const ta=document.getElementById("exportText"),st=document.getElementById("copyState");if(!ta)return;
  const ok=()=>{if(st)st.textContent="コピーしました";setTimeout(()=>{if(st)st.textContent="";},1800);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(ok).catch(()=>{ta.select();document.execCommand("copy");ok();});}
  else{ta.select();document.execCommand("copy");ok();}
}

function render(){
  updateSaveStatus();
  renderProgress();
  if(document.body.classList.contains("tmode")){ renderToday(); return; }
