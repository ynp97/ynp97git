<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シューティング見本</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: #0b1026;
    color: #e8ecff;
    font-family: -apple-system, "Hiragino Sans", sans-serif;
    height: 100%;
    overflow: hidden;
    touch-action: none;
  }
  #wrap {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%;
  }
  canvas {
    background: linear-gradient(#0b1026, #141b3a);
    border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    max-width: 96vw; max-height: 78vh;
    touch-action: none;
  }
  #hint {
    margin-top: 10px; font-size: 13px; color: #8b93c4; text-align: center;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="400" height="600"></canvas>
  <div id="hint">← → で移動　スペースで発射　（スマホは指でドラッグ＝移動・タップ＝発射）</div>
</div>
<script>
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

let state, player, bullets, enemies, particles, score, lives, spawnTimer, tick;

function reset() {
  state = 'start';
  player = { x: W/2, y: H - 60, w: 34, h: 26, cool: 0 };
  bullets = [];
  enemies = [];
  particles = [];
  score = 0;
  lives = 3;
  spawnTimer = 0;
  tick = 0;
}
reset();

const keys = {};
addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') e.preventDefault();
  if (state !== 'play' && (e.key === ' ' || e.key === 'Enter')) start();
});
addEventListener('keyup', e => keys[e.key] = false);

// タッチ / マウス操作
let pointerX = null;
function pos(e){ const r = cv.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e; return (t.clientX - r.left) * (W / r.width); }
cv.addEventListener('touchstart', e => { e.preventDefault(); if (state!=='play'){start();return;} pointerX = pos(e); shoot(); }, {passive:false});
cv.addEventListener('touchmove',  e => { e.preventDefault(); pointerX = pos(e); }, {passive:false});
cv.addEventListener('touchend',   e => { e.preventDefault(); pointerX = null; }, {passive:false});
cv.addEventListener('mousedown',  e => { if (state!=='play'){start();return;} pointerX = pos(e); shoot(); });
cv.addEventListener('mousemove',  e => { if (pointerX !== null) pointerX = pos(e); });
addEventListener('mouseup', () => pointerX = null);

function start(){ reset(); state = 'play'; }

function shoot(){
  if (player.cool > 0) return;
  bullets.push({ x: player.x, y: player.y - 16, r: 4 });
  player.cool = 10;
}

function spawnEnemy(){
  const size = 22 + Math.random()*14;
  enemies.push({
    x: 30 + Math.random()*(W-60), y: -size,
    w: size, h: size,
    vx: (Math.random()-0.5)*1.4,
    vy: 1 + Math.random()*1.2 + score*0.0008,
    hue: 20 + Math.random()*40
  });
}

function burst(x, y, hue){
  for (let i=0;i<12;i++){
    const a = Math.random()*Math.PI*2, s = 1+Math.random()*3;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 30, hue });
  }
}

function update(){
  tick++;
  // 自機
  if (keys['ArrowLeft'] || keys['a']) player.x -= 5;
  if (keys['ArrowRight']|| keys['d']) player.x += 5;
  if (pointerX !== null) player.x += (pointerX - player.x) * 0.3;
  player.x = Math.max(player.w/2, Math.min(W - player.w/2, player.x));
  if (keys[' ']) shoot();
  if (player.cool > 0) player.cool--;

  // 弾
  bullets.forEach(b => b.y -= 8);
  bullets = bullets.filter(b => b.y > -10);

  // 敵の発生
  spawnTimer--;
  if (spawnTimer <= 0){ spawnEnemy(); spawnTimer = Math.max(22, 55 - score*0.02); }

  // 敵の移動
  enemies.forEach(en => {
    en.x += en.vx; en.y += en.vy;
    if (en.x < en.w/2 || en.x > W - en.w/2) en.vx *= -1;
  });

  // 当たり判定：弾 × 敵
  for (let i = enemies.length-1; i>=0; i--){
    const en = enemies[i];
    for (let j = bullets.length-1; j>=0; j--){
      const b = bullets[j];
      if (Math.abs(b.x-en.x) < en.w/2 && Math.abs(b.y-en.y) < en.h/2){
        burst(en.x, en.y, en.hue);
        enemies.splice(i,1); bullets.splice(j,1);
        score += 10;
        break;
      }
    }
  }

  // 敵が下まで到達 or 自機に接触
  for (let i = enemies.length-1; i>=0; i--){
    const en = enemies[i];
    const hitPlayer = Math.abs(en.x-player.x) < (en.w+player.w)/2-6 && Math.abs(en.y-player.y) < (en.h+player.h)/2-4;
    if (en.y > H + en.h || hitPlayer){
      if (hitPlayer) burst(player.x, player.y, 200);
      enemies.splice(i,1);
      lives--;
      if (lives <= 0) state = 'over';
    }
  }

  // パーティクル
  particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.life--; });
  particles = particles.filter(p => p.life > 0);
}

function drawShip(x, y){
  ctx.fillStyle = '#6df3ff';
  ctx.beginPath();
  ctx.moveTo(x, y-16);
  ctx.lineTo(x-16, y+12);
  ctx.lineTo(x, y+5);
  ctx.lineTo(x+16, y+12);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#ffd76b';
  ctx.fillRect(x-3, y+5, 6, 9);
}

function draw(){
  ctx.clearRect(0,0,W,H);

  // 星
  for (let i=0;i<40;i++){
    const y = (i*57 + tick*1.5) % H;
    ctx.fillStyle = 'rgba(255,255,255,'+(0.15+(i%5)*0.1)+')';
    ctx.fillRect((i*97)%W, y, 2, 2);
  }

  // パーティクル
  particles.forEach(p => {
    ctx.fillStyle = `hsla(${p.hue},90%,60%,${p.life/30})`;
    ctx.fillRect(p.x, p.y, 3, 3);
  });

  // 弾
  ctx.fillStyle = '#ffe27a';
  bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); });

  // 敵
  enemies.forEach(en => {
    ctx.fillStyle = `hsl(${en.hue},85%,55%)`;
    ctx.beginPath();
    ctx.arc(en.x, en.y, en.w/2, 0, 7);
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(en.x-6, en.y-3, 4, 4);
    ctx.fillRect(en.x+2, en.y-3, 4, 4);
  });

  // 自機
  if (state !== 'over') drawShip(player.x, player.y);

  // HUD
  ctx.fillStyle = '#e8ecff';
  ctx.font = 'bold 18px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('スコア ' + score, 12, 26);
  ctx.textAlign = 'right';
  ctx.fillText('❤'.repeat(Math.max(0,lives)), W-12, 26);

  // 画面
  ctx.textAlign = 'center';
  if (state === 'start'){
    ctx.fillStyle = 'rgba(11,16,38,0.7)';
    ctx.fillRect(0, H/2-90, W, 180);
    ctx.fillStyle = '#6df3ff';
    ctx.font = 'bold 30px sans-serif';
    ctx.fillText('シューティング見本', W/2, H/2-20);
    ctx.fillStyle = '#e8ecff';
    ctx.font = '16px sans-serif';
    ctx.fillText('スペース / タップ で スタート', W/2, H/2+20);
  }
  if (state === 'over'){
    ctx.fillStyle = 'rgba(11,16,38,0.75)';
    ctx.fillRect(0, H/2-90, W, 180);
    ctx.fillStyle = '#ff7a9c';
    ctx.font = 'bold 32px sans-serif';
    ctx.fillText('ゲームオーバー', W/2, H/2-20);
    ctx.fillStyle = '#e8ecff';
    ctx.font = '18px sans-serif';
    ctx.fillText('スコア ' + score, W/2, H/2+14);
    ctx.font = '15px sans-serif';
    ctx.fillStyle = '#8b93c4';
    ctx.fillText('スペース / タップ で もう一度', W/2, H/2+44);
  }
}

function loop(){
  if (state === 'play') update();
  else tick++;
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
